  computed: {
    // ============================================================
    // CHART DATA (v2.7.1: memasok <app-chart-*> di V_Dashboard)
    // ============================================================
    jpDonut() {
      const lulus = (this.dashboardData && this.dashboardData.pegawai_lulus_20jp) || 0;
      const total = (this.dashboardData && this.dashboardData.total_pegawai) || 0;
      const sisa = Math.max(0, total - lulus);
      return {
        labels: ['Tuntas Target', 'Dalam Proses'],
        datasets: [{ label: 'Target JP', data: [lulus, sisa] }],
        colors: ['#059669', '#cbd5e1']
      };
    },
    rumpunBar() {
      const jc = (this.dashboardData && this.dashboardData.jenis_count) || {};
      return {
        labels: ['Manajerial', 'Teknis Gakda', 'Teknis Damkar', 'Fungsional', 'Bimtek'],
        datasets: [{ label: 'Jumlah Pelatihan', data: [
          jc['Manajerial & Kepemimpinan'] || 0,
          jc['Teknis Penegakan Perda (PPNS)'] || 0,
          jc['Teknis Pemadam & Rescue'] || 0,
          jc['Jabatan Fungsional Pol PP & Damkar'] || 0,
          jc['Bimbingan Teknis & Workshop'] || 0

      };
    },

    // ============================================================
    // ROLE COMPUTED
    // ============================================================
    isAdmin() {
      const r = String((this.currentUser && this.currentUser.role) || "").toLowerCase();
      return r === "admin" || r === "super";
    },
    isVerifikator() {
      const r = String((this.currentUser && this.currentUser.role) || "").toLowerCase();
      return r === "verifikator" || r === "admin" || r === "super";
    },
    isPegawaiOnly() {
      return !this.isAdmin && !this.isVerifikator;
    },

    // ============================================================
    // Profil & Paspor Personal
    // ============================================================
    activePegawaiDetail() {
      const pid = this.activeProfilePegawaiId ||
        (this.currentUser && this.currentUser.pegawai_id) || "";
      const list = (this.simpegLookup && this.simpegLookup.pegawai && this.simpegLookup.pegawai.length)
        ? this.simpegLookup.pegawai
        : (this.masterPegawaiList || []);
      const p = list.find(x => String(x.id || x.pegawai_id) === String(pid)) || list[0] || {};
      return p;
    },
    activePegawaiJabatan() {
      const p = this.activePegawaiDetail || {};
      if (p.nama_jabatan) return p.nama_jabatan;
      const jList = (this.simpegLookup && this.simpegLookup.jabatan) || [];
      const j = jList.find(x => String(x.id || x.jabatan_id) === String(p.jabatan_id));
      return j ? (j.nama_jabatan || j.nama) : (p.jabatan_id || "Staf Satpol PP & Damkar");
    },
    activePegawaiUnit() {
      const p = this.activePegawaiDetail || {};
      if (p.nama_unit) return p.nama_unit;
      const uList = (this.simpegLookup && this.simpegLookup.unit) || [];
      const u = uList.find(x => String(x.id || x.unit_id) === String(p.unit_id));
      return u ? (u.nama_unit || u.nama) : "Satpol PP & Damkar Trenggalek";
    },
    activePegawaiTargetJp() {
      const p = this.activePegawaiDetail || {};
      return (String(p.status_pegawai || "").toUpperCase() === "PPPK") ? 24 : 20;
    },
    activePegawaiRiwayat() {
      const pid = String((this.activePegawaiDetail && (this.activePegawaiDetail.id || this.activePegawaiDetail.pegawai_id)) || "");
      return (this.kompetensiList || []).filter(r => String(r.pegawai_id) === pid);
    },
    // v5.4.0 FIX: exclude riwayat tanpa tanggal.
    activePegawaiRiwayatTahun() {
      const yr = Number(this.activeProfileYear) || new Date().getFullYear();
      return (this.activePegawaiRiwayat || []).filter(r => {
        const rawDate = r.tgl_mulai || r.tgl_selesai || r.tgl_terbit;
        if (!rawDate) return false;

        let d;
        try { d = new Date(String(rawDate)); }
        catch(e) { return false; }
        if (!d || isNaN(d.getTime())) return false;

        return d.getFullYear() === yr
            && String(r.status_verifikasi).toLowerCase() === "disetujui";
      });
    },
    activePegawaiTotalJpTahun() {
      return (this.activePegawaiRiwayatTahun || []).reduce((sum, r) => sum + (Number(r.jumlah_jp) || 0), 0);
    },
    activePegawaiPersenJp() {
      const target = this.activePegawaiTargetJp || 20;
      const total = this.activePegawaiTotalJpTahun || 0;
      return Math.min(100, Math.round((total / target) * 100));
    },
    activePegawaiIsJpLulus() {
      return this.activePegawaiTotalJpTahun >= this.activePegawaiTargetJp;
    },
    // v5.4.0 FIX: perbandingan standar vs jabatan konsisten.
    activePegawaiSkjList() {
      const p = this.activePegawaiDetail || {};
      const jid = String(p.jabatan_id || "").toLowerCase().trim();
      const jNama = String(this.activePegawaiJabatan || "").toLowerCase().trim();
      const allStandar = this.standarList || [];
      const allKatalog = this.katalogList || [];
      const myRiwayat = this.activePegawaiRiwayat || [];

      const relevantStandar = allStandar.filter(std => {
        const sJid  = String(std.jabatan_id || "").toLowerCase().trim();
        const sNama = String(std.nama_jabatan || "").toLowerCase().trim();
        // v5.4.2 FIX: prioritaskan match by ID saja (strict) kalau jid
        // tersedia. Fallback by nama hanya jika jid kosong, dan HANYA
        // fallback kalau nama unik (tidak mungkin duplikat).
        if (jid) {
          // Strict: hanya match yang jabatan_id-nya persis sama
          if (sJid && sJid === jid) return true;
          // Kalau nama jabatan di SKJ kosong, match by nama PEGAWAI saja
          if (!sJid && jNama && sNama === jNama) return true;
          return false;
        }
        // Fallback: match by nama (hanya kalau pegawai tidak punya jabatan_id)
        return jNama && sNama && (sNama === jNama || sNama.includes(jNama));
      });

      return relevantStandar.map(std => {
        const did = String(std.diklat_id || "");
        const dObj = allKatalog.find(k => String(k.id) === did);
        const namaDiklat = dObj ? dObj.nama_diklat : did;
        const rumpun = dObj ? (dObj.rumpun || "Teknis Operasional") : "Teknis Operasional";

        const sertif = myRiwayat.find(r =>
          (String(r.diklat_id) === did || String(r.nama_kegiatan || "").toLowerCase().includes(namaDiklat.toLowerCase())) &&
          String(r.status_verifikasi).toLowerCase() === "disetujui"
        );

        return {
          id: std.id,
          diklat_id: did,
          nama_diklat: namaDiklat,
          rumpun: rumpun,
          tingkat_kebutuhan: std.tingkat_kebutuhan || "WAJIB",
          minimal_jp: Number(std.minimal_jp) || 20,
          is_terpenuhi: Boolean(sertif),
          sertifikat: sertif || null
        };
      });
    },
    activePegawaiRencanaList() {
      const pid = String((this.activePegawaiDetail && (this.activePegawaiDetail.id || this.activePegawaiDetail.pegawai_id)) || "");
      return (this.usulanList || []).filter(u => String(u.pegawai_id) === pid);
    },

    // ============================================================
    // RENCANA DIKLAT — Filter + Pagination
    // ============================================================
    filteredRencanaList() {
      const q = String(this.filterRencanaSearch || "").toLowerCase().trim();
      const tw = String(this.filterRencanaTw || "").trim();
      const st = String(this.filterRencanaStatus || "").trim();
      const th = this.filterRencanaTahun;

      return (this.usulanList || []).filter(u => {
        if (th) {
          const y = Number(u.tahun_anggaran || u.tahun_anggaran_target || 0);
          if (y !== Number(th)) return false;
        }

        const prog = String(u.nama_program_diklat || u.nama_diklat_usulan || "").toLowerCase();
        const pegNama = this.getPegawaiNama(u.pegawai_id) || this.namaPegawai(u.pegawai_id) || "";
        const peg = String(pegNama).toLowerCase();
        const unit = String(this.namaUnit(u.unit_id) || "").toLowerCase();
        const matchQ = !q || prog.includes(q) || peg.includes(q) || unit.includes(q);

        const triwulan = String(u.periode_triwulan || "");
        const matchTw = !tw || triwulan.includes(tw);

        const status = String(u.status_rencana || (u.is_terealisasi ? "Terealisasi" : "Direncanakan"));
        const matchSt = !st || status.toLowerCase() === st.toLowerCase();

        return matchQ && matchTw && matchSt;
      });
    },
    paginatedRencanaList() {
      const p = this.rencanaPagination.page;
      const l = this.rencanaPagination.limit;
      return this.filteredRencanaList.slice((p - 1) * l, p * l);
    },
    rencanaTotalPages() {
      const l = this.rencanaPagination.limit;
      return Math.max(1, Math.ceil(this.filteredRencanaList.length / l));
    },

    showAuthSplash() {
      return !this.token && (this.isProcessing || this.isSsoLoading || this.hasSsoTicket);
    },
    showAuthLogin() {
      return !this.token && !this.isProcessing && !this.isSsoLoading && !this.hasSsoTicket;
    },
    showSettingsTab() {
      return this.currentPage === "pengaturan" && this.isAdmin;
    },
    hasSsoTicket() {
      try {
        if (window.__SSO_TICKET__) return true;
        if (window.__IS_SSO_ENTRY__ === true) return true;
        const urlParams = new URLSearchParams(window.location.search);
        return Boolean(urlParams.get("ticket"));
      } catch (e) {
        return false;
      }
    },

    hasAnalisaTemuan() {
      return Boolean(this.analisaData && this.analisaData.temuan && this.analisaData.temuan.length > 0);
    },

    // v5.4.1: single definition (duplikat dihapus)
    filteredAnalisaGap() {
      const q = String(this.analisaSearch || "").toLowerCase().trim();
      const unit = String(this.analisaFilterUnit || "").trim();
      const keb = String(this.analisaFilterKebutuhan || "").trim().toUpperCase();
      const stat = String(this.analisaFilterStatus || "").trim().toUpperCase();
      const self = this;

      const allowedUnitIds = unit ? self._unitIdsInSubtree(unit) : null;

      return (this.analisaData.gap_details || []).filter(g => {
        const peg = String(g.nama_pegawai || this.namaPegawai(g.pegawai_id) || "").toLowerCase();
        const nip = String(g.nip || "").toLowerCase();
        const jab = String(g.nama_jabatan || "").toLowerCase();
        const dkl = String(g.nama_diklat || "").toLowerCase();
        const un = String(g.nama_unit || "").toLowerCase();

        const matchQ = !q || peg.includes(q) || nip.includes(q) || jab.includes(q) || dkl.includes(q) || un.includes(q);

        let matchUnit = true;
        if (allowedUnitIds && allowedUnitIds.length > 0) {
          const gUnitId = String(g.unit_id || "").toLowerCase();
          matchUnit = allowedUnitIds.indexOf(gUnitId) !== -1;
        }

        const matchKeb = !keb || String(g.tingkat_kebutuhan || "").toUpperCase() === keb;

        const matchStat = !stat
          || String(g.status_pegawai || g.status || "").toUpperCase() === stat;

        return matchQ && matchUnit && matchKeb && matchStat;
      });
    },

    paginatedAnalisaGap() {
      const p = this.analisaPagination.page;
      const l = this.analisaPagination.limit;
      return this.filteredAnalisaGap.slice((p - 1) * l, p * l);
    },
    analisaTotalPages() {
      const l = this.analisaPagination.limit;
      return Math.max(1, Math.ceil(this.filteredAnalisaGap.length / l));
    },

    // ============ TAB 1: KATALOG DIKLAT ============
    filteredKatalogDiklat() {
      const q = String(this.katalogSearch || "").toLowerCase().trim();
      const rm = String(this.filterKatalogRumpun || "").toLowerCase().trim();
      return (this.katalogList || []).filter(d => {
        if (rm && String(d.rumpun || "").toLowerCase().trim() !== rm) return false;
        if (q) {
          const hay = [
            d.nama_diklat, d.kode_diklat, d.kategori_keahlian,
            d.rumpun, d.penyelenggara_default
          ].map(x => String(x || "").toLowerCase().trim()).join(" ");
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },
    paginatedKatalogDiklat() {
      const p = this.katalogPagination.page;
      const l = this.katalogPagination.limit;
      return this.filteredKatalogDiklat.slice((p - 1) * l, p * l);
    },
    katalogTotalPages() {
      const l = this.katalogPagination.limit;
      return Math.max(1, Math.ceil(this.filteredKatalogDiklat.length / l));
    },

    // ============ TAB 2: STANDAR JABATAN ============
    filteredStandarList() {
      const q = String(this.filterStandarSearch || "").toLowerCase().trim();
      const jab = String(this.filterStandarJabatan || "").toLowerCase().trim();
      const keb = String(this.filterStandarKebutuhan || "").toUpperCase().trim();
      const self = this;

      return (this.standarList || []).filter(s => {
        if (jab) {
          const sJid = String(s.jabatan_id || "").toLowerCase();
          const sNama = String(s.nama_jabatan || self.namaJabatan(s.jabatan_id) || "").toLowerCase();
          if (sJid !== jab && sNama.indexOf(jab) === -1) return false;
        }
        if (keb && String(s.tingkat_kebutuhan || "").toUpperCase().trim() !== keb) return false;
        if (q) {
          const hay = [
            s.nama_jabatan, s.nama_diklat, s.rumpun,
            s.keterangan, s.level_kompetensi,
            self.namaJabatan(s.jabatan_id), self.namaDiklat(s.diklat_id)
          ].map(x => String(x || "").toLowerCase().trim()).join(" ");
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },
    paginatedStandarList() {
      const p = this.standarPagination.page;
      const l = this.standarPagination.limit;
      return this.filteredStandarList.slice((p - 1) * l, p * l);
    },
    standarTotalPages() {
      const l = this.standarPagination.limit;
      return Math.max(1, Math.ceil(this.filteredStandarList.length / l));
    },

    // ============ TAB 3: REFERENSI ============
    filteredReferensiList() {
      const q = String(this.referensiSearch || "").toLowerCase().trim();
      const kat = String(this.filterKategoriRef || "").toUpperCase().trim();
      return (this.referensiList || []).filter(r => {
        if (kat && String(r.kategori || "").toUpperCase().trim() !== kat) return false;
        if (q) {
          const hay = [
            r.kategori, r.kode, r.nama_nilai, r.keterangan
          ].map(x => String(x || "").toLowerCase().trim()).join(" ");
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },
    paginatedReferensiList() {
      const p = this.referensiPagination.page;
      const l = this.referensiPagination.limit;
      return this.filteredReferensiList.slice((p - 1) * l, p * l);
    },
    referensiTotalPages() {
      const l = this.referensiPagination.limit;
      return Math.max(1, Math.ceil(this.filteredReferensiList.length / l));
    },

    // Opsi jabatan untuk filter Standar
    optionsJabatanFilter() {
      const allStandar = this.standarList || [];
      const jabatanList = this.optionsJabatan || [];
      const usedIds = {};
      allStandar.forEach(s => {
        if (s.jabatan_id) usedIds[String(s.jabatan_id).toLowerCase()] = true;
      });
      return jabatanList.filter(j => {
        const id = String(j.id || j.jabatan_id || j.kode_jabatan || "").toLowerCase();
        return usedIds[id];
      }).sort((a, b) => {
        const na = String(a.nama_jabatan || a.nama || "");
        const nb = String(b.nama_jabatan || b.nama || "");
        return na.localeCompare(nb);
      });
    },

    // ============================================================
    // TAB DIKLAT PORTOFOLIO: Filter + Pagination
    // ============================================================

    optionsBulan() {
      return [
        { value: -1, label: "Semua Bulan" },
        { value: 0,  label: "Januari" },
        { value: 1,  label: "Februari" },
        { value: 2,  label: "Maret" },
        { value: 3,  label: "April" },
        { value: 4,  label: "Mei" },
        { value: 5,  label: "Juni" },
        { value: 6,  label: "Juli" },
        { value: 7,  label: "Agustus" },
        { value: 8,  label: "September" },
        { value: 9,  label: "Oktober" },
        { value: 10, label: "November" },
        { value: 11, label: "Desember" }
      ];
    },

    optionsTahun() {
      const set = new Set();
      const yr = new Date().getFullYear();
      set.add(yr);
      set.add(yr - 1);
      set.add(yr - 2);
      (this.jadwalList || []).forEach(j => {
        const y = j.tgl_mulai ? new Date(j.tgl_mulai).getFullYear() : Number(j.tahun_periode);
        if (y && y > 2000) set.add(y);
      });
      (this.kompetensiList || []).forEach(k => {
        const y = k.tgl_mulai ? new Date(k.tgl_mulai).getFullYear() : 0;
        if (y && y > 2000) set.add(y);
      });
      (this.kualifikasiList || []).forEach(k => {
        const y = k.tgl_sk_terbit ? new Date(k.tgl_sk_terbit).getFullYear() : 0;
        if (y && y > 2000) set.add(y);
      });
      return Array.from(set).sort((a, b) => b - a);
    },

    // v5.4.0 FIX: O(n²) → O(n) pakai Map lookup + level cache.
    optionsUnitFilter() {
      const allUnits = (this.simpegLookup && this.simpegLookup.unit && this.simpegLookup.unit.length)
        ? this.simpegLookup.unit
        : (this.masterUnitList || []);

      const byId = new Map();
      allUnits.forEach(u => {
        const id = String(u.unit_id || u.id || "");
        if (id) byId.set(id, u);
      });

      const levelCache = new Map();
      const levelOf = (u) => {
        const key = String(u.unit_id || u.id || "");
        if (levelCache.has(key)) return levelCache.get(key);

        let cur = u;
        let depth = 0;
        while (cur && cur.parent_unit_id && depth < 8) {
          const pid = String(cur.parent_unit_id);
          const parent = byId.get(pid);
          if (!parent) break;
          cur = parent;
          depth++;
        }
        const lvl = depth + 1;
        levelCache.set(key, lvl);
        return lvl;
      };

      return allUnits
        .map(u => Object.assign({}, u, { _level: levelOf(u) }))
        .filter(u => u._level <= 2)
        .sort((a, b) => {
          const na = String(a.nama_unit || a.nama || "");
          const nb = String(b.nama_unit || b.nama || "");
          return na.localeCompare(nb);
        });
    },

    // ============ TAB 1: JADWAL ============
    filteredJadwalList() {
      const q = String(this.jadwalSearch || "").toLowerCase().trim();
      const th = this.filterJadwalTahun;
      const bl = this.filterJadwalBulan;
      const rm = String(this.filterJadwalRumpun || "").toLowerCase().trim();
      const self = this;

      return (this.jadwalList || []).filter(j => {
        if (th && !self._dateMatchMonthYear(j.tgl_mulai, th, bl)) return false;
        if (rm && String(j.rumpun || "").toLowerCase().trim() !== rm) return false;
        if (q) {
          const hay = [
            j.nama_kegiatan, j.nama_diklat, j.penyelenggara,
            j.rumpun, j.kode_jadwal, j.lokasi_pelaksanaan
          ].map(x => String(x || "").toLowerCase().trim()).join(" ");
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },
    paginatedJadwalList() {
      const p = this.jadwalPagination.page;
      const l = this.jadwalPagination.limit;
      return this.filteredJadwalList.slice((p - 1) * l, p * l);
    },
    jadwalTotalPages() {
      const l = this.jadwalPagination.limit;
      return Math.max(1, Math.ceil(this.filteredJadwalList.length / l));
    },

    // v5.4.0 FIX: search Portofolio match namaPegawai() + nipPegawai().
    filteredKompetensiList() {
      const q = String(this.kompetensiSearch || "").toLowerCase().trim();
      const th = this.filterKompetensiTahun;
      const bl = this.filterKompetensiBulan;
      const unit = String(this.filterKompetensiUnit || "").trim();
      const self = this;

      const allowedUnitIds = unit ? self._unitIdsInSubtree(unit) : null;

      return (this.kompetensiList || []).filter(k => {
        const dateRef = k.tgl_mulai || k.tgl_selesai || k.tgl_terbit;
        if (th && !self._dateMatchMonthYear(dateRef, th, bl)) return false;
        if (allowedUnitIds && allowedUnitIds.length > 0) {
          const pegUnit = self._pegawaiUnitId(k.pegawai_id);
          if (!pegUnit || allowedUnitIds.indexOf(pegUnit) === -1) return false;
        }
        if (q) {
          const hay = [
            k.nama_kegiatan, k.no_sertifikat, k.penyelenggara,
            k.pegawai_id, k.nip, k.nama_pegawai, k.rumpun,
            self.namaPegawai(k.pegawai_id),
            self.nipPegawai(k.pegawai_id),
            self.getPegawaiNama(k.pegawai_id)
          ].map(x => String(x || "").toLowerCase().trim()).join(" ");
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },
    paginatedKompetensiList() {
      const p = this.kompetensiPagination.page;
      const l = this.kompetensiPagination.limit;
      return this.filteredKompetensiList.slice((p - 1) * l, p * l);
    },
    kompetensiTotalPages() {
      const l = this.kompetensiPagination.limit;
      return Math.max(1, Math.ceil(this.filteredKompetensiList.length / l));
    },

    // v5.4.0 FIX: search Lisensi match namaPegawai() + nipPegawai().
    filteredLisensiList() {
      const q = String(this.lisensiSearch || "").toLowerCase().trim();
      const th = this.filterLisensiTahun;
      const jenis = String(this.filterLisensiJenis || "").toLowerCase().trim();
      const self = this;

      return (this.kualifikasiList || []).filter(k => {
        const dateRef = k.tgl_sk_terbit || k.tgl_habis_berlaku;
        if (th && !self._dateMatchMonthYear(dateRef, th, -1)) return false;
        if (jenis && String(k.jenis_kualifikasi || "").toLowerCase().trim() !== jenis) return false;
        if (q) {
          const hay = [
            k.nama_pegawai, k.nip, k.pegawai_id, k.jenis_kualifikasi,
            k.nomor_sk_lisensi, k.no_registrasi_nasional, k.lembaga_penerbit,
            self.namaPegawai(k.pegawai_id),
            self.nipPegawai(k.pegawai_id),
            self.getPegawaiNama(k.pegawai_id)
          ].map(x => String(x || "").toLowerCase().trim()).join(" ");
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },
    paginatedLisensiList() {
      const p = this.lisensiPagination.page;
      const l = this.lisensiPagination.limit;
      return this.filteredLisensiList.slice((p - 1) * l, p * l);
    },
    lisensiTotalPages() {
      const l = this.lisensiPagination.limit;
      return Math.max(1, Math.ceil(this.filteredLisensiList.length / l));
    },

    // ============================================================
    // Opsi Dinamis (Jabatan, Unit, Rumpun, dll)
    // ============================================================
    optionsJabatan() {
      const simpegList = (this.simpegLookup && this.simpegLookup.jabatan) || [];
      const fbList = this.masterJabatanList || [];
      const map = new Map();

      simpegList.forEach(j => {
        const key = String(j.id || j.jabatan_id || j.kode_jabatan || "").trim();
        if (key) map.set(key, j);
      });

      fbList.forEach(j => {
        const key = String(j.id || j.jabatan_id || j.kode_jabatan || "").trim();
        if (key && !map.has(key)) map.set(key, j);
      });

      return Array.from(map.values()).sort((a, b) => {
        const nameA = String(a.nama_jabatan || a.nama || "").toUpperCase();
        const nameB = String(b.nama_jabatan || b.nama || "").toUpperCase();
        return nameA.localeCompare(nameB);
      });
    },

    optionsUnit() {
      const simpegList = (this.simpegLookup && this.simpegLookup.unit) || [];
      const fbList = this.masterUnitList || [];
      const map = new Map();

      simpegList.forEach(u => {
        const key = String(u.id || u.unit_id || u.kode_unit || "").trim();
        if (key) map.set(key, u);
      });

      fbList.forEach(u => {
        const key = String(u.id || u.unit_id || u.kode_unit || "").trim();
        if (key && !map.has(key)) map.set(key, u);
      });

      return Array.from(map.values()).sort((a, b) => {
        const nameA = String(a.nama_unit || a.nama || "").toUpperCase();
        const nameB = String(b.nama_unit || b.nama || "").toUpperCase();
        return nameA.localeCompare(nameB);
      });
    },
    optionsRumpun() {
      const ref = (this.referensiList || []).filter(r => r.kategori === "RUMPUN_KOMPETENSI");
      if (ref.length > 0) return ref;
      // Fallback v5.4.2: 9 rumpun (tambah Lainnya)
      return [
        { id: "1", nama_nilai: "Manajerial & Kepemimpinan" },
        { id: "2", nama_nilai: "Teknis Penegakan Perda (PPNS)" },
        { id: "3", nama_nilai: "Teknis Pemadam & Rescue" },
        { id: "4", nama_nilai: "Jabatan Fungsional Pol PP & Damkar" },
        { id: "5", nama_nilai: "Sosio-Kultural & Pelayanan Publik" },
        { id: "6", nama_nilai: "Bimbingan Teknis & Workshop" },
        { id: "7", nama_nilai: "Digital & Teknologi Informasi" },
        { id: "8", nama_nilai: "Emerging Skills / Adaptif" },
        { id: "9", nama_nilai: "Kemampuan Umum / Teknis Non Jabatan" }
      ];
    },

    optionsLevelKompetensi() {
      return [
        "Level 1 - Pertama / Pelaksana",
        "Level 1 - Terampil / Pelaksana",
        "Level 2 - Pengawas / Terampil",
        "Level 3 - Administrator",
        "Level 4 - JPT Pratama"
      ];
    },

    optionsPenyelenggara() {
      const ref = (this.referensiList || []).filter(r => r.kategori === "PENYELENGGARA");
      if (ref.length > 0) return ref.map(r => r.nama_nilai);
      return [
        "BPSDM Provinsi Jawa Timur",
        "BPSDM Kementerian Dalam Negeri",
        "BKPSDM Kabupaten Trenggalek",
        "Pusdiklat Penanggulangan Kebakaran & Penyelamatan Ciracas",
        "Badan Nasional Pencarian & Pertolongan (BASARNAS)",
        "Lembaga Administrasi Negara (LAN RI)",
        "Satpol PP & Damkar Kabupaten Trenggalek",
        "Kementerian Hukum dan HAM RI",
        "Lainnya (Tulis Manual)..."
      ];
    },

    optionsUrgensi() {
      const ref = (this.referensiList || []).filter(r => r.kategori === "URGENSI_USULAN");
      if (ref.length > 0) return ref;
      return [
        { id: "1", nama_nilai: "Sangat Mendesak (Prioritas 1)" },
        { id: "2", nama_nilai: "Mendesak (Prioritas 2)" },
        { id: "3", nama_nilai: "Dukungan Reguler (Prioritas 3)" }
      ];
    },

    sortedPegawaiList() {
      const list = (this.simpegLookup && this.simpegLookup.pegawai && this.simpegLookup.pegawai.length)
        ? this.simpegLookup.pegawai
        : (this.masterPegawaiList || []);
      return list.slice().sort((a, b) => {
        const nameA = String(a.nama_lengkap || a.nama || "").toUpperCase();
        const nameB = String(b.nama_lengkap || b.nama || "").toUpperCase();
        return nameA.localeCompare(nameB);
      });
    },

    currentYearJadwalList() {
      const currentYear = new Date().getFullYear();
      return (this.jadwalList || [])
        .filter(j => {
          if (!j.tahun_periode && !j.tgl_mulai) return true;
          const y = Number(j.tahun_periode) || (j.tgl_mulai ? new Date(j.tgl_mulai).getFullYear() : currentYear);
          return y === currentYear;
        })
        .sort((a, b) => {
          const dateA = a.tgl_mulai ? new Date(a.tgl_mulai).getTime() : 0;
          const dateB = b.tgl_mulai ? new Date(b.tgl_mulai).getTime() : 0;
          return dateB - dateA;
        });
    },

    // ============================================================
    // v5.4.1: Profil — Year Selector dinamis (tahun ini ±2)
    // ============================================================
    profileYearOptions() {
      const y = new Date().getFullYear();
      return [y + 1, y, y - 1, y - 2];
    }
  }
};
