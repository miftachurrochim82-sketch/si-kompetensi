  <!-- Inisialisasi SI-KOMPETENSI via AppCore -->
  <script>
    const SIKompetensiMixin = {
      data() {
        return {
          isSsoLoading: false,
          ssoStatusMessage: '',

          // State Dashboard
          dashboardData: {
            total_kompetensi: 0,
            jenis_count: {},
            terbaru: [],
            divisi_distribution: {}
          },
          dashboardChart: null,

          // State Riwayat Laporan (A5)
          riwayatList: [],
          riwayatTotal: 0,
          riwayatPage: 1,
          riwayatLimit: 10,
          riwayatLoading: false,
          riwayatSearch: '',
          riwayatFilterStatus: '',
          showRiwayatForm: false,
          riwayatSaving: false,
          riwayatForm: {
            id: '',
            pegawai_id: '',
            judul: '',
            jenis: 'Pelatihan Struktural Kepemimpinan',
            institusi: '',
            tanggal_mulai: '',
            tanggal_selesai: '',
            jumlah_jp: 0,
            nomor_sertifikat: '',
            file_url: '',
            deskripsi: '',
            status: 'draft'
          },

          // State Master Data Kompetensi (A8)
          activeMasterTab: 'kompetensi',
          kompetensiList: [],
          kompetensiTotal: 0,
          kompetensiPage: 1,
          kompetensiLimit: 10,
          kompetensiLoading: false,
          kompetensiSearch: '',
          showKompetensiForm: false,
          kompetensiSaving: false,
          kompetensiForm: {
            id: '',
            pegawai_id: '',
            jenis_kompetensi: 'Manajerial',
            nama_kompetensi: '',
            deskripsi: '',
            tanggal_perolehan: '',
            penyelenggara: '',
            jumlah_jp: 0,
            nomor_sertifikat: '',
            file_url: '',
            status_verifikasi: 'menunggu'
          },

          // State Analisa & Rekomendasi (A6)
          analisaData: {
            total_data: 0,
            ringkasan: '',
            by_jenis: {},
            by_divisi: {},
            by_bulan: {},
            temuan: [],
            rekomendasi: []
          },
          analisaLoading: false,
          analisaTahun: new Date().getFullYear(),
          analisaBulan: '',
          tahunList: [],
          bulanList: []
        };
      },

      computed: {
        totalRiwayatPages() {
          return Math.ceil(this.riwayatTotal / this.riwayatLimit) || 1;
        },
        totalKompetensiPages() {
          return Math.ceil(this.kompetensiTotal / this.kompetensiLimit) || 1;
        },
        riwayatStartIdx() {
          if (this.riwayatTotal === 0) return 0;
          return (this.riwayatPage - 1) * this.riwayatLimit + 1;
        },
        riwayatEndIdx() {
          return Math.min(this.riwayatPage * this.riwayatLimit, this.riwayatTotal);
        },
        kompetensiStartIdx() {
          if (this.kompetensiTotal === 0) return 0;
          return (this.kompetensiPage - 1) * this.kompetensiLimit + 1;
        },
        kompetensiEndIdx() {
          return Math.min(this.kompetensiPage * this.kompetensiLimit, this.kompetensiTotal);
        }
      },

      methods: {
        formatDate(isoStr) {
          if (!isoStr) return '-';
          try {
            const d = new Date(isoStr);
            if (isNaN(d.getTime())) return isoStr;
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
          } catch (e) {
            return isoStr;
          }
        },

        todayIso_() {
          return new Date().toISOString().split('T')[0];
        },

        getNamaPegawai(id) {
          if (!id) return '-';
          const p = (this.pegawaiList || []).find(x => String(x.id) === String(id));
          return p ? (p.nama || p.display_name || p.nama_lengkap || id) : id;
        },

        getNipPegawai(id) {
          if (!id) return '-';
          const p = (this.pegawaiList || []).find(x => String(x.id) === String(id));
          return p ? (p.nip || '-') : '-';
        },

        getNamaUnit(id) {
          if (!id) return '-';
          const u = (this.unitList || []).find(x => String(x.id) === String(id));
          return u ? (u.nama || u.nama_unit || id) : id;
        },

        goToPlatform() {
          const platformUrl = this.platformUrl || 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec';
          if (window.top && window.top !== window) {
            window.top.location.href = platformUrl;
          } else {
            window.location.href = platformUrl;
          }
        },

        async loadReferensi(force = false) {
          try {
            await this.loadMasterSIMPEG(force);
          } catch (e) {
            console.error('[loadReferensi] Error:', e);
          }
        },

        async loadDashboard() {
          this.loading = true;
          try {
            const res = await this.callServer('dashboard');
            if (res && res.success) {
              this.dashboardData = Object.assign({
                total_kompetensi: 0,
                jenis_count: {},
                terbaru: [],
                divisi_distribution: {}
              }, res.data || {});
            }
          } catch (e) {
            console.error('Gagal load dashboard:', e);
          } finally {
            this.loading = false;
          }
        },

        async loadRiwayat(page = 1) {
          this.riwayatLoading = true;
          this.riwayatPage = page;
          try {
            const res = await this.callServer('get_riwayat_list', {
              page: this.riwayatPage,
              limit: this.riwayatLimit,
              search: this.riwayatSearch,
              filters: {
                status: this.riwayatFilterStatus
              }
            });
            if (res && res.success) {
              this.riwayatList = res.data || [];
              this.riwayatTotal = (res.meta && res.meta.total) || this.riwayatList.length;
            } else {
              this.showToast((res && res.error) || 'Gagal memuat riwayat laporan', 'error');
            }
          } catch (e) {
            this.showToast('Gagal memuat data riwayat laporan: ' + e.message, 'error');
          } finally {
            this.riwayatLoading = false;
          }
        },

        async loadKompetensi(page = 1) {
          this.kompetensiLoading = true;
          this.kompetensiPage = page;
          try {
            const res = await this.callServer('get_kompetensi_list', {
              page: this.kompetensiPage,
              limit: this.kompetensiLimit,
              search: this.kompetensiSearch
            });
            if (res && res.success) {
              this.kompetensiList = res.data || [];
              this.kompetensiTotal = (res.meta && res.meta.total) || this.kompetensiList.length;
            } else {
              this.showToast((res && res.error) || 'Gagal memuat master kompetensi', 'error');
            }
          } catch (e) {
            this.showToast('Gagal memuat data master kompetensi: ' + e.message, 'error');
          } finally {
            this.kompetensiLoading = false;
          }
        },

        async loadAnalisa() {
          this.analisaLoading = true;
          try {
            const res = await this.callServer('analytics', {
              tahun: this.analisaTahun,
              bulan: this.analisaBulan
            });
            if (res && res.success) {
              this.analisaData = Object.assign({
                total_data: 0,
                ringkasan: '',
                by_jenis: {},
                by_divisi: {},
                by_bulan: {},
                temuan: [],
                rekomendasi: []
              }, res.data || {});
            }
          } catch (e) {
            this.showToast('Gagal memuat analisa kompetensi: ' + e.message, 'error');
          } finally {
            this.analisaLoading = false;
          }
        },

        renderDashboardCharts() {
          this.$nextTick(() => {
            const ctx = document.getElementById('chartKompetensiDivisi');
            if (!ctx) return;
            if (typeof Chart === 'undefined') {
              AppCore.loadScript('https://cdn.jsdelivr.net/npm/chart.js').then(() => {
                this.renderDashboardCharts();
              });
              return;
            }
            if (this.dashboardChart) {
              this.dashboardChart.destroy();
            }

            const isDark = this.isDarkMode;
            const dist = (this.dashboardData && this.dashboardData.divisi_distribution) || {};
            const labels = Object.keys(dist).length > 0 ? Object.keys(dist) : [
              'Sekretariat',
              'Bidang Mutasi & Informasi',
              'Bidang Pengembangan Kompetensi',
              'Bidang Pengadaan & Pembinaan',
              'Inspektorat',
              'Dinas Pendidikan'
            ];
            const dataValues = Object.keys(dist).length > 0 ? Object.values(dist) : [12, 19, 28, 15, 8, 22];

            this.dashboardChart = new Chart(ctx, {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: 'Jumlah Pengembangan Kompetensi',
                  data: dataValues,
                  backgroundColor: isDark ? 'rgba(16, 185, 129, 0.8)' : 'rgba(5, 150, 105, 0.85)',
                  borderColor: isDark ? '#10b981' : '#059669',
                  borderWidth: 1.5,
                  borderRadius: 8
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  legend: { display: false }
                },
                scales: {
                  y: {
                    beginAtZero: true,
                    ticks: {
                      precision: 0,
                      color: isDark ? '#94a3b8' : '#64748b'
                    },
                    grid: {
                      color: isDark ? 'rgba(148, 163, 184, 0.1)' : 'rgba(100, 116, 139, 0.1)'
                    }
                  },
                  x: {
                    ticks: {
                      color: isDark ? '#94a3b8' : '#64748b'
                    },
                    grid: { display: false }
                  }
                }
              }
            });
          });
        },

        openRiwayatForm(item = null) {
          if (item) {
            this.riwayatForm = Object.assign({}, item);
          } else {
            this.riwayatForm = {
              id: '',
              pegawai_id: (this.currentUser && this.currentUser.pegawai_id) || (this.currentUser && this.currentUser.id) || '',
              judul: '',
              jenis: 'Pelatihan Struktural Kepemimpinan',
              institusi: '',
              tanggal_mulai: this.todayIso_(),
              tanggal_selesai: this.todayIso_(),
              jumlah_jp: 10,
              nomor_sertifikat: '',
              file_url: '',
              deskripsi: '',
              status: 'draft'
            };
          }
          this.showRiwayatForm = true;
        },

        async saveRiwayat() {
          this.riwayatSaving = true;
          try {
            const res = await this.callServer('save_riwayat', { record: this.riwayatForm });
            if (res && res.success) {
              this.showToast('Laporan kompetensi berhasil disimpan', 'success');
              this.showRiwayatForm = false;
              await this.loadRiwayat(this.riwayatPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal menyimpan laporan', 'error');
            }
          } catch (e) {
            this.showToast('Terjadi kesalahan saat menyimpan laporan: ' + e.message, 'error');
          } finally {
            this.riwayatSaving = false;
          }
        },

        async deleteRiwayat(item) {
          if (!confirm(`Hapus laporan "${item.judul || item.id}"?`)) return;
          try {
            const res = await this.callServer('delete_riwayat', { id: item.id });
            if (res && res.success) {
              this.showToast('Laporan berhasil dihapus', 'success');
              await this.loadRiwayat(this.riwayatPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal menghapus laporan', 'error');
            }
          } catch (e) {
            this.showToast('Terjadi kesalahan saat menghapus: ' + e.message, 'error');
          }
        },

        async verifikasiRiwayat(item, newStatus) {
          try {
            const res = await this.callServer('verifikasi_riwayat', {
              id: item.id,
              status: newStatus
            });
            if (res && res.success) {
              this.showToast(`Status laporan diperbarui: ${newStatus}`, 'success');
              await this.loadRiwayat(this.riwayatPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal memperbarui status', 'error');
            }
          } catch (e) {
            this.showToast('Terjadi kesalahan saat verifikasi: ' + e.message, 'error');
          }
        },

        openKompetensiForm(item = null) {
          if (item) {
            this.kompetensiForm = Object.assign({}, item);
          } else {
            this.kompetensiForm = {
              id: '',
              pegawai_id: (this.currentUser && this.currentUser.pegawai_id) || (this.currentUser && this.currentUser.id) || '',
              jenis_kompetensi: 'Manajerial',
              nama_kompetensi: '',
              deskripsi: '',
              tanggal_perolehan: this.todayIso_(),
              penyelenggara: '',
              jumlah_jp: 20,
              nomor_sertifikat: '',
              file_url: '',
              status_verifikasi: 'menunggu'
            };
          }
          this.showKompetensiForm = true;
        },

        async saveKompetensi() {
          this.kompetensiSaving = true;
          try {
            const res = await this.callServer('save_kompetensi', { record: this.kompetensiForm });
            if (res && res.success) {
              this.showToast('Master kompetensi berhasil disimpan', 'success');
              this.showKompetensiForm = false;
              await this.loadKompetensi(this.kompetensiPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal menyimpan kompetensi', 'error');
            }
          } catch (e) {
            this.showToast('Terjadi kesalahan saat menyimpan: ' + e.message, 'error');
          } finally {
            this.kompetensiSaving = false;
          }
        },

        async deleteKompetensi(item) {
          if (!confirm(`Hapus kompetensi "${item.nama_kompetensi || item.id}"?`)) return;
          try {
            const res = await this.callServer('delete_kompetensi', { id: item.id });
            if (res && res.success) {
              this.showToast('Kompetensi berhasil dihapus', 'success');
              await this.loadKompetensi(this.kompetensiPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal menghapus kompetensi', 'error');
            }
          } catch (e) {
            this.showToast('Terjadi kesalahan saat menghapus: ' + e.message, 'error');
          }
        },

        async verifikasiKompetensi(item, status) {
          try {
            const res = await this.callServer('verifikasi_kompetensi', {
              id: item.id,
              status_verifikasi: status
            });
            if (res && res.success) {
              this.showToast(`Verifikasi kompetensi berhasil: ${status}`, 'success');
              await this.loadKompetensi(this.kompetensiPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal verifikasi', 'error');
            }
          } catch (e) {
            this.showToast('Terjadi kesalahan verifikasi: ' + e.message, 'error');
          }
        },

        async exportRiwayatExcel() {
          if (typeof XLSX === 'undefined') {
            this.showToast('Memuat pustaka Excel...', 'info');
            await AppCore.loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
          }
          const dataToExport = this.riwayatList.map((r, i) => ({
            'No': i + 1,
            'Nama Pegawai': this.getNamaPegawai(r.pegawai_id),
            'Judul Pelaporan': r.judul || r.nama_laporan || '',
            'Jenis': r.jenis || '',
            'Institusi': r.institusi || '',
            'Tgl Mulai': this.formatDate(r.tanggal_mulai),
            'Tgl Selesai': this.formatDate(r.tanggal_selesai),
            'Jumlah JP': r.jumlah_jp || 0,
            'No Sertifikat': r.nomor_sertifikat || '',
            'Status': r.status || 'draft'
          }));
          const ws = XLSX.utils.json_to_sheet(dataToExport);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Riwayat_Laporan');
          XLSX.writeFile(wb, `Riwayat_Laporan_Kompetensi_${this.todayIso_()}.xlsx`);
        },

        async exportRiwayatPDF() {
          if (typeof jspdf === 'undefined' || !jspdf.jsPDF) {
            this.showToast('Memuat modul PDF...', 'info');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
          }
          const { jsPDF } = jspdf;
          const doc = new jsPDF();
          doc.setFontSize(14);
          doc.text('Daftar Riwayat Laporan Kompetensi', 14, 16);
          const body = this.riwayatList.map((r, i) => [
            i + 1,
            this.getNamaPegawai(r.pegawai_id),
            r.judul || r.nama_laporan || '-',
            r.jenis || '-',
            r.institusi || '-',
            r.jumlah_jp || '0',
            r.status || 'draft'
          ]);
          doc.autoTable({
            startY: 22,
            head: [['No', 'Pegawai', 'Judul', 'Jenis', 'Institusi', 'JP', 'Status']],
            body: body
          });
          doc.save(`Riwayat_Laporan_Kompetensi_${this.todayIso_()}.pdf`);
        },

        async downloadAnalisaPDF() {
          if (typeof jspdf === 'undefined' || !jspdf.jsPDF) {
            this.showToast('Memuat modul PDF...', 'info');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
          }
          const { jsPDF } = jspdf;
          const doc = new jsPDF();
          const a = this.analisaData || {};
          doc.setFontSize(14);
          doc.text('Analisa Pengembangan Kompetensi Pegawai', 14, 16);
          doc.setFontSize(10);
          const ringkas = doc.splitTextToSize(String(a.ringkasan || '-'), 180);
          doc.text(ringkas, 14, 24);
          let y = 24 + ringkas.length * 5 + 4;
          const byJenis = a.by_jenis || {};
          doc.autoTable({ startY: y, head: [['Jenis Kompetensi', 'Jumlah']], body: Object.keys(byJenis).map(k => [k, byJenis[k]]) });
          y = doc.lastAutoTable.finalY + 6;
          const temuan = (a.temuan || []).map(t => `[${t.level}] ${t.pesan}`);
          const rekom = (a.rekomendasi || []).map(r => `[${r.prioritas}] ${r.tindakan}`);
          doc.autoTable({ startY: y, head: [['Temuan']], body: temuan.map(t => [t]) });
          y = doc.lastAutoTable.finalY + 6;
          doc.autoTable({ startY: y, head: [['Rekomendasi']], body: rekom.map(r => [r]) });
          doc.save(`Analisa_Kompetensi_${this.todayIso_()}.pdf`);
        }
      },

      created() {
        const now = new Date().getFullYear();
        this.tahunList = [now, now - 1, now - 2, now - 3, now - 4];
        this.bulanList = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
          'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      },

      mounted() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const t = urlParams.get('ticket') || window.__SSO_TICKET__ || '';
          if (t) {
            this.isSsoLoading = true;
            this.ssoStatusMessage = 'Memvalidasi tiket Single Sign-On...';
            setTimeout(() => {
              if (!this.token) this.ssoStatusMessage = 'Menyinkronkan profil pegawai & hak akses...';
            }, 800);
            setTimeout(() => {
              if (!this.token) this.ssoStatusMessage = 'Mempersiapkan dashboard SI-KOMPETENSI...';
            }, 1600);
          }
        } catch (e) {}
      }
    };

    /* =========================================================
       Bootstrap aplikasi via AppCore (app-core.js dari CDN)
       ========================================================= */
    const app = AppCore.create({
      appTitle: 'SI-KOMPETENSI',
      storagePrefix: 'sikompetensi',
      initialPage: 'dashboard',

      platformUrl: 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec',

      brand: {
        title: 'SI-KOMPETENSI',
        subtitle: 'Pemkab Trenggalek',
        logoChar: 'K',
        logoIcon: 'fa-solid fa-graduation-cap',
        logoSvg: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120' width='100' height='120'%3E%3Cpath d='M50 5 L90 25 V65 C90 90 50 115 50 115 C50 115 10 90 10 65 V25 Z' fill='%23065f46' stroke='%2334d399' stroke-width='4'/%3E%3Cpath d='M50 15 L80 32 V62 C80 82 50 102 50 102 C50 102 20 82 20 62 V32 Z' fill='%23047857'/%3E%3Ccircle cx='50' cy='55' r='18' fill='%2310b981'/%3E%3Cpath d='M50 40 L54 50 L64 50 L56 56 L59 66 L50 60 L41 66 L44 56 L36 50 L46 50 Z' fill='%23fbbf24'/%3E%3Ctext x='50' y='93' font-family='Arial, sans-serif' font-size='9' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3ETRENGGALEK%3E%3C/text%3E%3C/svg%3E"
      },

      menu: [
        { name: 'Utama', items: [
          { id: 'dashboard', label: 'Dashboard', icon: 'fa-solid fa-gauge-high' },
          { id: 'riwayat_laporan', label: 'Riwayat Laporan', icon: 'fa-solid fa-file-lines' },
          { id: 'analisa', label: 'Analisa Kompetensi', icon: 'fa-solid fa-chart-pie' }
        ]},
        { name: 'Manajemen Data', items: [
          { id: 'profil', label: 'Profil Saya', icon: 'fa-solid fa-user-tie' },
          { id: 'master_data', label: 'Master Data', icon: 'fa-solid fa-database' }
        ]},
        { name: 'Sistem', items: [
          { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-solid fa-gear', adminOnly: true }
        ]}
      ],

      pageIcons: {
        dashboard: 'fa-solid fa-gauge-high',
        riwayat_laporan: 'fa-solid fa-file-lines',
        analisa: 'fa-solid fa-chart-pie',
        profil: 'fa-solid fa-user-tie',
        master_data: 'fa-solid fa-database',
        pengaturan: 'fa-solid fa-gear'
      },

      onNavigate(vm, page) {
        if (page === 'dashboard') {
          vm.renderDashboardCharts();
        } else if (page === 'riwayat_laporan') {
          vm.loadRiwayat(1);
          vm.loadedPages['riwayat_laporan'] = true;
        } else if (page === 'master_data') {
          vm.loadKompetensi(1);
          vm.loadedPages['master_data'] = true;
        } else if (page === 'analisa' && !vm.loadedPages['analisa']) {
          vm.loadAnalisa();
          vm.loadedPages['analisa'] = true;
        }
      },

      onDarkToggle(vm) {
        if (vm.currentPage === 'dashboard') vm.renderDashboardCharts();
      },

      async initApp(vm) {
        if (vm.dataLoaded) return;
        await Promise.all([
          vm.loadDashboard(),
          vm.loadReferensi(),
          vm.loadAnalisa()
        ]);
        vm.renderDashboardCharts();
      },

      mixins: [SIKompetensiMixin]
    });

    app.mount('#app');
  </script>
</body>
</html>
