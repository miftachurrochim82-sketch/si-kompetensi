  <!-- SPLASH SCREEN ANIMATIONS -->
  <style>
    @keyframes splashFadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .splash-fade-up { animation: splashFadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .splash-delay-1 { animation-delay: 0.15s; }
    .splash-delay-2 { animation-delay: 0.35s; }
    .splash-delay-3 { animation-delay: 0.55s; }
    .splash-delay-4 { animation-delay: 0.75s; }

    @keyframes splashLogoFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .splash-logo-float { animation: splashLogoFloat 3s ease-in-out infinite; }

    @keyframes splashRingSpin { to { transform: rotate(360deg); } }
    .splash-ring-spin { animation: splashRingSpin 2.2s linear infinite; }

    @keyframes splashRingSpinReverse { to { transform: rotate(-360deg); } }
    .splash-ring-spin-reverse { animation: splashRingSpinReverse 3.2s linear infinite; }

    @keyframes splashGlowPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 0.75; transform: scale(1.08); }
    }
    .splash-glow-pulse { animation: splashGlowPulse 2.5s ease-in-out infinite; }

    @keyframes splashShimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .splash-progress {
      background: linear-gradient(
        90deg,
        rgba(var(--primary-rgb), 0.85) 0%,
        rgba(var(--primary-rgb), 1) 25%,
        var(--primary-accent) 50%,
        rgba(var(--primary-rgb), 1) 75%,
        rgba(var(--primary-rgb), 0.85) 100%
      );
      background-size: 200% 100%;
      animation: splashShimmer 1.6s linear infinite;
    }

    @keyframes splashDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1);   opacity: 1; }
    }
    .splash-dot { animation: splashDot 1.2s ease-in-out infinite; }
    .splash-dot:nth-child(1) { animation-delay: 0s; }
    .splash-dot:nth-child(2) { animation-delay: 0.15s; }
    .splash-dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes splashOrbit {
      from { transform: rotate(0deg) translateX(56px) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(56px) rotate(-360deg); }
    }
    .splash-orbit { animation: splashOrbit 4s linear infinite; }

    .splash-ring {
      border: 2px solid transparent;
      border-top-color: var(--primary);
      border-right-color: var(--primary-accent);
      border-radius: 9999px;
    }
    .splash-ring-thin {
      border: 1.5px solid transparent;
      border-bottom-color: var(--primary-lighter);
      border-left-color: var(--primary-light);
      border-radius: 9999px;
    }

    @keyframes splashBgPulse {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.6; }
    }
    .splash-bg-pulse { animation: splashBgPulse 4s ease-in-out infinite; }
  </style>
