  <!-- Inisialisasi SI-KOMPETENSI via AppCore -->
  <script>
    const SIKompetensiMixin = {
      data() {
        return {
          isSsoLoading: false,
          ssoStatusMessage: '',
          showPanduan: false,
          pageSize: 10,

          // State Dashboard (Opsi B 6-Sheet)
          dashboardData: {
            total_kompetensi: 0,
            total_jp_tahun: 0,
            persen_capaian_20jp: 0,
            pegawai_lulus_20jp: 0,
            total_pegawai: 0,
            total_ppns: 0,
            total_damkar_certified: 0,
            total_usulan_diklat: 0,
            status_count: { disetujui: 0, menunggu: 0, ditolak: 0 },
            jenis_count: {},
            divisi_distribution: {},
            terbaru: []
          },
          dashboardChart: null,

          // State Portofolio / Riwayat Kompetensi (T_KOMPETENSI_PEGAWAI)
          kompetensiList: [],
          kompetensiTotal: 0,
          kompetensiPage: 1,
          kompetensiLoading: false,
          kompetensiSearch: '',
          filterRumpun: '',
          filterStatusVerif: '',
          filterUnit: '',
          showKompetensiForm: false,
          kompetensiSaving: false,
          kompetensiForm: {
            id: '',
            pegawai_id: '',
            diklat_id: '',
            nama_kegiatan: '',
            rumpun: 'Teknis',
            penyelenggara: '',
            no_sertifikat: '',
            tgl_terbit: '',
            tgl_mulai: '',
            tgl_selesai: '',
            tgl_kedaluwarsa: '',
            jumlah_jp: 20,
            metode: 'Klasikal',
            file_url: '',
            status_verifikasi: 'menunggu'
          },

          // Modal Verifikasi (Admin)
          showVerifModal: false,
          selectedKompetensi: null,
          verifForm: { status: 'disetujui', catatan: '' },
          verifSaving: false,

          // State Usulan Diklat Bottom-Up (T_USULAN_DIKLAT)
          usulanList: [],
          usulanLoading: false,
          showUsulanForm: false,
          usulanSaving: false,
          usulanForm: {
            id: '',
            pegawai_id: '',
            diklat_id: '',
            nama_diklat_usulan: '',
            rumpun: 'Teknis',
            target_penyelenggara: '',
            alasan_usulan: '',
            urgensi: 'Tinggi',
            estimasi_biaya: 0,
            status_usulan: 'diajukan'
          },
          showReviewUsulanModal: false,
          selectedUsulan: null,
          reviewUsulanForm: { status: 'disetujui_kasat', catatan: '' },
          reviewUsulanSaving: false,

          // State Analisa & Gap Kebutuhan (A6)
          analisaData: {
            total_data: 0,
            ringkasan: '',
            by_jenis: {},
            by_divisi: {},
            by_bulan: {},
            temuan: [],
            rekomendasi: []
          },
          analisaLoading: false,
          analisaTahun: new Date().getFullYear(),

          // State Master Data & SIMPEG (A8)
          activeMasterTab: 'katalog_diklat',
          katalogDiklatList: [],
          katalogSearch: '',
          pegawaiSearch: '',
          unitSearch: '',
          jabatanSearch: '',
          pegawaiRefPage: 1,
          unitRefPage: 1,
          jabatanRefPage: 1
        };
      },

      computed: {
        hasSsoTicket() {
          try {
            const urlParams = new URLSearchParams(window.location.search);
            return Boolean(window.__SSO_TICKET__ || urlParams.get('ticket'));
          } catch(e) {
            return false;
          }
        },
        kompetensiTotalPages() {
          return Math.max(1, Math.ceil((this.kompetensiTotal || this.kompetensiList.length) / this.pageSize));
        },
        filteredKatalogDiklat() {
          const q = String(this.katalogSearch || '').toLowerCase().trim();
          if (!q) return this.katalogDiklatList || [];
          return (this.katalogDiklatList || []).filter(d =>
            String(d.nama_diklat || '').toLowerCase().includes(q) ||
            String(d.kategori_keahlian || '').toLowerCase().includes(q) ||
            String(d.rumpun || '').toLowerCase().includes(q)
          );
        },
        filteredPegawaiReferensi() {
          const q = String(this.pegawaiSearch || '').toLowerCase().trim();
          if (!q) return this.masterPegawaiList || [];
          return (this.masterPegawaiList || []).filter(p =>
            String(p.nip || '').toLowerCase().includes(q) ||
            String(p.nama_lengkap || p.nama || '').toLowerCase().includes(q) ||
            String(p.pangkat_gol || '').toLowerCase().includes(q)
          );
        },
        filteredUnitReferensi() {
          const q = String(this.unitSearch || '').toLowerCase().trim();
          if (!q) return this.masterUnitList || [];
          return (this.masterUnitList || []).filter(u =>
            String(u.kode_unit || '').toLowerCase().includes(q) ||
            String(u.nama_unit || '').toLowerCase().includes(q)
          );
        },
        filteredJabatanReferensi() {
          const q = String(this.jabatanSearch || '').toLowerCase().trim();
          if (!q) return this.masterJabatanList || [];
          return (this.masterJabatanList || []).filter(j =>
            String(j.kode_jabatan || '').toLowerCase().includes(q) ||
            String(j.nama_jabatan || '').toLowerCase().includes(q)
          );
        }
      },

      methods: {
        // ================= HELPER & LOOKUP =================
        formatDate(isoStr) {
          if (!isoStr) return '-';
          try {
            const d = new Date(isoStr);
            if (isNaN(d.getTime())) return isoStr;
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
          } catch (e) {
            return isoStr;
          }
        },

        namaPegawai(id) {
          if (!id) return '-';
          const p = (this.masterPegawaiList || []).find(x => String(x.id || x.pegawai_id) === String(id));
          return p ? (p.nama_lengkap || p.nama || p.display_name || id) : id;
        },

        namaUnit(id) {
          if (!id) return '-';
          const u = (this.masterUnitList || []).find(x => String(x.id || x.unit_id) === String(id));
          return u ? (u.nama_unit || u.nama || id) : id;
        },

        namaJabatan(id) {
          if (!id) return '-';
          const j = (this.masterJabatanList || []).find(x => String(x.id || x.jabatan_id) === String(id));
          return j ? (j.nama_jabatan || j.nama || id) : id;
        },

        onKatalogSelected() {
          const dkl = (this.katalogDiklatList || []).find(k => String(k.id) === String(this.kompetensiForm.diklat_id));
          if (dkl) {
            this.kompetensiForm.nama_kegiatan = dkl.nama_diklat || '';
            this.kompetensiForm.rumpun = dkl.rumpun || 'Teknis';
            this.kompetensiForm.penyelenggara = dkl.penyelenggara_default || '';
            this.kompetensiForm.jumlah_jp = dkl.default_jp || 20;
          }
        },

        // ================= DASHBOARD =================
        async loadDashboard() {
          this.loading = true;
          try {
            const res = await this.callServer('dashboard', { tahun: this.analisaTahun });
            if (res && res.success) {
              this.dashboardData = Object.assign(this.dashboardData, res.data || {});
            }
          } catch (e) {
            console.error('Gagal load dashboard:', e);
          } finally {
            this.loading = false;
          }
        },

        async renderDashboardCharts() {
          this.$nextTick(() => {
            const ctx = document.getElementById('chartKompetensiDivisi');
            if (!ctx) return;
            if (typeof Chart === 'undefined') {
              AppCore.loadScript('https://cdn.jsdelivr.net/npm/chart.js').then(() => {
                this.renderDashboardCharts();
              });
              return;
            }
            if (this.dashboardChart) this.dashboardChart.destroy();

            const isDark = this.isDarkMode;
            const dist = (this.dashboardData && this.dashboardData.divisi_distribution) || {};
            const labels = Object.keys(dist).length > 0 ? Object.keys(dist) : [
              'Sekretariat',
              'Bid. Gakda & PPNS',
              'Bid. Tibum & Pengawalan',
              'Damkar Pos Induk Kota',
              'Damkar Pos Watulimo',
              'Damkar Pos Panggul',
              'Bid. Linmas'
            ];
            const dataValues = Object.keys(dist).length > 0 ? Object.values(dist) : [14, 22, 28, 30, 16, 12, 10];

            this.dashboardChart = new Chart(ctx, {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: 'Kegiatan Diklat & Sertifikasi',
                  data: dataValues,
                  backgroundColor: isDark ? 'rgba(16, 185, 129, 0.8)' : 'rgba(5, 150, 105, 0.85)',
                  borderColor: isDark ? '#10b981' : '#059669',
                  borderWidth: 1.5,
                  borderRadius: 8
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  y: {
                    beginAtZero: true,
                    ticks: { precision: 0, color: isDark ? '#94a3b8' : '#64748b' },
                    grid: { color: isDark ? 'rgba(148, 163, 184, 0.1)' : 'rgba(100, 116, 139, 0.1)' }
                  },
                  x: {
                    ticks: { color: isDark ? '#94a3b8' : '#64748b' },
                    grid: { display: false }
                  }
                }
              }
            });
          });
        },

        // ================= CRUD KOMPETENSI =================
        async loadKompetensi(page = 1) {
          this.kompetensiLoading = true;
          this.kompetensiPage = page;
          try {
            const res = await this.callServer('get_kompetensi_list', {
              page: this.kompetensiPage,
              limit: this.pageSize,
              search: this.kompetensiSearch,
              filters: {
                rumpun: this.filterRumpun,
                status: this.filterStatusVerif,
                unit_id: this.filterUnit
              }
            });
            if (res && res.success) {
              this.kompetensiList = res.data || [];
              this.kompetensiTotal = (res.meta && res.meta.total) || this.kompetensiList.length;
            }
          } catch (e) {
            this.showToast('Gagal memuat portofolio: ' + e.message, 'error');
          } finally {
            this.kompetensiLoading = false;
          }
        },

        openKompetensiForm(item = null) {
          if (item) {
            this.kompetensiForm = Object.assign({}, item);
          } else {
            this.kompetensiForm = {
              id: '',
              pegawai_id: (this.currentUser && this.currentUser.id) || '',
              diklat_id: '',
              nama_kegiatan: '',
              rumpun: 'Teknis',
              penyelenggara: '',
              no_sertifikat: '',
              tgl_terbit: this.todayIso_(),
              tgl_mulai: this.todayIso_(),
              tgl_selesai: this.todayIso_(),
              tgl_kedaluwarsa: '',
              jumlah_jp: 20,
              metode: 'Klasikal',
              file_url: '',
              status_verifikasi: 'menunggu'
            };
          }
          this.showKompetensiForm = true;
        },

        async saveKompetensi() {
          this.kompetensiSaving = true;
          try {
            const res = await this.callServer('save_kompetensi', { record: this.kompetensiForm });
            if (res && res.success) {
              this.showToast('Data pengembangan kompetensi berhasil disimpan', 'success');
              this.showKompetensiForm = false;
              await this.loadKompetensi(this.kompetensiPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal menyimpan', 'error');
            }
          } catch (e) {
            this.showToast('Terjadi kesalahan: ' + e.message, 'error');
          } finally {
            this.kompetensiSaving = false;
          }
        },

        async deleteKompetensi(item) {
          if (!confirm(`Hapus berkas kompetensi "${item.nama_kegiatan || item.nama_kompetensi || item.id}"?`)) return;
          try {
            const res = await this.callServer('delete_kompetensi', { id: item.id });
            if (res && res.success) {
              this.showToast('Berkas berhasil dihapus', 'success');
              await this.loadKompetensi(this.kompetensiPage);
              this.loadDashboard();
            }
          } catch (e) {
            this.showToast('Gagal menghapus: ' + e.message, 'error');
          }
        },

        openVerifikasiModal(item) {
          this.selectedKompetensi = item;
          this.verifForm = {
            status: 'disetujui',
            catatan: item.catatan_verifikator || ''
          };
          this.showVerifModal = true;
        },

        async submitVerifikasi() {
          if (!this.selectedKompetensi) return;
          this.verifSaving = true;
          try {
            const res = await this.callServer('verifikasi_kompetensi', {
              id: this.selectedKompetensi.id,
              status_verifikasi: this.verifForm.status,
              catatan_verifikator: this.verifForm.catatan
            });
            if (res && res.success) {
              this.showToast(`Status berkas diperbarui: ${this.verifForm.status}`, 'success');
              this.showVerifModal = false;
              await this.loadKompetensi(this.kompetensiPage);
              this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal verifikasi', 'error');
            }
          } catch (e) {
            this.showToast('Kesalahan sistem: ' + e.message, 'error');
          } finally {
            this.verifSaving = false;
          }
        },

        // ================= USULAN DIKLAT =================
        async loadUsulan() {
          this.usulanLoading = true;
          try {
            const res = await this.callServer('get_usulan_list');
            if (res && res.success) {
              this.usulanList = res.data || [];
            }
          } catch (e) {
            console.error('Gagal load usulan:', e);
          } finally {
            this.usulanLoading = false;
          }
        },

        openUsulanForm() {
          this.usulanForm = {
            id: '',
            pegawai_id: (this.currentUser && this.currentUser.id) || '',
            diklat_id: '',
            nama_diklat_usulan: '',
            rumpun: 'Teknis',
            target_penyelenggara: 'BPSDM Jawa Timur',
            alasan_usulan: '',
            urgensi: 'Tinggi',
            estimasi_biaya: 0,
            status_usulan: 'diajukan'
          };
          this.showUsulanForm = true;
        },

        async saveUsulan() {
          this.usulanSaving = true;
          try {
            const res = await this.callServer('save_usulan', { record: this.usulanForm });
            if (res && res.success) {
              this.showToast('Usulan diklat berhasil diajukan ke pimpinan', 'success');
              this.showUsulanForm = false;
              await this.loadUsulan();
            } else {
              this.showToast((res && res.error) || 'Gagal mengajukan usulan', 'error');
            }
          } catch (e) {
            this.showToast('Terjadi kesalahan: ' + e.message, 'error');
          } finally {
            this.usulanSaving = false;
          }
        },

        openReviewUsulanModal(item) {
          this.selectedUsulan = item;
          this.reviewUsulanForm = {
            status: item.status_usulan || 'disetujui_kasat',
            catatan: item.catatan_pimpinan || ''
          };
          this.showReviewUsulanModal = true;
        },

        async submitReviewUsulan() {
          if (!this.selectedUsulan) return;
          this.reviewUsulanSaving = true;
          try {
            const res = await this.callServer('review_usulan', {
              id: this.selectedUsulan.id,
              status_usulan: this.reviewUsulanForm.status,
              catatan_pimpinan: this.reviewUsulanForm.catatan
            });
            if (res && res.success) {
              this.showToast('Status usulan diklat diperbarui', 'success');
              this.showReviewUsulanModal = false;
              await this.loadUsulan();
            } else {
              this.showToast((res && res.error) || 'Gagal mereview', 'error');
            }
          } catch (e) {
            this.showToast('Kesalahan sistem: ' + e.message, 'error');
          } finally {
            this.reviewUsulanSaving = false;
          }
        },

        // ================= ANALISA & GAP =================
        async loadAnalisa() {
          this.analisaLoading = true;
          try {
            const res = await this.callServer('analytics', { tahun: this.analisaTahun });
            if (res && res.success) {
              this.analisaData = Object.assign(this.analisaData, res.data || {});
            }
          } catch (e) {
            console.error('Gagal load analisa:', e);
          } finally {
            this.analisaLoading = false;
          }
        },

        async downloadAnalisaPDF() {
          if (typeof jspdf === 'undefined' || !jspdf.jsPDF) {
            this.showToast('Memuat pustaka PDF...', 'info');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
          }
          const { jsPDF } = jspdf;
          const doc = new jsPDF();
          doc.setFontSize(14);
          doc.text('Analisis Pengembangan Kompetensi Satpol PP & Damkar Trenggalek', 14, 16);
          doc.setFontSize(10);
          const ringkas = doc.splitTextToSize(String(this.analisaData.ringkasan || '-'), 180);
          doc.text(ringkas, 14, 24);
          let y = 24 + ringkas.length * 5 + 4;
          const byJenis = this.analisaData.by_jenis || {};
          doc.autoTable({ startY: y, head: [['Rumpun Kompetensi', 'Jumlah JP Terkumpul']], body: Object.keys(byJenis).map(k => [k, byJenis[k] + ' JP']) });
          y = doc.lastAutoTable.finalY + 6;
          const temuan = (this.analisaData.temuan || []).map(t => `[${t.level}] ${t.pesan}`);
          const rekom = (this.analisaData.rekomendasi || []).map(r => `[${r.prioritas}] ${r.tindakan}`);
          doc.autoTable({ startY: y, head: [['Temuan Kesenjangan Kompetensi']], body: temuan.map(t => [t]) });
          y = doc.lastAutoTable.finalY + 6;
          doc.autoTable({ startY: y, head: [['Rekomendasi Rencana Diklat']], body: rekom.map(r => [r]) });
          doc.save(`Analisa_Kompetensi_SatpolPP_${this.analisaTahun}.pdf`);
        },

        // ================= EKSPOR EXCEL & PDF =================
        async exportKompetensiExcel() {
          if (typeof XLSX === 'undefined') {
            this.showToast('Memuat pustaka Excel...', 'info');
            await AppCore.loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
          }
          const dataToExport = this.kompetensiList.map((k, i) => ({
            'No': i + 1,
            'Nama Pegawai': this.namaPegawai(k.pegawai_id),
            'Kegiatan Diklat': k.nama_kegiatan || k.nama_kompetensi || '',
            'Rumpun': k.rumpun || 'Teknis',
            'Penyelenggara': k.penyelenggara || '',
            'No. Sertifikat': k.no_sertifikat || '',
            'Jumlah JP': k.jumlah_jp || 0,
            'Tgl Mulai': this.formatDate(k.tgl_mulai),
            'Tgl Selesai': this.formatDate(k.tgl_selesai),
            'Status': k.status_verifikasi || 'menunggu'
          }));
          const ws = XLSX.utils.json_to_sheet(dataToExport);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Data_Kompetensi');
          XLSX.writeFile(wb, `Kompetensi_SatpolPP_Trenggalek_${this.todayIso_()}.xlsx`);
        }
      },

      mounted() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const t = urlParams.get('ticket') || window.__SSO_TICKET__ || '';
          if (t) {
            this.isSsoLoading = true;
            this.ssoStatusMessage = 'Memvalidasi tiket Single Sign-On...';
            setTimeout(() => {
              if (!this.token) this.ssoStatusMessage = 'Menyinkronkan profil pegawai & kualifikasi korps...';
            }, 800);
            setTimeout(() => {
              if (!this.token) this.ssoStatusMessage = 'Mempersiapkan dashboard SI-KOMPETENSI...';
            }, 1600);
          }
        } catch (e) {}
      }
    };

    /* =========================================================
       Bootstrap aplikasi via AppCore
       ========================================================= */
    const app = AppCore.create({
      appTitle: 'SI-KOMPETENSI',
      storagePrefix: 'sikompetensi',
      initialPage: 'dashboard',
      platformUrl: 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec',

      brand: {
        title: 'SI-KOMPETENSI',
        subtitle: 'Satpol PP & Damkar Trenggalek',
        logoChar: 'K',
        logoIcon: 'fa-solid fa-graduation-cap',
        logoSvg: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120' width='100' height='120'%3E%3Cpath d='M50 5 L90 25 V65 C90 90 50 115 50 115 C50 115 10 90 10 65 V25 Z' fill='%23065f46' stroke='%2334d399' stroke-width='4'/%3E%3Cpath d='M50 15 L80 32 V62 C80 82 50 102 50 102 C50 102 20 82 20 62 V32 Z' fill='%23047857'/%3E%3Ccircle cx='50' cy='55' r='18' fill='%2310b981'/%3E%3Cpath d='M50 40 L54 50 L64 50 L56 56 L59 66 L50 60 L41 66 L44 56 L36 50 L46 50 Z' fill='%23fbbf24'/%3E%3Ctext x='50' y='93' font-family='Arial, sans-serif' font-size='9' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3ETRENGGALEK%3E%3C/text%3E%3C/svg%3E"
      },

      menu: [
        { name: 'Utama', items: [
          { id: 'dashboard', label: 'Dashboard & 20 JP', icon: 'fa-solid fa-gauge-high' },
          { id: 'riwayat_laporan', label: 'Portofolio Diklat', icon: 'fa-solid fa-certificate' },
          { id: 'usulan_diklat', label: 'Usulan Diklat', icon: 'fa-solid fa-paper-plane' },
          { id: 'analisa', label: 'Analisa Kebutuhan', icon: 'fa-solid fa-chart-pie' }
        ]},
        { name: 'Data Master', items: [
          { id: 'master_data', label: 'Katalog & SIMPEG', icon: 'fa-solid fa-database' },
          { id: 'profil', label: 'Profil Saya', icon: 'fa-solid fa-user-tie' }
        ]},
        { name: 'Sistem', items: [
          { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-solid fa-gear', adminOnly: true }
        ]}
      ],

      pageIcons: {
        dashboard: 'fa-solid fa-gauge-high',
        riwayat_laporan: 'fa-solid fa-certificate',
        usulan_diklat: 'fa-solid fa-paper-plane',
        analisa: 'fa-solid fa-chart-pie',
        master_data: 'fa-solid fa-database',
        profil: 'fa-solid fa-user-tie',
        pengaturan: 'fa-solid fa-gear'
      },

      onNavigate(vm, page) {
        if (page === 'dashboard') {
          vm.renderDashboardCharts();
        } else if (page === 'riwayat_laporan') {
          vm.loadKompetensi(1);
        } else if (page === 'usulan_diklat') {
          vm.loadUsulan();
        } else if (page === 'analisa') {
          vm.loadAnalisa();
        }
      },

      onDarkToggle(vm) {
        if (vm.currentPage === 'dashboard') vm.renderDashboardCharts();
      },

      async initApp(vm) {
        if (vm.dataLoaded) return;
        await Promise.all([
          vm.loadDashboard(),
          vm.loadMasterSIMPEG(),
          vm.loadKompetensi(1),
          vm.loadUsulan(),
          vm.loadAnalisa()
        ]);
        vm.renderDashboardCharts();
      },

      mixins: [SIKompetensiMixin]
    });

    app.mount('#app');
  </script>
</body>
</html>
