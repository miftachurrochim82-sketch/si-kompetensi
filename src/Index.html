        <div class="mt-8 w-full space-y-3">
          <div class="p-3.5 rounded-2xl bg-slate-950/60 border border-slate-800 flex items-center gap-3 text-left">

  <!-- Shared Frontend CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/gh/miftachurrochim82-sketch/frontend-cdn@main/frontend/app-components.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/miftachurrochim82-sketch/frontend-cdn@main/frontend/app-modules.min.js"></script>

  <!-- Inisialisasi SI-KOMPETENSI via AppCore Mixin -->
  <script>
    const SIKompetensiMixin = {
      data() {
        return {
          isSsoLoading: false,
          ssoStatusMessage: '',
          showPanduan: false,
          pageSize: 10,

          // State Dashboard
          dashboardData: {
            total_kompetensi: 0,
            total_jp_tahun: 0,
            persen_capaian_20jp: 0,
            pegawai_lulus_20jp: 0,
            total_pegawai: 0,
            total_ppns: 0,
            total_damkar_certified: 0,
            total_usulan_diklat: 0,
            status_count: { disetujui: 0, menunggu: 0, ditolak: 0 },
            jenis_count: {},
            terbaru: []
          },

          // State Riwayat / Portofolio (T_RIWAYAT_KOMPETENSI)
          kompetensiList: [],
          kompetensiLoading: false,
          kompetensiSearch: '',
          filterRumpun: '',
          filterStatusVerif: '',
          showKompetensiForm: false,
          kompetensiSaving: false,
          kompetensiForm: {
            id: '', pegawai_id: '', diklat_id: '', nama_kegiatan: '', rumpun: 'Teknis Pemadam & Rescue',
            penyelenggara: '', no_sertifikat: '', tgl_mulai: '', tgl_selesai: '', tgl_kedaluwarsa: '',
            jumlah_jp: 20, metode: 'Klasikal', file_url: '', status_verifikasi: 'menunggu'
          },

          // Verifikasi Berkas
          showVerifModal: false,
          selectedKompetensi: null,
          verifSaving: false,
          verifForm: { status: 'disetujui', catatan: '' },

          // State Usulan Diklat (T_USULAN_DIKLAT)
          usulanList: [],
          usulanLoading: false,
          showUsulanForm: false,
          usulanSaving: false,
          usulanForm: {
            id: '', pegawai_id: '', diklat_id: '', nama_diklat_usulan: '', rumpun: 'Teknis Pemadam & Rescue',
            target_penyelenggara: 'BPSDM Jawa Timur', alasan_usulan: '', urgensi: 'Sangat Mendesak (Prioritas 1)',
            estimasi_biaya: 0, status_usulan: 'diajukan'
          },
          showReviewUsulanModal: false,
          selectedUsulan: null,
          reviewUsulanSaving: false,
          reviewUsulanForm: { status: 'disetujui_kasat', catatan: '' },

          // State Analisa
          analisaTahun: 2026,
          analisaLoading: false,
          analisaData: { ringkasan: '', gap_count: 0, gap_details: [], temuan: [], rekomendasi: [] },

          // Master Satelit (3 Tab)
          activeMasterTab: 'katalog_diklat',
          katalogList: [],
          standarList: [],
          referensiList: [],
          katalogSearch: '',
          filterKategoriRef: '',

          // SIMPEG Lookup (Pegawai, Unit, Jabatan)
          simpegLookup: { pegawai: [], unit: [], jabatan: [] },

          // Modal Forms Master Satelit
          showKatalogModal: false,
          katalogSaving: false,
          katalogForm: { id: '', kode_diklat: '', nama_diklat: '', rumpun: 'Teknis Pemadam & Rescue', kategori_keahlian: '', penyelenggara_default: '', default_jp: 20, estimasi_biaya_default: 0 },

          showStandarModal: false,
          standarSaving: false,
          standarForm: { id: '', jabatan_id: '', diklat_id: '', tingkat_kebutuhan: 'WAJIB', minimal_jp: 20, keterangan: '' },

          showReferensiModal: false,
          referensiSaving: false,
          referensiForm: { id: '', kategori: 'RUMPUN_KOMPETENSI', kode: '', nama_nilai: '', urutan: 1, status_aktif: 'true', keterangan: '' }
        };
      },

      computed: {
        filteredKatalogDiklat() {
          const q = String(this.katalogSearch || '').toLowerCase().trim();
          if (!q) return this.katalogList;
          return this.katalogList.filter(d =>
            String(d.nama_diklat || '').toLowerCase().includes(q) ||
            String(d.kode_diklat || '').toLowerCase().includes(q) ||
            String(d.kategori_keahlian || '').toLowerCase().includes(q)
          );
        },

        filteredReferensi() {
          if (!this.filterKategoriRef) return this.referensiList;
          return this.referensiList.filter(r => String(r.kategori).toUpperCase() === String(this.filterKategoriRef).toUpperCase());
        },

        optionsRumpun() {
          const res = this.referensiList.filter(r => r.kategori === 'RUMPUN_KOMPETENSI');
          return res.length > 0 ? res : [
            { id: '1', nama_nilai: 'Manajerial & Kepemimpinan' },
            { id: '2', nama_nilai: 'Teknis Penegakan Perda (PPNS)' },
            { id: '3', nama_nilai: 'Teknis Pemadam & Rescue' },
            { id: '4', nama_nilai: 'Jabatan Fungsional Pol PP & Damkar' },
            { id: '5', nama_nilai: 'Bimbingan Teknis & Workshop' }
          ];
        },

        optionsUrgensi() {
          const res = this.referensiList.filter(r => r.kategori === 'URGENSI_USULAN');
          return res.length > 0 ? res : [
            { id: '1', nama_nilai: 'Sangat Mendesak (Prioritas 1)' },
            { id: '2', nama_nilai: 'Kebutuhan Berkala (Prioritas 2)' }
          ];
        }
      },

      methods: {
        // ================= LOOKUP NAMES =================
        namaPegawai(id) {
          if (!id) return '-';
          const p = (this.simpegLookup.pegawai || []).find(x => String(x.id) === String(id));
          return p ? (p.nama_lengkap || p.nama || p.id) : id;
        },

        namaJabatan(id) {
          if (!id) return '-';
          const j = (this.simpegLookup.jabatan || []).find(x => String(x.id) === String(id));
          return j ? (j.nama_jabatan || j.kode_jabatan || j.id) : id;
        },

        namaUnit(id) {
          if (!id) return '-';
          const u = (this.simpegLookup.unit || []).find(x => String(x.id) === String(id));
          return u ? (u.nama_unit || u.kode_unit || u.id) : id;
        },

        namaDiklat(id) {
          if (!id) return '-';
          const d = (this.katalogList || []).find(x => String(x.id) === String(id));
          return d ? d.nama_diklat : id;
        },

        formatDate(val) {
          if (!val) return '-';
          try {
            const d = new Date(val);
            if (isNaN(d.getTime())) return val;
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
          } catch(e) { return val; }
        },

        // ================= DATA LOADERS =================
        async loadDashboard() {
          try {
            const res = await this.callServer('dashboard');
            if (res && res.success) {
              this.dashboardData = Object.assign(this.dashboardData, res.data || {});
            }
          } catch(e) { console.error('Gagal load dashboard:', e); }
        },

        async loadMasterSatelit() {
          try {
            const res = await this.callServer('get_master_satelit');
            if (res && res.success && res.data) {
              this.katalogList = res.data.katalog || [];
              this.standarList = res.data.standar_kompetensi || [];
              this.referensiList = res.data.referensi || [];
            }
          } catch(e) { console.error('Gagal load master satelit:', e); }
        },

        async loadSimpegLookup() {
          try {
            const res = await this.callServer('get_simpeg_lookup');
            if (res && res.success && res.data) {
              this.simpegLookup = res.data;
            }
          } catch(e) { console.error('Gagal load simpeg lookup:', e); }
        },

        async loadKompetensi(page = 1) {
          this.kompetensiLoading = true;
          try {
            const res = await this.callServer('get_riwayat_list', {
              page: page,
              limit: 50,
              search: this.kompetensiSearch,
              filters: { rumpun: this.filterRumpun, status: this.filterStatusVerif }
            });
            if (res && res.success) {
              this.kompetensiList = res.data || [];
            }
          } catch(e) { console.error('Gagal load riwayat:', e); }
          finally { this.kompetensiLoading = false; }
        },

        async loadUsulan() {
          this.usulanLoading = true;
          try {
            const res = await this.callServer('get_usulan_list');
            if (res && res.success) {
              this.usulanList = res.data || [];
            }
          } catch(e) { console.error('Gagal load usulan:', e); }
          finally { this.usulanLoading = false; }
        },

        async loadAnalisa() {
          this.analisaLoading = true;
          try {
            const res = await this.callServer('analytics', { tahun: this.analisaTahun });
            if (res && res.success) {
              this.analisaData = Object.assign(this.analisaData, res.data || {});
            }
          } catch(e) { console.error('Gagal load analisa:', e); }
          finally { this.analisaLoading = false; }
        },

        // ================= RIWAYAT / PORTOFOLIO =================
        openKompetensiForm() {
          this.kompetensiForm = {
            id: '',
            pegawai_id: (this.simpegLookup.pegawai && this.simpegLookup.pegawai[0] && this.simpegLookup.pegawai[0].id) || '',
            diklat_id: '',
            nama_kegiatan: '',
            rumpun: 'Teknis Pemadam & Rescue',
            penyelenggara: '',
            no_sertifikat: '',
            tgl_mulai: '',
            tgl_selesai: '',
            tgl_kedaluwarsa: '',
            jumlah_jp: 20,
            metode: 'Klasikal',
            file_url: '',
            status_verifikasi: 'menunggu'
          };
          this.showKompetensiForm = true;
        },

        openEditKompetensi(item) {
          this.kompetensiForm = Object.assign({}, item);
          this.showKompetensiForm = true;
        },

        onKatalogSelected() {
          if (!this.kompetensiForm.diklat_id) return;
          const k = this.katalogList.find(x => x.id === this.kompetensiForm.diklat_id);
          if (k) {
            this.kompetensiForm.nama_kegiatan = k.nama_diklat;
            this.kompetensiForm.rumpun = k.rumpun || this.kompetensiForm.rumpun;
            this.kompetensiForm.penyelenggara = k.penyelenggara_default || this.kompetensiForm.penyelenggara;
            this.kompetensiForm.jumlah_jp = Number(k.default_jp) || this.kompetensiForm.jumlah_jp;
          }
        },

        async saveKompetensi() {
          this.kompetensiSaving = true;
          try {
            const res = await this.callServer('save_riwayat', { record: this.kompetensiForm });
            if (res && res.success) {
              this.showToast('Sertifikat kompetensi berhasil disimpan', 'success');
              this.showKompetensiForm = false;
              await this.loadKompetensi(1);
              await this.loadDashboard();
            } else {
              this.showToast((res && res.error) || 'Gagal menyimpan', 'error');
            }
          } catch(e) {
            this.showToast('Terjadi kesalahan: ' + e.message, 'error');
          } finally {
            this.kompetensiSaving = false;
          }
        },

        async deleteKompetensi(id) {
          if (!confirm('Apakah Anda yakin ingin menghapus data sertifikat ini?')) return;
          try {
            const res = await this.callServer('delete_riwayat', { id: id });
            if (res && res.success) {
              this.showToast('Sertifikat berhasil dihapus', 'success');
              await this.loadKompetensi(1);
              await this.loadDashboard();
            }
          } catch(e) { this.showToast('Gagal hapus: ' + e.message, 'error'); }
        },

        openVerifModal(item) {
          this.selectedKompetensi = item;
          this.verifForm = { status: item.status_verifikasi === 'menunggu' ? 'disetujui' : item.status_verifikasi, catatan: item.catatan_verifikator || '' };
          this.showVerifModal = true;
        },

        async submitVerifikasi() {
          if (!this.selectedKompetensi) return;
          this.verifSaving = true;
          try {
            const res = await this.callServer('verifikasi_riwayat', {
              id: this.selectedKompetensi.id,
              status_verifikasi: this.verifForm.status,
              catatan_verifikator: this.verifForm.catatan
            });
            if (res && res.success) {
              this.showToast('Verifikasi sertifikat berhasil disimpan', 'success');
              this.showVerifModal = false;
              await this.loadKompetensi(1);
              await this.loadDashboard();
            }
          } catch(e) { this.showToast('Gagal verifikasi: ' + e.message, 'error'); }
          finally { this.verifSaving = false; }
        },

        // ================= USULAN DIKLAT =================
        openUsulanForm() {
          this.usulanForm = {
            id: '',
            pegawai_id: (this.simpegLookup.pegawai && this.simpegLookup.pegawai[0] && this.simpegLookup.pegawai[0].id) || '',
            diklat_id: '',
            nama_diklat_usulan: '',
            rumpun: 'Teknis Pemadam & Rescue',
            target_penyelenggara: 'BPSDM Jawa Timur',
            alasan_usulan: '',
            urgensi: 'Sangat Mendesak (Prioritas 1)',
            estimasi_biaya: 0,
            status_usulan: 'diajukan'
          };
          this.showUsulanForm = true;
        },

        async saveUsulan() {
          this.usulanSaving = true;
          try {
            const res = await this.callServer('save_usulan', { record: this.usulanForm });
            if (res && res.success) {
              this.showToast('Usulan diklat berhasil diajukan', 'success');
              this.showUsulanForm = false;
              await this.loadUsulan();
            }
          } catch(e) { this.showToast('Gagal usulan: ' + e.message, 'error'); }
          finally { this.usulanSaving = false; }
        },

        openReviewUsulanModal(item) {
          this.selectedUsulan = item;
          this.reviewUsulanForm = { status: item.status_usulan || 'disetujui_kasat', catatan: item.catatan_pimpinan || '' };
          this.showReviewUsulanModal = true;
        },

        async submitReviewUsulan() {
          if (!this.selectedUsulan) return;
          this.reviewUsulanSaving = true;
          try {
            const res = await this.callServer('review_usulan', {
              id: this.selectedUsulan.id,
              status_usulan: this.reviewUsulanForm.status,
              catatan_pimpinan: this.reviewUsulanForm.catatan
            });
            if (res && res.success) {
              this.showToast('Status usulan diklat diperbarui', 'success');
              this.showReviewUsulanModal = false;
              await this.loadUsulan();
            }
          } catch(e) { this.showToast('Gagal review: ' + e.message, 'error'); }
          finally { this.reviewUsulanSaving = false; }
        },

        async deleteUsulan(id) {
          if (!confirm('Hapus usulan diklat ini?')) return;
          try {
            const res = await this.callServer('delete_usulan', { id: id });
            if (res && res.success) {
              this.showToast('Usulan dihapus', 'success');
              await this.loadUsulan();
            }
          } catch(e) { this.showToast('Gagal: ' + e.message, 'error'); }
        },

        // ================= MASTER SATELIT 1: KATALOG =================
        openKatalogForm() {
          this.katalogForm = { id: '', kode_diklat: '', nama_diklat: '', rumpun: 'Teknis Pemadam & Rescue', kategori_keahlian: '', penyelenggara_default: '', default_jp: 20, estimasi_biaya_default: 0 };
          this.showKatalogModal = true;
        },

        openEditKatalog(item) {
          this.katalogForm = Object.assign({}, item);
          this.showKatalogModal = true;
        },

        async saveKatalog() {
          this.katalogSaving = true;
          try {
            const res = await this.callServer('save_katalog', { record: this.katalogForm });
            if (res && res.success) {
              this.showToast('Program diklat berhasil disimpan', 'success');
              this.showKatalogModal = false;
              await this.loadMasterSatelit();
            }
          } catch(e) { this.showToast('Gagal: ' + e.message, 'error'); }
          finally { this.katalogSaving = false; }
        },

        async deleteKatalog(id) {
          if (!confirm('Hapus program diklat ini dari katalog?')) return;
          try {
            const res = await this.callServer('delete_katalog', { id: id });
            if (res && res.success) {
              this.showToast('Diklat dihapus dari katalog', 'success');
              await this.loadMasterSatelit();
            }
          } catch(e) { this.showToast('Gagal: ' + e.message, 'error'); }
        },

        // ================= MASTER SATELIT 2: STANDAR KOMPETENSI =================
        openStandarForm() {
          this.standarForm = {
            id: '',
            jabatan_id: (this.simpegLookup.jabatan && this.simpegLookup.jabatan[0] && this.simpegLookup.jabatan[0].id) || '',
            diklat_id: (this.katalogList && this.katalogList[0] && this.katalogList[0].id) || '',
            tingkat_kebutuhan: 'WAJIB',
            minimal_jp: 20,
            keterangan: ''
          };
          this.showStandarModal = true;
        },

        openEditStandar(item) {
          this.standarForm = Object.assign({}, item);
          this.showStandarModal = true;
        },

        async saveStandar() {
          this.standarSaving = true;
          try {
            const res = await this.callServer('save_standar_kompetensi', { record: this.standarForm });
            if (res && res.success) {
              this.showToast('Standar kompetensi jabatan disimpan', 'success');
              this.showStandarModal = false;
              await this.loadMasterSatelit();
            }
          } catch(e) { this.showToast('Gagal: ' + e.message, 'error'); }
          finally { this.standarSaving = false; }
        },

        async deleteStandar(id) {
          if (!confirm('Hapus standar jabatan ini?')) return;
          try {
            const res = await this.callServer('delete_standar_kompetensi', { id: id });
            if (res && res.success) {
              this.showToast('Standar jabatan dihapus', 'success');
              await this.loadMasterSatelit();
            }
          } catch(e) { this.showToast('Gagal: ' + e.message, 'error'); }
        },

        // ================= MASTER SATELIT 3: REFERENSI GABUNGAN =================
        openReferensiForm() {
          this.referensiForm = { id: '', kategori: 'RUMPUN_KOMPETENSI', kode: '', nama_nilai: '', urutan: 1, status_aktif: 'true', keterangan: '' };
          this.showReferensiModal = true;
        },

        openEditReferensi(item) {
          this.referensiForm = Object.assign({}, item);
          this.showReferensiModal = true;
        },

        async saveReferensi() {
          this.referensiSaving = true;
          try {
            const res = await this.callServer('save_referensi', { record: this.referensiForm });
            if (res && res.success) {
              this.showToast('Opsi referensi berhasil disimpan', 'success');
              this.showReferensiModal = false;
              await this.loadMasterSatelit();
            }
          } catch(e) { this.showToast('Gagal: ' + e.message, 'error'); }
          finally { this.referensiSaving = false; }
        },

        async deleteReferensi(id) {
          if (!confirm('Hapus item referensi ini?')) return;
          try {
            const res = await this.callServer('delete_referensi', { id: id });
            if (res && res.success) {
              this.showToast('Referensi dihapus', 'success');
              await this.loadMasterSatelit();
            }
          } catch(e) { this.showToast('Gagal: ' + e.message, 'error'); }
        },

        // ================= EKSPOR LAPORAN =================
        async exportKompetensiExcel() {
          if (typeof XLSX === 'undefined') {
            this.showToast('Memuat pustaka Excel...', 'info');
            await AppCore.loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
          }
          const dataToExport = this.kompetensiList.map((k, i) => ({
            'No': i + 1,
            'Nama Pegawai': this.namaPegawai(k.pegawai_id),
            'Kegiatan Diklat': k.nama_kegiatan || '',
            'Rumpun': k.rumpun || '',
            'Penyelenggara': k.penyelenggara || '',
            'No. Sertifikat': k.no_sertifikat || '',
            'Jumlah JP': k.jumlah_jp || 0,
            'Tgl Mulai': this.formatDate(k.tgl_mulai),
            'Tgl Selesai': this.formatDate(k.tgl_selesai),
            'Status': k.status_verifikasi || 'menunggu'
          }));
          const ws = XLSX.utils.json_to_sheet(dataToExport);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Data_Kompetensi');
          XLSX.writeFile(wb, `Kompetensi_SatpolPP_${new Date().getFullYear()}.xlsx`);
        },

        async downloadAnalisaPDF() {
          if (typeof jspdf === 'undefined' || !jspdf.jsPDF) {
            this.showToast('Memuat pustaka PDF...', 'info');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            await AppCore.loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
          }
          const { jsPDF } = jspdf;
          const doc = new jsPDF();
          doc.setFontSize(14);
          doc.text('Analisis Kebutuhan Kompetensi Satpol PP & Damkar Trenggalek', 14, 16);
          doc.setFontSize(10);
          const temuan = (this.analisaData.temuan || []).map(t => [t.level, t.pesan]);
          doc.autoTable({ startY: 24, head: [['Level', 'Temuan Analisis Lapangan']], body: temuan });
          const rekom = (this.analisaData.rekomendasi || []).map(r => [r.prioritas, r.tindakan]);
          doc.autoTable({ startY: doc.lastAutoTable.finalY + 6, head: [['Prioritas', 'Rekomendasi Rencana Diklat']], body: rekom });
          doc.save(`Analisis_Kompetensi_SatpolPP_${this.analisaTahun}.pdf`);
        }
      },

      mounted() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const t = urlParams.get('ticket') || window.__SSO_TICKET__ || '';
          if (t) {
            this.isSsoLoading = true;
            this.ssoStatusMessage = 'Memvalidasi tiket Single Sign-On...';
          }
        } catch (e) {}
      }
    };

    /* Bootstrap aplikasi via AppCore */
    const app = AppCore.create({
      appTitle: 'SI-KOMPETENSI',
      storagePrefix: 'sikompetensi',
      initialPage: 'dashboard',
      platformUrl: 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec',

      brand: {
        title: 'SI-KOMPETENSI',
        subtitle: 'Satpol PP & Damkar Trenggalek',
        logoChar: 'K',
        logoIcon: 'fa-solid fa-graduation-cap'
      },

      menu: [
        { name: 'Utama', items: [
          { id: 'dashboard', label: 'Dashboard & 20 JP', icon: 'fa-solid fa-gauge-high' },
          { id: 'riwayat_laporan', label: 'Portofolio Diklat', icon: 'fa-solid fa-certificate' },
          { id: 'usulan_diklat', label: 'Usulan Diklat', icon: 'fa-solid fa-paper-plane' },
          { id: 'analisa', label: 'Analisa Kebutuhan', icon: 'fa-solid fa-chart-pie' }
        ]},
        { name: 'Master Satelit', items: [
          { id: 'master_data', label: 'Master Data Satelit', icon: 'fa-solid fa-database' },
          { id: 'profil', label: 'Profil Saya', icon: 'fa-solid fa-user-tie' }
        ]},
        { name: 'Sistem', items: [
          { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-solid fa-gear', adminOnly: true }
        ]}
      ],

      pageIcons: {
        dashboard: 'fa-solid fa-gauge-high',
        riwayat_laporan: 'fa-solid fa-certificate',
        usulan_diklat: 'fa-solid fa-paper-plane',
        analisa: 'fa-solid fa-chart-pie',
        master_data: 'fa-solid fa-database',
        profil: 'fa-solid fa-user-tie',
        pengaturan: 'fa-solid fa-gear'
      },

      onNavigate(vm, page) {
        if (page === 'dashboard') {
          vm.loadDashboard();
        } else if (page === 'riwayat_laporan') {
          vm.loadKompetensi(1);
        } else if (page === 'usulan_diklat') {
          vm.loadUsulan();
        } else if (page === 'analisa') {
          vm.loadAnalisa();
        } else if (page === 'master_data') {
          vm.loadMasterSatelit();
          vm.loadSimpegLookup();
        }
      },

      async initApp(vm) {
        if (vm.dataLoaded) return;
        await Promise.all([
          vm.loadDashboard(),
          vm.loadMasterSatelit(),
          vm.loadSimpegLookup(),
          vm.loadKompetensi(1),
          vm.loadUsulan(),
          vm.loadAnalisa()
        ]);
      },

      mixins: [SIKompetensiMixin]
    });

    app.mount('#app');
  </script>
</body>
</html>
