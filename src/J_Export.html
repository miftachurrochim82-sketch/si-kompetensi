<script>
  // ============================================================
  // SI-KOMPETENSI - J_Export.html (v5.5.0)
  // Chart rendering + Export Excel/PDF/CSV
  // ============================================================
  // Changelog v5.5.0 (2026-09-15):
  // - ♻️ REFACTOR: helper _exportXlsx — boilerplate 7 method Excel
  //   (loadLib guard, book_new/append/writeFile, toast, try-catch)
  //   dilebur jadi satu jalur. Perilaku & nama file tidak berubah.
  //   Chart rendering & 2 method PDF sengaja tidak disentuh.
  // Changelog v5.4.0 (2026-09-14):
  // - 🆕 ADD: cetakPasporKompetensiPDF — cetak paspor kompetensi
  //   per pegawai (1 halaman A4 portrait). Bagian: Kop teks
  //   sederhana, Kotak identitas + placeholder foto, Progress JP,
  //   Tabel Riwayat Sertifikat, Tabel Lisensi, Tabel SKJ Gap,
  //   Footer pengesahan (tanpa tanda tangan digital).
  // Changelog v5.3.0 (2026-09-14):
  // - 🆕 ADD: exportRencanaVsRealisasiExcel — 3 sheet: Rekap
  //   Program, Ringkasan per TW, Belum Terealisasi.
  // Changelog v5.2.0 (2026-09-14):
  // - 🆕 ADD: exportLisensiH90Excel, exportPortofolioPerUnitExcel.
  // Changelog v5.1.0 (2026-09-13):
  // - 🎨 FIX: renderDashboardCharts warna CSS variables.
  // - 🔴 FIX: exportAnalisaExcel CSV → XLSX.
  // - 🟠 FIX: cetakAnalisaPDF try/catch.
  // ============================================================

  window.SIKompetensiExport = {
    methods: {
      // ================= CHART RENDERING =================
      // v5.2.1 (2026-09-14):
      // - 🔴 FIX: Cannot read properties of null (reading 'getContext')
      //   Penyebab: renderDashboardCharts dipanggil overlap.
      // - Solusi: lock flag `_chartRendering` + destroy-safe + delay
      //   microtask + animation duration pendek (400ms).
      async renderDashboardCharts() {
        if (!(await this.loadLib('chart'))) return;

        // Guard: skip jika render sedang berjalan
        if (this._chartRendering) return;
        this._chartRendering = true;

        try {
          const css = getComputedStyle(document.documentElement);
          const primary       = (css.getPropertyValue('--primary').trim())       || '#059669';
          const primaryAccent = (css.getPropertyValue('--primary-accent').trim()) || '#34d399';

          // ============ CHART 1: DONUT TARGET JP ============
          const el20Jp = document.getElementById('chart20JpCanvas');
          if (el20Jp && el20Jp.tagName === 'CANVAS' && document.body.contains(el20Jp)) {
            if (this.chart20JpInstance) {
              try { this.chart20JpInstance.destroy(); }
              catch (e) { console.warn('Destroy chart donut error:', e); }
              this.chart20JpInstance = null;
            }

            const lulus = this.dashboardData.pegawai_lulus_20jp || 0;
            const total = this.dashboardData.total_pegawai || 10;
            const sisa = Math.max(0, total - lulus);

            const el20JpFresh = document.getElementById('chart20JpCanvas');
            if (el20JpFresh && el20JpFresh.tagName === 'CANVAS' && document.body.contains(el20JpFresh)) {
              this.chart20JpInstance = new Chart(el20JpFresh, {
                type: 'doughnut',
                data: {
                  labels: ['Tuntas Target', 'Dalam Proses'],
                  datasets: [{
                    data: [lulus, sisa],
                    backgroundColor: [primary, '#cbd5e1'],
                    borderWidth: 0,
                    hoverOffset: 4
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  cutout: '72%',
                  animation: { duration: 400 }
                }
              });
            }
          }

          // ============ CHART 2: BAR RUMPUN ============
          const elRumpun = document.getElementById('chartRumpunCanvas');
          if (elRumpun && elRumpun.tagName === 'CANVAS' && document.body.contains(elRumpun)) {
            if (this.chartRumpunInstance) {
              try { this.chartRumpunInstance.destroy(); }
              catch (e) { console.warn('Destroy chart rumpun error:', e); }
              this.chartRumpunInstance = null;
            }

            const jc = this.dashboardData.jenis_count || {};
            const labels = ['Manajerial', 'Teknis Gakda', 'Teknis Damkar', 'Fungsional', 'Bimtek'];
            const dataCounts = [
              jc['Manajerial & Kepemimpinan'] || 0,
              jc['Teknis Penegakan Perda (PPNS)'] || 0,
              jc['Teknis Pemadam & Rescue'] || 0,
              jc['Jabatan Fungsional Pol PP & Damkar'] || 0,
              jc['Bimbingan Teknis & Workshop'] || 0
            ];

            const elRumpunFresh = document.getElementById('chartRumpunCanvas');
            if (elRumpunFresh && elRumpunFresh.tagName === 'CANVAS' && document.body.contains(elRumpunFresh)) {
              this.chartRumpunInstance = new Chart(elRumpunFresh, {
                type: 'bar',
                data: {
                  labels: labels,
                  datasets: [{
                    label: 'Jumlah Pelatihan',
                    data: dataCounts,
                    backgroundColor: [primary, primaryAccent, '#f59e0b', '#6366f1', '#f43f5e'],
                    borderRadius: 8
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                    x: { grid: { display: false } }
                  },
                  animation: { duration: 400 }
                }
              });
            }
          }
        } catch (e) {
          console.error('Gagal render chart:', e);
        } finally {
          setTimeout(() => { this._chartRendering = false; }, 800);
        }
      },

      // ================= EXPORT EXCEL (.XLSX) =================
      // ===== v5.5.0: helper bersama export Excel =====
      // sheets: [{ name, rows }] — rows = array objek (json_to_sheet).
      // loadLib, writeFile, toast sukses/gagal ditangani di sini semua.
      async _exportXlsx(fileName, sheets, successMsg) {
        if (!(await this.loadLib('xlsx'))) return false;
        try {
          const wb = XLSX.utils.book_new();
          sheets.forEach(s => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(s.rows), s.name));
          XLSX.writeFile(wb, fileName);
          this.showToast(successMsg, 'success');
          return true;
        } catch (e) {
          console.error('Gagal export Excel:', e);
          this.showToast('Gagal mengekspor Excel: ' + (e.message || 'Error tidak dikenal'), 'error');
          return false;
        }
      },

      async exportKompetensiExcel() {
        const dataToExport = this.kompetensiList.map((k, i) => ({
          'No': i + 1,
          'Nama Pegawai': this.getPegawaiNama(k.pegawai_id) || k.nama_pegawai || this.namaPegawai(k.pegawai_id),
          'NIP': k.nip || this.nipPegawai(k.pegawai_id),
          'Kegiatan Diklat': k.nama_kegiatan || '',
          'Rumpun': k.rumpun || '',
          'Penyelenggara': k.penyelenggara || '',
          'No. Sertifikat': k.no_sertifikat || '',
          'Jumlah JP': k.jumlah_jp || 0,
          'Tgl Mulai': this.formatDateDisplay(k.tgl_mulai),
          'Tgl Selesai': this.formatDateDisplay(k.tgl_selesai),
          'Status': k.status_verifikasi || 'disetujui'
        }));
        await this.exportExcel(dataToExport, `SI-KOMPETENSI_Portofolio_${new Date().getFullYear()}.xlsx`, 'Data_Kompetensi');
      },

      async exportMatriksExcel() {
        const matriks = this.dashboardData.matriks_bulanan || [];
        const rows = matriks.map((m, idx) => ({
          'No': idx + 1,
          'Nama Pegawai': this.getPegawaiNama(m.pegawai_id) || m.nama_pegawai || this.namaPegawai(m.pegawai_id),
          'NIP': m.nip || this.nipPegawai(m.pegawai_id),
          'Status': m.status_pegawai || 'PNS',
          'Unit Kerja': m.unit_nama || '',
          'Jan': m.bulan[0], 'Feb': m.bulan[1], 'Mar': m.bulan[2], 'Apr': m.bulan[3],
          'Mei': m.bulan[4], 'Jun': m.bulan[5], 'Jul': m.bulan[6], 'Agt': m.bulan[7],
          'Sep': m.bulan[8], 'Okt': m.bulan[9], 'Nov': m.bulan[10], 'Des': m.bulan[11],
          'Total JP': m.total_jp,
          'Target Standar': m.target_jp + ' JP',
          'Status Capaian': m.total_jp >= m.target_jp ? 'TUNTAS' : 'DALAM PROSES'
        }));
        await this.exportExcel(rows, `SI-KOMPETENSI_Matriks_JP_${new Date().getFullYear()}.xlsx`, 'Matriks_12_Bulan_JP');
      },

      async exportRencanaExcel() {
        const dataToExport = (this.filteredRencanaList || []).map((u, i) => {
          const pegName = u.pegawai_id
            ? (this.getPegawaiNama(u.pegawai_id) || this.namaPegawai(u.pegawai_id) || u.nama_pegawai || '')
            : 'Semua Personel';
          return {
            "No": i + 1,
            "Tahun Anggaran": u.tahun_anggaran || u.tahun_anggaran_target || new Date().getFullYear(),
            "Periode": u.periode_triwulan || "TW I",
            "Unit Kerja": this.namaUnit(u.unit_id) || "Semua Bidang",
            "Sasaran Personel": pegName,
            "Program Pelatihan Terencana": u.nama_program_diklat || u.nama_diklat_usulan || "",
            "Rumpun": u.rumpun || "",
            "Metode": u.metode || "Klasikal",
            "Target JP": Number(u.target_jp || u.jumlah_jp || 20),
            "Penyelenggara": u.penyelenggara || u.target_penyelenggara || "",
            "Sumber Dana": u.sumber_dana || "APBD Kabupaten Trenggalek",
            "Estimasi Biaya (Rp)": Number(u.estimasi_biaya || 0),
            "Status Realisasi": u.status_rencana || (u.is_terealisasi ? "Terealisasi" : "Direncanakan"),
            "Alasan / Justifikasi": u.alasan_justifikasi || u.alasan_usulan || ""
          };
        });
        await this.exportExcel(dataToExport, `SI-KOMPETENSI_Rencana_Diklat_${new Date().getFullYear()}.xlsx`, 'Rencana_Diklat_Tahunan');
      },

      // ============================================================
      // v5.2.0: Export Lisensi dengan Monitoring H-90
      // ============================================================
      async exportLisensiH90Excel() {

        const list = this.kualifikasiList || [];
        if (!list.length) {
          this.showToast('Tidak ada data lisensi untuk diekspor.', 'warning');
          return;
        }

        const now = new Date();
        const msDay = 24 * 60 * 60 * 1000;

        const rows = list.map(k => {
          const tglStr = k.tgl_habis_berlaku;
          let sisaHari = null;
          let status = 'Aktif';

          if (tglStr) {
            try {
              const expMs = new Date(String(tglStr)).getTime();
              if (!isNaN(expMs)) {
                sisaHari = Math.ceil((expMs - now.getTime()) / msDay);
                if (sisaHari < 0) status = 'EXPIRED';
                else if (sisaHari <= 90) status = 'H-90 ALERT';
                else if (sisaHari <= 180) status = 'H-180 Peringatan';
                else status = 'Aktif';
              }
            } catch (e) {}
          }

          return {
            'Nama Pegawai': k.nama_pegawai || this.getPegawaiNama(k.pegawai_id) || this.namaPegawai(k.pegawai_id) || '',
            'NIP': k.nip || this.nipPegawai(k.pegawai_id) || '',
            'Jenis Lisensi': k.jenis_kualifikasi || '',
            'No. SK': k.nomor_sk_lisensi || '',
            'No. Registrasi': k.no_registrasi_nasional || '',
            'Lembaga Penerbit': k.lembaga_penerbit || '',
            'Tanggal Terbit': this.formatDateDisplay(k.tgl_sk_terbit),
            'Tanggal Expired': this.formatDateDisplay(k.tgl_habis_berlaku),
            'Sisa Hari': sisaHari !== null ? sisaHari : '-',
            'Status': status,
            'Tindakan Diperlukan': status === 'EXPIRED' ? 'SEGERA PERPANJANG'
              : status === 'H-90 ALERT' ? 'Jadwalkan Perpanjangan'
              : status === 'H-180 Peringatan' ? 'Persiapan Perpanjangan'
              : '-'
          };
        });

        rows.sort((a, b) => {
          const aVal = typeof a['Sisa Hari'] === 'number' ? a['Sisa Hari'] : 99999;
          const bVal = typeof b['Sisa Hari'] === 'number' ? b['Sisa Hari'] : 99999;
          return aVal - bVal;
        });

        const rowsFinal = rows.map((r, i) => Object.assign({ 'No': i + 1 }, r));

        const tgl = new Date().toISOString().slice(0, 10);
        await this.exportExcel(rowsFinal, `SIKOMPETENSI_Monitoring_Lisensi_${tgl}.xlsx`, 'Monitoring_Lisensi');
      },

      // ============================================================
      // v5.2.0: Export Rekap Portofolio per Unit (multi-sheet)
      // ============================================================
      async exportPortofolioPerUnitExcel() {

        const pegawaiList = (this.simpegLookup && this.simpegLookup.pegawai && this.simpegLookup.pegawai.length)
          ? this.simpegLookup.pegawai
          : (this.masterPegawaiList || []);
        const unitList = (this.simpegLookup && this.simpegLookup.unit && this.simpegLookup.unit.length)
          ? this.simpegLookup.unit
          : (this.masterUnitList || []);
        const sertifikatList = (this.kompetensiList || []).filter(k =>
          String(k.status_verifikasi || '').toLowerCase() === 'disetujui'
        );

        if (!sertifikatList.length) {
          this.showToast('Tidak ada data sertifikat disetujui untuk diekspor.', 'warning');
          return;
        }

        const pegawaiUnit = {};
        pegawaiList.forEach(p => {
          const pid = String(p.id || p.pegawai_id || '');
          if (pid) pegawaiUnit[pid] = String(p.unit_id || '');
        });

        const unitStats = {};
        unitList.forEach(u => {
          const uid = String(u.unit_id || u.id || '');
          unitStats[uid] = {
            nama: u.nama_unit || u.nama || uid,
            totalPegawai: 0,
            totalSertifikat: 0,
            totalJP: 0,
            pegawaiLulus: 0,
            pegawaiIds: []
          };
        });

        pegawaiList.forEach(p => {
          const uid = String(p.unit_id || '');
          if (unitStats[uid]) {
            unitStats[uid].totalPegawai++;
            unitStats[uid].pegawaiIds.push(String(p.id || p.pegawai_id || ''));
          }
        });

        const jpByPegawai = {};
        sertifikatList.forEach(k => {
          const pid = String(k.pegawai_id || '');
          const uid = pegawaiUnit[pid];
          const jp = Number(k.jumlah_jp) || 0;

          if (unitStats[uid]) {
            unitStats[uid].totalSertifikat++;
            unitStats[uid].totalJP += jp;
          }
          jpByPegawai[pid] = (jpByPegawai[pid] || 0) + jp;
        });

        Object.values(unitStats).forEach(u => {
          u.pegawaiLulus = u.pegawaiIds.filter(pid => (jpByPegawai[pid] || 0) >= 20).length;
        });

        const rowsRingkasan = Object.entries(unitStats)
          .filter(([uid, s]) => s.totalPegawai > 0)
          .map(([uid, s], i) => ({
            'No': i + 1,
            'Unit Kerja': s.nama,
            'Total Pegawai': s.totalPegawai,
            'Total Sertifikat': s.totalSertifikat,
            'Total JP': s.totalJP,
            'Pegawai Lulus 20 JP': s.pegawaiLulus,
            'Persentase Lulus (%)': s.totalPegawai > 0
              ? Math.round((s.pegawaiLulus / s.totalPegawai) * 100)
              : 0
          }));

        const rowsDetail = [];
        pegawaiList.forEach(p => {
          const pid = String(p.id || p.pegawai_id || '');
          const jp = jpByPegawai[pid] || 0;
          const jmlSertifikat = sertifikatList.filter(k => String(k.pegawai_id) === pid).length;

          if (jmlSertifikat > 0) {
            const target = (String(p.status_pegawai || '').toUpperCase() === 'PPPK') ? 24 : 20;
            const unitName = (unitStats[String(p.unit_id || '')] || {}).nama || '-';
            rowsDetail.push({
              'Nama Pegawai': p.nama_lengkap || p.nama || '',
              'NIP': p.nip || '',
              'Unit Kerja': unitName,
              'Status': p.status_pegawai || 'PNS',
              'Total Sertifikat': jmlSertifikat,
              'Total JP': jp,
              'Target JP': target,
              'Status Capaian': jp >= target ? 'TUNTAS' : 'PROSES'
            });
          }
        });

        rowsDetail.sort((a, b) => String(a['Nama Pegawai']).localeCompare(String(b['Nama Pegawai'])));

        const tgl = new Date().toISOString().slice(0, 10);
        await this._exportXlsx(`SIKOMPETENSI_Rekap_Portofolio_per_Unit_${tgl}.xlsx`, [
          { name: 'Ringkasan_per_Unit', rows: rowsRingkasan },
          { name: 'Detail_per_Pegawai', rows: rowsDetail }
        ], 'Rekap Portofolio per Unit berhasil diekspor (2 sheet).');
      },

      // ============================================================
      // v5.3.0: Export Rencana vs Realisasi (3 sheet)
      // ============================================================
      async exportRencanaVsRealisasiExcel() {

        const list = this.usulanList || [];
        if (!list.length) {
          this.showToast('Tidak ada data rencana untuk diekspor.', 'warning');
          return;
        }

        const tahun = this.filterRencanaTahun || new Date().getFullYear();

        const listTahun = list.filter(u => {
          const y = Number(u.tahun_anggaran || u.tahun_anggaran_target || 0);
          return !tahun || y === Number(tahun);
        });

        if (!listTahun.length) {
          this.showToast(`Tidak ada rencana untuk tahun ${tahun}.`, 'warning');
          return;
        }

        const hitungRealisasiJP = (u) => {
          const pid = String(u.pegawai_id || '');
          const diklatId = String(u.diklat_id || '');
          const namaProgram = String(u.nama_program_diklat || u.nama_diklat_usulan || '').toLowerCase();

          const sertifikat = (this.kompetensiList || []).filter(k => {
            if (String(k.pegawai_id) !== pid) return false;
            if (String(k.status_verifikasi || '').toLowerCase() !== 'disetujui') return false;

            const kDiklat = String(k.diklat_id || '');
            const kNama = String(k.nama_kegiatan || '').toLowerCase();

            return (diklatId && kDiklat === diklatId) || (namaProgram && kNama.includes(namaProgram));
          });

          return sertifikat.reduce((sum, k) => sum + (Number(k.jumlah_jp) || 0), 0);
        };

        // v5.4.1 FIX: cek dari PALING SPESIFIK (TW IV) ke PALING UMUM (TW I).
        // Sebelumnya cek TW I dulu → "TW III" mengandung "TW II" → salah map.
        const twNum = (twStr) => {
          const s = String(twStr || '').toUpperCase();
          if (s.indexOf('TW IV') !== -1) return 'TW IV';
          if (s.indexOf('TW III') !== -1) return 'TW III';
          if (s.indexOf('TW II') !== -1) return 'TW II';
          if (s.indexOf('TW I') !== -1) return 'TW I';
          return 'Lainnya';
        };

        const rows1 = listTahun.map((u, i) => {
          const targetJp = Number(u.target_jp || u.jumlah_jp || 20);
          const realJp = hitungRealisasiJP(u);
          const statusRencana = String(u.status_rencana || '').toLowerCase();
          const isTerealisasi = statusRencana === 'terealisasi' || u.is_terealisasi;

          let statusFinal = 'Direncanakan';
          if (isTerealisasi) statusFinal = 'Terealisasi';
          else if (statusRencana === 'diajukan') statusFinal = 'Diajukan';
          else if (statusRencana === 'disetujui') statusFinal = 'Disetujui';
          else if (statusRencana === 'ditolak') statusFinal = 'Ditolak';

          const pegName = u.pegawai_id
            ? (this.getPegawaiNama(u.pegawai_id) || this.namaPegawai(u.pegawai_id) || u.nama_pegawai || '')
            : 'Semua Personel';

          return {
            'No': i + 1,
            'Program Pelatihan': u.nama_program_diklat || u.nama_diklat_usulan || '',
            'Pegawai': pegName,
            'Unit Kerja': this.namaUnit(u.unit_id) || 'Semua Bidang',
            'TW': twNum(u.periode_triwulan),
            'Target JP': targetJp,
            'Realisasi JP': realJp,
            'Selisih': realJp - targetJp,
            'Status Rencana': statusFinal,
            'Penyelenggara': u.penyelenggara || u.target_penyelenggara || '',
            'Estimasi Biaya (Rp)': Number(u.estimasi_biaya || 0)
          };
        });

        const twGroups = { 'TW I': [], 'TW II': [], 'TW III': [], 'TW IV': [], 'Lainnya': [] };
        rows1.forEach(r => {
          const key = twGroups[r.TW] ? r.TW : 'Lainnya';
          twGroups[key].push(r);
        });

        const rows2 = Object.entries(twGroups)
          .filter(([tw, arr]) => arr.length > 0)
          .map(([tw, arr], i) => {
            const total = arr.length;
            const realisasi = arr.filter(r => r['Status Rencana'] === 'Terealisasi').length;
            const totalTargetJp = arr.reduce((s, r) => s + r['Target JP'], 0);
            const totalRealJp = arr.reduce((s, r) => s + r['Realisasi JP'], 0);
            return {
              'No': i + 1,
              'Triwulan': tw,
              'Total Program': total,
              'Terealisasi': realisasi,
              'Belum Terealisasi': total - realisasi,
              'Persen Terealisasi (%)': total > 0 ? Math.round((realisasi / total) * 100) : 0,
              'Total Target JP': totalTargetJp,
              'Total Realisasi JP': totalRealJp
            };
          });

        if (rows2.length > 0) {
          const grandTotal = rows2.reduce((acc, r) => ({
            total: acc.total + r['Total Program'],
            real: acc.real + r['Terealisasi'],
            tgtJp: acc.tgtJp + r['Total Target JP'],
            realJp: acc.realJp + r['Total Realisasi JP']
          }), { total: 0, real: 0, tgtJp: 0, realJp: 0 });

          rows2.push({
            'No': '',
            'Triwulan': 'TOTAL',
            'Total Program': grandTotal.total,
            'Terealisasi': grandTotal.real,
            'Belum Terealisasi': grandTotal.total - grandTotal.real,
            'Persen Terealisasi (%)': grandTotal.total > 0 ? Math.round((grandTotal.real / grandTotal.total) * 100) : 0,
            'Total Target JP': grandTotal.tgtJp,
            'Total Realisasi JP': grandTotal.realJp
          });
        }

        const rows3 = rows1
          .filter(r => r['Status Rencana'] !== 'Terealisasi' && r['Status Rencana'] !== 'Ditolak')
          .map((r, i) => ({
            'No': i + 1,
            'Program Pelatihan': r['Program Pelatihan'],
            'Pegawai': r['Pegawai'],
            'Unit Kerja': r['Unit Kerja'],
            'TW': r['TW'],
            'Target JP': r['Target JP'],
            'Realisasi JP': r['Realisasi JP'],
            'Status Rencana': r['Status Rencana'],
            'Estimasi Biaya (Rp)': r['Estimasi Biaya (Rp)'],
            'Tindak Lanjut': 'Segera jadwalkan / ajukan ke DPA'
          }));

        await this._exportXlsx(`SIKOMPETENSI_Rencana_vs_Realisasi_${tahun}.xlsx`, [{ name: 'Rekap_Program', rows: rows1 }, { name: 'Ringkasan_Per_TW', rows: rows2 }, { name: 'Belum_Terealisasi', rows: rows3.length ? rows3 : [{ 'Info': 'Semua rencana sudah terealisasi atau ditolak.' }] }], `Rencana vs Realisasi ${tahun} berhasil diekspor (3 sheet).`);
      },

      // ============================================================
      // v5.4.0: Cetak Paspor Kompetensi ASN (per pegawai)
      // Layout: 1 halaman A4 portrait, kop teks sederhana (tanpa logo).
      // Bagian: Identitas, Capaian JP, Riwayat Sertifikat, Lisensi, SKJ.
      // ============================================================
      async cetakPasporKompetensiPDF() {
        if (!(await this.loadLib('pdf'))) {
          // (pesan error kini otomatis dari loadLib)
          return;
        }

        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF('p', 'mm', 'a4');
          const pageW = doc.internal.pageSize.getWidth();
          const pageH = doc.internal.pageSize.getHeight();
          const margin = 15;
          const contentW = pageW - (margin * 2);

          // ===== Ambil data pegawai aktif =====
          const p = this.activePegawaiDetail || {};
          const pid = String(p.id || p.pegawai_id || '');
          const namaPegawai = p.nama_lengkap || p.nama || '-';
          const nipPegawai = p.nip || '-';
          const jabatanPegawai = this.activePegawaiJabatan || '-';
          const unitPegawai = this.activePegawaiUnit || '-';
          const pangkatPegawai = p.pangkat_golongan || p.pangkat_gol || '-';
          const statusPegawai = p.status_pegawai || 'PNS';
          const tahunEvaluasi = this.activeProfileYear || new Date().getFullYear();
          const targetJp = this.activePegawaiTargetJp || 20;
          const totalJp = this.activePegawaiTotalJpTahun || 0;
          const persenJp = this.activePegawaiPersenJp || 0;
          const isLulus = this.activePegawaiIsJpLulus;

          const riwayatTahun = this.activePegawaiRiwayatTahun || [];
          const lisensi = (this.kualifikasiList || []).filter(k => String(k.pegawai_id) === pid);
          const skjList = this.activePegawaiSkjList || [];

          let y = margin;

          // ===== KOP TEKS SEDERHANA =====
          doc.setFontSize(14);
          doc.setFont('helvetica', 'bold');
          doc.text('PEMERINTAH KABUPATEN TRENGGALEK', pageW / 2, y, { align: 'center' });
          y += 7;
          doc.setFontSize(12);
          doc.text('SATUAN POLISI PAMONG PRAJA DAN PEMADAM KEBAKARAN', pageW / 2, y, { align: 'center' });
          y += 5;
          doc.setFontSize(8);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(80);
          doc.text('Jl. Ahmad Yani, Trenggalek, Jawa Timur | Telp. (0355) - | Email: satpolpp@trenggalekkab.go.id', pageW / 2, y, { align: 'center' });
          doc.setTextColor(0);
          y += 3;

          doc.setLineWidth(0.8);
          doc.setDrawColor(5, 150, 105);
          doc.line(margin, y, pageW - margin, y);
          doc.setDrawColor(0);
          doc.setLineWidth(0.2);
          y += 8;

          // ===== JUDUL =====
          doc.setFontSize(16);
          doc.setFont('helvetica', 'bold');
          doc.text('PASPOR KOMPETENSI ASN', pageW / 2, y, { align: 'center' });
          y += 6;
          doc.setFontSize(9);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(100);
          doc.text(`Tahun Evaluasi ${tahunEvaluasi}`, pageW / 2, y, { align: 'center' });
          doc.setTextColor(0);
          y += 9;

          // ===== IDENTITAS PEGAWAI (kotak) =====
          const boxH = 52;
          doc.setDrawColor(200);
          doc.setFillColor(248, 250, 252);
          doc.roundedRect(margin, y, contentW, boxH, 2, 2, 'FD');

          const fotoX = margin + 8;
          const fotoY = y + 6;
          const fotoW = 28;
          const fotoH = 40;
          doc.setDrawColor(180);
          doc.setFillColor(230, 230, 230);
          doc.rect(fotoX, fotoY, fotoW, fotoH, 'FD');
          doc.setFontSize(7);
          doc.setTextColor(120);
          doc.text('FOTO', fotoX + fotoW / 2, fotoY + fotoH / 2 - 1, { align: 'center' });
          doc.text('3x4', fotoX + fotoW / 2, fotoY + fotoH / 2 + 3, { align: 'center' });
          doc.setTextColor(0);

          const dataX = fotoX + fotoW + 8;
          const valX = dataX + 32;
          let dataY = y + 9;
          const lineH = 6;
          doc.setFontSize(9);

          const fields = [
            ['Nama Lengkap', namaPegawai],
            ['NIP', nipPegawai],
            ['Jabatan', jabatanPegawai],
            ['Unit Kerja', unitPegawai],
            ['Pangkat/Gol', pangkatPegawai],
            ['Status', statusPegawai]
          ];
          fields.forEach(([label, val]) => {
            doc.setFont('helvetica', 'bold');
            doc.text(label, dataX, dataY);
            doc.setFont('helvetica', 'normal');
            doc.text(': ' + val, valX, dataY);
            dataY += lineH;
          });
          y += boxH + 8;

          // ===== CAPAIAN JP =====
          doc.setFontSize(11);
          doc.setFont('helvetica', 'bold');
          doc.text(`CAPAIAN JAM PELAJARAN (JP) ${tahunEvaluasi}`, margin, y);
          y += 7;

          doc.setFontSize(9);
          doc.setFont('helvetica', 'normal');
          doc.text(`Total JP: ${totalJp} dari target ${targetJp} JP`, margin, y);

          const statusText = isLulus ? 'TUNTAS' : 'BELUM';
          const statusColor = isLulus ? [22, 163, 74] : [245, 158, 11];
          doc.setFillColor(statusColor[0], statusColor[1], statusColor[2]);
          doc.roundedRect(margin + 105, y - 3.5, 22, 5.5, 1, 1, 'F');
          doc.setTextColor(255);
          doc.setFontSize(7.5);
          doc.setFont('helvetica', 'bold');
          doc.text(statusText, margin + 116, y, { align: 'center' });
          doc.setTextColor(0);
          y += 7;

          // Progress bar
          const pbH = 6;
          doc.setFillColor(226, 232, 240);
          doc.roundedRect(margin, y, contentW, pbH, 1, 1, 'F');
          const fillW = contentW * Math.min(100, persenJp) / 100;
          if (fillW > 0) {
            const barColor = isLulus ? [22, 163, 74] : [245, 158, 11];
            doc.setFillColor(barColor[0], barColor[1], barColor[2]);
            doc.roundedRect(margin, y, fillW, pbH, 1, 1, 'F');
            if (fillW > 18) {
              doc.setFontSize(7.5);
              doc.setTextColor(255);
              doc.setFont('helvetica', 'bold');
              doc.text(`${persenJp}%`, margin + fillW / 2, y + 4.2, { align: 'center' });
            }
          }
          doc.setTextColor(0);
          y += pbH + 9;

          // ===== RIWAYAT SERTIFIKAT =====
          doc.setFontSize(11);
          doc.setFont('helvetica', 'bold');
          doc.text(`RIWAYAT SERTIFIKAT TAHUN ${tahunEvaluasi} (${riwayatTahun.length})`, margin, y);
          y += 2;

          if (riwayatTahun.length > 0) {
            const bodyRows = riwayatTahun.map((r, i) => [
              i + 1,
              r.nama_kegiatan || '-',
              r.penyelenggara || '-',
              (r.jumlah_jp || 0) + ' JP',
              r.no_sertifikat || '-'
            ]);
            doc.autoTable({
              startY: y,
              head: [['No', 'Kegiatan Diklat', 'Penyelenggara', 'JP', 'No. Sertifikat']],
              body: bodyRows,
              theme: 'grid',
              margin: { left: margin, right: margin },
              headStyles: { fillColor: [5, 150, 105], textColor: 255, fontStyle: 'bold', fontSize: 8, halign: 'center' },
              bodyStyles: { fontSize: 7.5, cellPadding: 2 },
              columnStyles: {
                0: { halign: 'center', cellWidth: 10 },
                1: { cellWidth: 65 },
                2: { cellWidth: 40 },
                3: { halign: 'center', cellWidth: 15 },
                4: { cellWidth: 50 }
              }
            });
            y = doc.lastAutoTable.finalY + 7;
          } else {
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.text('Belum ada sertifikat tahun ini.', margin, y + 5);
            y += 10;
          }

          // ===== LISENSI KHUSUS =====
          if (y > pageH - 55) { doc.addPage(); y = margin; }
          doc.setFontSize(11);
          doc.setFont('helvetica', 'bold');
          doc.text(`LISENSI / SK KHUSUS (${lisensi.length})`, margin, y);
          y += 2;

          if (lisensi.length > 0) {
            const lisensiRows = lisensi.map((k, i) => [
              i + 1,
              k.jenis_kualifikasi || '-',
              k.nomor_sk_lisensi || '-',
              k.lembaga_penerbit || '-',
              this.formatDateDisplay(k.tgl_habis_berlaku),
              this.isLicenseExpiringSoon(k.tgl_habis_berlaku) ? 'H-90 ALERT' : (k.status_kualifikasi || 'AKTIF')
            ]);
            doc.autoTable({
              startY: y,
              head: [['No', 'Jenis Lisensi', 'No. SK', 'Lembaga', 'Berlaku s/d', 'Status']],
              body: lisensiRows,
              theme: 'grid',
              margin: { left: margin, right: margin },
              headStyles: { fillColor: [124, 58, 237], textColor: 255, fontStyle: 'bold', fontSize: 8, halign: 'center' },
              bodyStyles: { fontSize: 7.5, cellPadding: 2 },
              columnStyles: {
                0: { halign: 'center', cellWidth: 10 },
                1: { cellWidth: 45 },
                2: { cellWidth: 35 },
                3: { cellWidth: 40 },
                4: { halign: 'center', cellWidth: 25 },
                5: { halign: 'center', cellWidth: 25 }
              }
            });
            y = doc.lastAutoTable.finalY + 7;
          } else {
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.text('Belum ada lisensi khusus tercatat.', margin, y + 5);
            y += 10;
          }

          // ===== SKJ GAP =====
          if (y > pageH - 55) { doc.addPage(); y = margin; }
          doc.setFontSize(11);
          doc.setFont('helvetica', 'bold');
          doc.text(`STANDAR KOMPETENSI JABATAN (${skjList.length})`, margin, y);
          y += 2;

          if (skjList.length > 0) {
            const skjRows = skjList.map((s, i) => [
              i + 1,
              s.nama_diklat || '-',
              (s.minimal_jp || 20) + ' JP',
              s.tingkat_kebutuhan || 'WAJIB',
              s.is_terpenuhi ? 'TERPENUHI' : 'GAP'
            ]);
            doc.autoTable({
              startY: y,
              head: [['No', 'Standar Diklat', 'Min. JP', 'Kebutuhan', 'Status']],
              body: skjRows,
              theme: 'grid',
              margin: { left: margin, right: margin },
              headStyles: { fillColor: [2, 132, 199], textColor: 255, fontStyle: 'bold', fontSize: 8, halign: 'center' },
              bodyStyles: { fontSize: 7.5, cellPadding: 2 },
              columnStyles: {
                0: { halign: 'center', cellWidth: 10 },
                1: { cellWidth: 90 },
                2: { halign: 'center', cellWidth: 20 },
                3: { halign: 'center', cellWidth: 25 },
                4: { halign: 'center', cellWidth: 35 }
              }
            });
            y = doc.lastAutoTable.finalY + 12;
          } else {
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.text('Tidak ada standar SKJ spesifik untuk jabatan ini.', margin, y + 5);
            y += 12;
          }

          // ===== FOOTER PENGESAHAN =====
          if (y > pageH - 50) { doc.addPage(); y = margin + 10; }
          doc.setFontSize(9);
          doc.setFont('helvetica', 'normal');
          const tglCetak = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
          doc.text(`Trenggalek, ${tglCetak}`, pageW - margin, y, { align: 'right' });
          y += 5;
          doc.text('Kepala Satuan Polisi Pamong Praja', pageW - margin, y, { align: 'right' });
          y += 4;
          doc.text('dan Pemadam Kebakaran Kabupaten Trenggalek', pageW - margin, y, { align: 'right' });
          y += 22;

          doc.setFont('helvetica', 'normal');
          doc.text('( ..................................... )', pageW - margin, y, { align: 'right' });
          y += 5;
          doc.text('NIP. .................................  ', pageW - margin, y, { align: 'right' });

          // Footer info
          doc.setFontSize(7);
          doc.setTextColor(150);
          doc.text(
            `Dicetak otomatis oleh SI-KOMPETENSI pada ${new Date().toLocaleString('id-ID')}`,
            pageW / 2, pageH - 8, { align: 'center' }
          );

          const fileName = `Paspor_Kompetensi_${String(namaPegawai).replace(/[^a-zA-Z0-9]/g, '_')}_${tahunEvaluasi}.pdf`;
          doc.save(fileName);
          this.showToast('Paspor Kompetensi PDF berhasil diunduh.', 'success');
        } catch (e) {
          console.error('Gagal cetak Paspor PDF:', e);
          this.showToast('Gagal membuat PDF: ' + (e.message || 'Error tidak dikenal'), 'error');
        }
      },

      // ================= CETAK ANALISIS PDF =================
      async cetakAnalisaPDF() {
        if (!(await this.loadLib('pdf'))) {
          // (pesan error kini otomatis dari loadLib)
          return;
        }

        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF('l', 'mm', 'a4');

          // Header
          doc.setFontSize(13);
          doc.setFont('helvetica', 'bold');
          doc.text('LAPORAN ANALISIS KESENJANGAN STANDAR KOMPETENSI JABATAN (SKJ)', 14, 15);

          doc.setFontSize(9);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(75, 85, 99);
          doc.text('Satuan Polisi Pamong Praja dan Pemadam Kebakaran Kabupaten Trenggalek', 14, 21);
          doc.text(
            `Tahun Evaluasi: ${this.analisaTahun} | Kepatuhan SKJ: ${this.analisaData.persen_kepatuhan || 0}% | Total Gap: ${this.analisaData.gap_count || 0} (${this.analisaData.total_wajib_gap || 0} Wajib) | Dicetak: ${new Date().toLocaleDateString('id-ID')}`,
            14, 26
          );

          const rows = (this.filteredAnalisaGap || this.analisaData.gap_details || []).map((g, i) => [
            i + 1,
            `${this.formatNamaPegawai(g.nama_pegawai)}\nNIP. ${g.nip || '-'}`,
            g.nama_unit || '-',
            g.nama_jabatan || '-',
            `${g.nama_diklat || '-'}\n(${g.rumpun || '-'})`,
            `${g.minimal_jp || 20} JP`,
            g.tingkat_kebutuhan || 'WAJIB',
            g.rekomendasi_tindak_lanjut || 'Prioritaskan masuk Rencana Diklat'
          ]);

          doc.autoTable({
            startY: 31,
            head: [['No', 'Pegawai & NIP', 'Unit Kerja / Bidang', 'Posisi Jabatan', 'Standar Diklat SKJ', 'Min. JP', 'Kategori', 'Rekomendasi Tindak Lanjut']],
            body: rows,
            theme: 'grid',
            headStyles: { fillColor: [5, 150, 105], textColor: 255, fontStyle: 'bold', fontSize: 8, halign: 'center' },
            bodyStyles: { fontSize: 7.5, cellPadding: 2.5 },
            columnStyles: {
              0: { halign: 'center', cellWidth: 10 },
              1: { cellWidth: 48 },
              2: { cellWidth: 40 },
              3: { cellWidth: 42 },
              4: { cellWidth: 50 },
              5: { halign: 'center', cellWidth: 16 },
              6: { halign: 'center', cellWidth: 20 },
              7: { cellWidth: 42 }
            }
          });

          doc.save(`Laporan_Analisis_Kesenjangan_SKJ_${this.analisaTahun}.pdf`);
          this.showToast('Laporan Analisis Kesenjangan PDF berhasil diunduh.', 'success');
        } catch (e) {
          console.error('Gagal cetak PDF:', e);
          this.showToast('Gagal membuat PDF: ' + (e.message || 'Error tidak dikenal'), 'error');
        }
      },

      // ================= EXPORT ANALISA EXCEL (.XLSX) =================
      async exportAnalisaExcel() {

        const data = this.filteredAnalisaGap || this.analisaData.gap_details || [];
        if (!data.length) {
          this.showToast('Tidak ada data analisis untuk diekspor.', 'warning');
          return;
        }

        try {
          const rows = data.map((g, idx) => ({
            'No': idx + 1,
            'NIP': g.nip || '',
            'Nama Pegawai': g.nama_pegawai || this.getPegawaiNama(g.pegawai_id) || this.namaPegawai(g.pegawai_id) || '',
            'Unit Kerja': g.nama_unit || '',
            'Posisi Jabatan': g.nama_jabatan || '',
            'Standar Diklat SKJ': g.nama_diklat || '',
            'Rumpun Diklat': g.rumpun || '',
            'Target Min JP': Number(g.minimal_jp || 20),
            'Realisasi JP': Number(g.realisasi_jp || 0),
            'Kategori Kebutuhan': g.tingkat_kebutuhan || 'WAJIB',
            'Status Gap': g.status_gap || '',
            'Rekomendasi Tindak Lanjut': g.rekomendasi_tindak_lanjut || ''
          }));

          await this.exportExcel(rows, `SI-KOMPETENSI_Analisis_SKJ_${this.analisaTahun}.xlsx`, 'Analisis_Kesenjangan_SKJ');
        } catch (e) {
          console.error('Gagal export Excel analisa:', e);
          this.showToast('Gagal mengekspor Excel: ' + (e.message || 'Error tidak dikenal'), 'error');
        }
      }
    }
  };
</script>
