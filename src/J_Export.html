<script>
  window.SIKompetensiExport = {
    methods: {
      // ================= CHART RENDERING =================
      renderDashboardCharts() {
        if (typeof Chart === 'undefined') return;

        // 1. Chart Donut Target JP
        const el20Jp = document.getElementById('chart20JpCanvas');
        if (el20Jp) {
          if (this.chart20JpInstance) {
            this.chart20JpInstance.destroy();
          }
          const lulus = this.dashboardData.pegawai_lulus_20jp || 0;
          const total = this.dashboardData.total_pegawai || 10;
          const sisa = Math.max(0, total - lulus);

          this.chart20JpInstance = new Chart(el20Jp, {
            type: 'doughnut',
            data: {
              labels: ['Tuntas Target', 'Dalam Proses'],
              datasets: [{
                data: [lulus, sisa],
                backgroundColor: ['#10b981', '#cbd5e1'],
                borderWidth: 0,
                hoverOffset: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false }
              },
              cutout: '72%'
            }
          });
        }

        // 2. Chart Bar Rumpun
        const elRumpun = document.getElementById('chartRumpunCanvas');
        if (elRumpun) {
          if (this.chartRumpunInstance) {
            this.chartRumpunInstance.destroy();
          }
          const jc = this.dashboardData.jenis_count || {};
          const labels = ['Manajerial', 'Teknis Gakda', 'Teknis Damkar', 'Fungsional', 'Bimtek'];
          const dataCounts = [
            jc['Manajerial & Kepemimpinan'] || 0,
            jc['Teknis Penegakan Perda (PPNS)'] || 0,
            jc['Teknis Pemadam & Rescue'] || 0,
            jc['Jabatan Fungsional Pol PP & Damkar'] || 0,
            jc['Bimbingan Teknis & Workshop'] || 0
          ];

          this.chartRumpunInstance = new Chart(elRumpun, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: 'Jumlah Pelatihan',
                data: dataCounts,
                backgroundColor: ['#10b981', '#14b8a6', '#f59e0b', '#6366f1', '#f43f5e'],
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false }
              },
              scales: {
                y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                x: { grid: { display: false } }
              }
            }
          });
        }
      },

      // ================= EXPORT EXCEL (.XLSX) =================
      async exportKompetensiExcel() {
        if (typeof XLSX === 'undefined') {
          this.showToast('Pustaka Excel sedang dimuat...', 'info');
          return;
        }
        const dataToExport = this.kompetensiList.map((k, i) => ({
          'No': i + 1,
          'Nama Pegawai': k.nama_pegawai || this.namaPegawai(k.pegawai_id),
          'NIP': k.nip || this.nipPegawai(k.pegawai_id),
          'Kegiatan Diklat': k.nama_kegiatan || '',
          'Rumpun': k.rumpun || '',
          'Penyelenggara': k.penyelenggara || '',
          'No. Sertifikat': k.no_sertifikat || '',
          'Jumlah JP': k.jumlah_jp || 0,
          'Tgl Mulai': this.formatDate(k.tgl_mulai),
          'Tgl Selesai': this.formatDate(k.tgl_selesai),
          'Status': k.status_verifikasi || 'disetujui'
        }));
        const ws = XLSX.utils.json_to_sheet(dataToExport);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Data_Kompetensi');
        XLSX.writeFile(wb, `SI-KOMPETENSI_Portofolio_${new Date().getFullYear()}.xlsx`);
        this.showToast('Data Portofolio Diklat berhasil diekspor ke Excel.', 'success');
      },

      async exportMatriksExcel() {
        if (typeof XLSX === 'undefined') {
          this.showToast('Pustaka Excel sedang dimuat...', 'info');
          return;
        }
        const matriks = this.dashboardData.matriks_bulanan || [];
        const rows = matriks.map((m, idx) => ({
          'No': idx + 1,
          'Nama Pegawai': m.nama_pegawai || this.namaPegawai(m.pegawai_id),
          'NIP': m.nip || this.nipPegawai(m.pegawai_id),
          'Status': m.status_pegawai || 'PNS',
          'Unit Kerja': m.unit_nama || '',
          'Jan': m.bulan[0], 'Feb': m.bulan[1], 'Mar': m.bulan[2], 'Apr': m.bulan[3],
          'Mei': m.bulan[4], 'Jun': m.bulan[5], 'Jul': m.bulan[6], 'Agt': m.bulan[7],
          'Sep': m.bulan[8], 'Okt': m.bulan[9], 'Nov': m.bulan[10], 'Des': m.bulan[11],
          'Total JP': m.total_jp,
          'Target Standar': m.target_jp + ' JP',
          'Status Capaian': m.total_jp >= m.target_jp ? 'TUNTAS' : 'DALAM PROSES'
        }));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Matriks_12_Bulan_JP');
        XLSX.writeFile(wb, `SI-KOMPETENSI_Matriks_JP_${new Date().getFullYear()}.xlsx`);
        this.showToast('Matriks Akumulasi JP berhasil diekspor ke Excel.', 'success');
      },

            async exportRencanaExcel() {
        if (typeof XLSX === "undefined") {
          this.showToast("Pustaka Excel sedang dimuat...", "info");
          return;
        }
        const dataToExport = (this.filteredRencanaList || []).map((u, i) => ({
          "No": i + 1,
          "Tahun Anggaran": u.tahun_anggaran || u.tahun_anggaran_target || 2026,
          "Periode": u.periode_triwulan || "TW I",
          "Unit Kerja": this.namaUnit(u.unit_id) || "Semua Bidang",
          "Sasaran Personel": u.pegawai_id ? (this.namaPegawai(u.pegawai_id) || u.nama_pegawai) : "Semua Personel",
          "Program Pelatihan Terencana": u.nama_program_diklat || u.nama_diklat_usulan || "",
          "Rumpun": u.rumpun || "",
          "Metode": u.metode || "Klasikal",
          "Target JP": Number(u.target_jp || u.jumlah_jp || 20),
          "Penyelenggara": u.penyelenggara || u.target_penyelenggara || "",
          "Sumber Dana": u.sumber_dana || "APBD Kabupaten Trenggalek",
          "Estimasi Biaya (Rp)": Number(u.estimasi_biaya || 0),
          "Status Realisasi": u.status_rencana || (u.is_terealisasi ? "Terealisasi" : "Direncanakan"),
          "Alasan / Justifikasi": u.alasan_justifikasi || u.alasan_usulan || ""
        }));
        const ws = XLSX.utils.json_to_sheet(dataToExport);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rencana_Diklat_Tahunan");
        XLSX.writeFile(wb, `SI-KOMPETENSI_Rencana_Diklat_${new Date().getFullYear()}.xlsx`);
        this.showToast("Rekap Rencana Diklat Tahunan berhasil diekspor ke Excel.", "success");
      },

      // ================= CETAK ANALISIS PDF & EXCEL =================

      cetakAnalisaPDF() {
        if (typeof jspdf === 'undefined') {
          this.showToast('Pustaka PDF sedang dimuat...', 'info');
          return;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');

        // Header
        doc.setFontSize(13);
        doc.setFont('helvetica', 'bold');
        doc.text('LAPORAN ANALISIS KESENJANGAN STANDAR KOMPETENSI JABATAN (SKJ)', 14, 15);
        
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(75, 85, 99);
        doc.text('Satuan Polisi Pamong Praja dan Pemadam Kebakaran Kabupaten Trenggalek', 14, 21);
        doc.text(`Tahun Evaluasi: ${this.analisaTahun} | Kepatuhan SKJ: ${this.analisaData.persen_kepatuhan || 0}% | Total Gap: ${this.analisaData.gap_count || 0} (${this.analisaData.total_wajib_gap || 0} Wajib) | Dicetak: ${new Date().toLocaleDateString('id-ID')}`, 14, 26);

        const rows = (this.filteredAnalisaGap || this.analisaData.gap_details || []).map((g, i) => [
          i + 1,
          `${this.formatNamaPegawai(g.nama_pegawai)}\nNIP. ${g.nip || '-'}`,
          g.nama_unit || '-',
          g.nama_jabatan || '-',
          `${g.nama_diklat || '-'}\n(${g.rumpun || '-'})`,
          `${g.minimal_jp || 20} JP`,
          g.tingkat_kebutuhan || 'WAJIB',
          g.rekomendasi_tindak_lanjut || 'Prioritaskan masuk Rencana Diklat'
        ]);

        doc.autoTable({
          startY: 31,
          head: [['No', 'Pegawai & NIP', 'Unit Kerja / Bidang', 'Posisi Jabatan', 'Standar Diklat SKJ', 'Min. JP', 'Kategori', 'Rekomendasi Tindak Lanjut']],
          body: rows,
          theme: 'grid',
          headStyles: { fillColor: [5, 150, 105], textColor: 255, fontStyle: 'bold', fontSize: 8, halign: 'center' },
          bodyStyles: { fontSize: 7.5, cellPadding: 2.5 },
          columnStyles: {
            0: { halign: 'center', cellWidth: 10 },
            1: { cellWidth: 48 },
            2: { cellWidth: 40 },
            3: { cellWidth: 42 },
            4: { cellWidth: 50 },
            5: { halign: 'center', cellWidth: 16 },
            6: { halign: 'center', cellWidth: 20 },
            7: { cellWidth: 42 }
          }
        });

        doc.save(`Laporan_Analisis_Kesenjangan_SKJ_${this.analisaTahun}.pdf`);
        this.showToast('Laporan Analisis Kesenjangan PDF berhasil diunduh.', 'success');
      },

      exportAnalisaExcel() {
        const data = this.filteredAnalisaGap || this.analisaData.gap_details || [];
        if (!data.length) {
          this.showToast('Tidak ada data analisis untuk diekspor.', 'warning');
          return;
        }

        const headers = ['No', 'NIP', 'Nama Pegawai', 'Unit Kerja', 'Posisi Jabatan', 'Standar Diklat SKJ', 'Rumpun Diklat', 'Target Min JP', 'Realisasi JP', 'Kategori Kebutuhan', 'Status Gap', 'Rekomendasi Tindak Lanjut'];
        const csvRows = [headers.join(',')];

        data.forEach((g, idx) => {
          const row = [
            idx + 1,
            `"${g.nip || ''}"`,
            `"${(g.nama_pegawai || '').replace(/"/g, '""')}"`,
            `"${(g.nama_unit || '').replace(/"/g, '""')}"`,
            `"${(g.nama_jabatan || '').replace(/"/g, '""')}"`,
            `"${(g.nama_diklat || '').replace(/"/g, '""')}"`,
            `"${(g.rumpun || '').replace(/"/g, '""')}"`,
            g.minimal_jp || 20,
            g.realisasi_jp || 0,
            `"${g.tingkat_kebutuhan || 'WAJIB'}"`,
            `"${(g.status_gap || '').replace(/"/g, '""')}"`,
            `"${(g.rekomendasi_tindak_lanjut || '').replace(/"/g, '""')}"`
          ];
          csvRows.push(row.join(','));
        });

        const csvContent = '\uFEFF' + csvRows.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `Analisis_Kesenjangan_SKJ_${this.analisaTahun}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.showToast('Data Analisis Kesenjangan berhasil diekspor ke CSV/Excel.', 'success');
      }
    }
  };
</script>
