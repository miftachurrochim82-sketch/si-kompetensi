<!-- ============================================================
     SI-KOMPETENSI - V_DiklatPortofolio.html (v5.4.0)
     3 Tabs: Agenda Jadwal, Portofolio Sertifikat, Lisensi Khusus
     ============================================================
     Changelog v5.4.0 (2026-09-13):
     - 🎨 LAYOUT: Tombol aksi (Tambah/Upload) dipindah dari header
       halaman ke dalam filter bar setiap tab.
     - 🎨 TAB 1 (Agenda): Search dihapus — hanya 3 filter
       (Tahun/Bulan/Rumpun) + [🔄 Refresh] [＋ Tambah] di kolom 4.
     - 🎨 TAB 2 (Portofolio): Grid 5 kolom @20% —
       Search, Tahun, Bulan, Unit, [🔄 Refresh] [⬆ Upload].
     - 🎨 TAB 3 (Lisensi): Grid 4 kolom @25% —
       Search, Tahun, Jenis, [🔄 Refresh] [＋ Tambah].
     - 🟡 HEADER: Hanya tombol "Ekspor Excel" yang tetap di header
       (khusus Tab Portofolio).
     - 🟡 REFRESH: Setiap tab punya tombol Refresh sendiri, bind
       ke loader yang sesuai + disabled state saat loading.
     Changelog v5.3.0 (2026-09-13):
     - 📐 TABLE: min-w di ketiga tabel (1000px/1100px/1000px).
     Changelog v5.2.1 (2026-09-13):
     - Tab navigation: full width grid 3 kolom sama besar.
     ============================================================ -->

<section v-if="currentPage === 'diklat_portofolio' || currentPage === 'jadwal_penugasan' || currentPage === 'riwayat_laporan' || currentPage === 'kualifikasi_khusus'" class="space-y-6">

  <!-- Header Halaman -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2.5">
        <i class="fa-solid fa-graduation-cap text-emerald-500 text-2xl"></i>
        <span>Diklat, Portofolio &amp; Lisensi ASN</span>
      </h2>
      <p class="text-xs text-slate-500 mt-1">Manajemen agenda pelatihan, portofolio sertifikat, dan lisensi khusus SK PPNS/Damkar.</p>
    </div>

    <!-- Header Actions — context-aware per tab -->
    <div class="flex flex-wrap items-center gap-2">

      <!-- Tab Portofolio: Ekspor Excel + Rekap per Unit -->
      <button v-if="diklatSubTab === 'portofolio'"
              @click="exportKompetensiExcel()"
              class="btn btn-secondary text-xs px-3.5 py-2.5 flex items-center gap-1.5 shadow-sm rounded-xl">
        <i class="fa-solid fa-file-excel text-emerald-600"></i>
        <span>Ekspor Portofolio</span>
      </button>
      <button v-if="diklatSubTab === 'portofolio'"
              @click="exportPortofolioPerUnitExcel()"
              class="btn btn-secondary text-xs px-3.5 py-2.5 flex items-center gap-1.5 shadow-sm rounded-xl">
        <i class="fa-solid fa-building-columns text-blue-600"></i>
        <span>Rekap per Unit</span>
      </button>

      <!-- Tab Lisensi: Monitoring H-90 -->
      <button v-if="diklatSubTab === 'lisensi'"
              @click="exportLisensiH90Excel()"
              class="btn btn-secondary text-xs px-3.5 py-2.5 flex items-center gap-1.5 shadow-sm rounded-xl">
        <i class="fa-solid fa-shield-halved text-amber-600"></i>
        <span>Monitoring H-90</span>
      </button>

    </div>
  </div>

  <!-- Tab Navigasi (Full Width, Equal Grid) -->
  <div class="grid grid-cols-3 gap-2 p-1.5 bg-slate-200/70 dark:bg-slate-800/80 rounded-2xl w-full">
    <button @click="diklatSubTab = 'jadwal'"
            class="px-3 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 whitespace-nowrap"
            :class="diklatSubTab === 'jadwal'
              ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30 ring-1 ring-emerald-500'
              : 'bg-emerald-600/15 dark:bg-emerald-600/20 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-600/25 dark:hover:bg-emerald-600/30'">
      <i class="fa-solid fa-calendar-days"></i>
      <span class="hidden sm:inline">Agenda Jadwal Diklat</span>
      <span class="sm:hidden">Jadwal</span>
      <span class="px-2 py-0.5 rounded-full text-[10px] font-black"
            :class="diklatSubTab === 'jadwal'
              ? 'bg-white/25 text-white'
              : 'bg-emerald-700/20 dark:bg-emerald-300/20 text-emerald-800 dark:text-emerald-200'">
        {{ filteredJadwalList.length }}
      </span>
    </button>

    <button @click="diklatSubTab = 'portofolio'"
            class="px-3 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 whitespace-nowrap"
            :class="diklatSubTab === 'portofolio'
              ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30 ring-1 ring-emerald-500'
              : 'bg-emerald-600/15 dark:bg-emerald-600/20 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-600/25 dark:hover:bg-emerald-600/30'">
      <i class="fa-solid fa-certificate"></i>
      <span class="hidden sm:inline">Portofolio Sertifikat</span>
      <span class="sm:hidden">Portofolio</span>
      <span class="px-2 py-0.5 rounded-full text-[10px] font-black"
            :class="diklatSubTab === 'portofolio'
              ? 'bg-white/25 text-white'
              : 'bg-emerald-700/20 dark:bg-emerald-300/20 text-emerald-800 dark:text-emerald-200'">
        {{ filteredKompetensiList.length }}
      </span>
    </button>

    <button @click="diklatSubTab = 'lisensi'"
            class="px-3 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 whitespace-nowrap"
            :class="diklatSubTab === 'lisensi'
              ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30 ring-1 ring-emerald-500'
              : 'bg-emerald-600/15 dark:bg-emerald-600/20 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-600/25 dark:hover:bg-emerald-600/30'">
      <i class="fa-solid fa-id-badge"></i>
      <span class="hidden sm:inline">Lisensi Khusus</span>
      <span class="sm:hidden">Lisensi</span>
      <span class="px-2 py-0.5 rounded-full text-[10px] font-black"
            :class="diklatSubTab === 'lisensi'
              ? 'bg-white/25 text-white'
              : 'bg-emerald-700/20 dark:bg-emerald-300/20 text-emerald-800 dark:text-emerald-200'">
        {{ filteredLisensiList.length }}
      </span>
    </button>
  </div>

  <!-- ============================================================
       TAB 1: AGENDA JADWAL DIKLAT (3 filter + Refresh + Tambah)
       ============================================================ -->
  <div v-if="diklatSubTab === 'jadwal'" class="space-y-4">

    <!-- Filter Bar — 4 kolom @25%: Tahun, Bulan, Rumpun, [Refresh + Tambah] -->
    <div class="card p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <select v-model.number="filterJadwalTahun" @change="onFilterJadwalChange" class="input text-xs py-2.5 rounded-xl">
        <option v-for="y in optionsTahun" :key="'jt-' + y" :value="y">Tahun: {{ y }}</option>
      </select>
      <select v-model.number="filterJadwalBulan" @change="onFilterJadwalChange" class="input text-xs py-2.5 rounded-xl">
        <option v-for="b in optionsBulan" :key="'jb-' + b.value" :value="b.value">{{ b.label }}</option>
      </select>
      <select v-model="filterJadwalRumpun" @change="onFilterJadwalChange" class="input text-xs py-2.5 rounded-xl">
        <option value="">Semua Rumpun</option>
        <option v-for="r in optionsRumpun" :key="r.id || r.nama_nilai" :value="r.nama_nilai">{{ r.nama_nilai }}</option>
      </select>
      <!-- Refresh (kiri) + Tambah (kanan) -->
      <div class="flex items-center gap-1.5">
        <button @click="loadJadwal()" :disabled="jadwalLoading"
                class="btn btn-secondary text-xs px-2.5 py-2.5 rounded-xl shrink-0 border-slate-200 dark:border-slate-700"
                title="Muat ulang jadwal">
          <i class="fa-solid fa-arrows-rotate" :class="{ 'fa-spin': jadwalLoading }"></i>
        </button>
        <button v-if="isAdmin" @click="openJadwalModal()"
                class="btn btn-primary text-xs px-3 py-2.5 flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-xs">
          <i class="fa-solid fa-plus"></i>
          <span>Tambah</span>
        </button>
      </div>
    </div>

    <!-- Tabel -->
    <div class="card p-5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="overflow-x-auto">
        <app-crud-table
          :items="paginatedJadwalList"
          :columns="[{ key: 'no', label: 'No' }, { key: 'namakegiatanamppenyelenggara', label: 'Nama Kegiatan &amp; Penyelenggara', thClass: 'min-w-[220px]' }, { key: 'rumpunjp', label: 'Rumpun / JP' }, { key: 'periode', label: 'Periode' }, { key: 'status', label: 'Status' }, { key: 'metode', label: 'Metode' }, { key: 'aksi', label: 'Aksi', thClass: 'min-w-[180px]' }]"
          :page="jadwalPagination.page"
          :total-pages="jadwalTotalPages"
          :total-data="filteredJadwalList.length"
          @change-page="p => jadwalPagination.page = p"
          :empty-text="jadwalList.length === 0 ? 'Belum ada agenda jadwal.' : 'Tidak ada jadwal untuk filter ini.'"
          empty-icon="fa-solid fa-calendar-xmark">
          <template #row="{ row: j, index: idx }">

              <td class="py-3 px-3 font-bold text-slate-400">{{ (jadwalPagination.page - 1) * jadwalPagination.limit + idx + 1 }}</td>
              <td class="py-3 px-4">
                <div class="font-bold text-slate-900 dark:text-white text-sm">{{ j.nama_kegiatan || j.nama_diklat }}</div>
                <div class="text-[11px] text-slate-500 mt-0.5"><i class="fa-solid fa-building-columns text-[10px]"></i> {{ j.penyelenggara }}</div>
              </td>
              <td class="py-3 px-3">
                <app-badge status="emerald" :label="(j.jumlah_jp || 20) + ' JP'"></app-badge>
                <div class="text-[10px] text-slate-400 mt-0.5">{{ j.rumpun }}</div>
              </td>
              <td class="py-3 px-3">
                <div class="font-semibold text-slate-800 dark:text-slate-200">{{ formatDate(j.tgl_mulai) }}</div>
                <div class="text-[10px] text-slate-400">s/d {{ formatDate(j.tgl_selesai) }}</div>
              </td>
              <td class="py-3 px-3"><app-badge status="info" :label="j.status_jadwal || 'Terjadwal'"></app-badge></td>
              <td class="py-3 px-3"><app-badge status="emerald" :label="j.metode || 'Klasikal'"></app-badge></td>
              <td class="py-3 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button @click="openClaimJadwalForm(j)" class="btn bg-emerald-50 hover:bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-bold" title="Input Sertifikat">
                    <i class="fa-solid fa-file-circle-check"></i>
                    <span>Klaim</span>
                  </button>
                  <button v-if="isAdmin" @click="openEditJadwal(j)" class="btn btn-secondary text-xs px-2.5 py-1.5 rounded-lg" title="Edit">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button v-if="isAdmin" @click="deleteJadwal(j.id)" class="btn btn-danger text-xs px-2 py-1.5 rounded-lg" title="Hapus">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
          </template>
        </app-crud-table>
      </div>

      <!-- Pagination -->
          </div>
  </div>

  <!-- ============================================================
       TAB 2: PORTOFOLIO SERTIFIKAT (5 kolom @20%)
       ============================================================ -->
  <div v-if="diklatSubTab === 'portofolio'" class="space-y-4">

    <!-- Filter Bar — 5 kolom @20%: Search, Tahun, Bulan, Unit, [Refresh + Upload] -->
    <div class="card p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" v-model="kompetensiSearch" @input="onFilterKompetensiChange"
               placeholder="Cari kegiatan, pegawai..."
               class="input pl-9 text-xs w-full py-2.5 rounded-xl">
      </div>
      <select v-model.number="filterKompetensiTahun" @change="onFilterKompetensiChange" class="input text-xs py-2.5 rounded-xl">
        <option v-for="y in optionsTahun" :key="'kt-' + y" :value="y">Tahun: {{ y }}</option>
      </select>
      <select v-model.number="filterKompetensiBulan" @change="onFilterKompetensiChange" class="input text-xs py-2.5 rounded-xl">
        <option v-for="b in optionsBulan" :key="'kb-' + b.value" :value="b.value">{{ b.label }}</option>
      </select>
      <select v-model="filterKompetensiUnit" @change="onFilterKompetensiChange" class="input text-xs py-2.5 rounded-xl">
        <option value="">Semua Unit Kerja</option>
        <option v-for="u in optionsUnitFilter" :key="u.id || u.unit_id" :value="u.id || u.unit_id">
          {{ u.nama_unit || u.nama }}
        </option>
      </select>
      <!-- Refresh (kiri) + Upload (kanan) -->
      <div class="flex items-center gap-1.5">
        <button @click="loadKompetensi()" :disabled="kompetensiLoading"
                class="btn btn-secondary text-xs px-2.5 py-2.5 rounded-xl shrink-0 border-slate-200 dark:border-slate-700"
                title="Muat ulang portofolio">
          <i class="fa-solid fa-arrows-rotate" :class="{ 'fa-spin': kompetensiLoading }"></i>
        </button>
        <button @click="openKompetensiForm()"
                class="btn btn-primary text-xs px-3 py-2.5 flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-xs">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Upload</span>
        </button>
      </div>
    </div>

    <!-- Tabel -->
    <div class="card p-5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="overflow-x-auto">
        <app-crud-table
          :items="paginatedKompetensiList"
          :columns="[{ key: 'no', label: 'No' }, { key: 'namapegawai', label: 'Nama Pegawai', thClass: 'min-w-[180px]' }, { key: 'kegiatanamppenyelenggara', label: 'Kegiatan &amp; Penyelenggara', thClass: 'min-w-[220px]' }, { key: 'rumpunjp', label: 'Rumpun / JP' }, { key: 'periode', label: 'Periode' }, { key: 'berkas', label: 'Berkas' }, { key: 'status', label: 'Status' }, { key: 'aksi', label: 'Aksi', thClass: 'min-w-[180px]' }]"
          :page="kompetensiPagination.page"
          :total-pages="kompetensiTotalPages"
          :total-data="filteredKompetensiList.length"
          @change-page="p => kompetensiPagination.page = p"
          :empty-text="kompetensiList.length === 0 ? 'Belum ada portofolio sertifikat.' : 'Tidak ada data untuk filter ini.'"
          empty-icon="fa-solid fa-certificate">
          <template #row="{ row: k, index: idx }">

              <td class="py-3 px-3 font-bold text-slate-400">{{ (kompetensiPagination.page - 1) * kompetensiPagination.limit + idx + 1 }}</td>
              <td class="py-3 px-4">
                <div class="font-bold text-slate-900 dark:text-white text-sm">{{ k.nama_pegawai || namaPegawai(k.pegawai_id) }}</div>
                <div class="text-[10px] text-slate-400 font-mono">{{ k.nip || nipPegawai(k.pegawai_id) }}</div>
              </td>
              <td class="py-3 px-4">
                <div class="font-bold text-slate-800 dark:text-slate-200">{{ k.nama_kegiatan }}</div>
                <div class="text-[11px] text-slate-500 mt-0.5"><i class="fa-solid fa-building-columns text-[10px]"></i> {{ k.penyelenggara }}</div>
                <div v-if="k.no_sertifikat" class="text-[10px] text-emerald-600 dark:text-emerald-400 font-mono mt-0.5">No: {{ k.no_sertifikat }}</div>
              </td>
              <td class="py-3 px-3">
                <app-badge status="emerald" :label="(k.jumlah_jp) + ' JP'" size="md"></app-badge>
                <div class="text-[10px] text-slate-400 mt-0.5">{{ k.rumpun }}</div>
              </td>
              <td class="py-3 px-3">
                <div class="font-semibold text-slate-800 dark:text-slate-200">{{ formatDate(k.tgl_mulai) }}</div>
                <div class="text-[10px] text-slate-400">s/d {{ formatDate(k.tgl_selesai) }}</div>
              </td>
              <td class="py-3 px-3 text-center">
                <a v-if="k.file_url" :href="k.file_url" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-50 hover:bg-red-100 dark:bg-red-950/40 text-red-600 dark:text-red-400 font-bold rounded-xl text-xs border border-red-200 dark:border-red-900/40 shadow-sm" title="Buka PDF">
                  <i class="fa-solid fa-file-pdf text-sm"></i>
                  <span>PDF</span>
                </a>
                <span v-else class="text-slate-400 text-xs italic">-</span>
              </td>
              <td class="py-3 px-3">
                <app-badge :status="k.status_verifikasi === 'disetujui' ? 'success' : (k.status_verifikasi === 'ditolak' ? 'danger' : (k.status_verifikasi === 'revisi' ? 'info' : 'warning'))" :label="k.status_verifikasi === 'disetujui' ? 'Disetujui' : (k.status_verifikasi === 'ditolak' ? 'Ditolak' : (k.status_verifikasi === 'revisi' ? 'Perlu Revisi' : 'Menunggu'))"></app-badge>
              </td>
              <td class="py-3 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button v-if="isVerifikator" @click="openVerifModal(k)" class="btn bg-teal-50 hover:bg-teal-100 text-teal-700 dark:bg-teal-950/40 dark:text-teal-300 text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 font-bold" title="Verifikasi">
                    <i class="fa-solid fa-stamp"></i>
                    <span>Verif</span>
                  </button>
                  <button v-if="isVerifikator || String(k.pegawai_id) === String(currentUser && currentUser.pegawai_id)" @click="openEditKompetensi(k)" class="btn btn-secondary text-xs px-2.5 py-1.5 rounded-lg" title="Edit">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button v-if="isAdmin" @click="deleteKompetensi(k.id)" class="btn btn-danger text-xs px-2 py-1.5 rounded-lg" title="Hapus">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
          </template>
        </app-crud-table>
      </div>

      <!-- Pagination -->
          </div>
  </div>

  <!-- ============================================================
       TAB 3: LISENSI KHUSUS (4 kolom @25%)
       ============================================================ -->
  <div v-if="diklatSubTab === 'lisensi'" class="space-y-4">

    <!-- Filter Bar — 4 kolom @25%: Search, Tahun, Jenis, [Refresh + Tambah] -->
    <div class="card p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" v-model="lisensiSearch" @input="onFilterLisensiChange"
               placeholder="Cari pegawai, nomor SK..."
               class="input pl-9 text-xs w-full py-2.5 rounded-xl">
      </div>
      <select v-model.number="filterLisensiTahun" @change="onFilterLisensiChange" class="input text-xs py-2.5 rounded-xl">
        <option v-for="y in optionsTahun" :key="'lt-' + y" :value="y">Tahun: {{ y }}</option>
      </select>
      <select v-model="filterLisensiJenis" @change="onFilterLisensiChange" class="input text-xs py-2.5 rounded-xl">
        <option value="">Semua Jenis Kualifikasi</option>
        <option value="SK_PPNS">SK Pengangkatan PPNS</option>
        <option value="DAMKAR_1">Sertifikasi BNSP Damkar I</option>
        <option value="SCBA_OPERATOR">Lisensi SCBA Operator</option>
        <option value="SAR_WATER">Water Rescue &amp; Selam</option>
        <option value="ROPE_RESCUE">Rope Rescue</option>
        <option value="LINMAS">Bimtek Satlinmas</option>
        <option value="LAINNYA">Lainnya</option>
      </select>
      <!-- Refresh (kiri) + Tambah (kanan) -->
      <div class="flex items-center gap-1.5">
        <button @click="loadKualifikasi()" :disabled="kualifikasiLoading"
                class="btn btn-secondary text-xs px-2.5 py-2.5 rounded-xl shrink-0 border-slate-200 dark:border-slate-700"
                title="Muat ulang lisensi">
          <i class="fa-solid fa-arrows-rotate" :class="{ 'fa-spin': kualifikasiLoading }"></i>
        </button>
        <button @click="openKualifikasiModal()"
                class="btn btn-primary text-xs px-3 py-2.5 flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-xs">
          <i class="fa-solid fa-plus"></i>
          <span>Tambah</span>
        </button>
      </div>
    </div>

    <!-- Tabel -->
    <div class="card p-5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="overflow-x-auto">
        <app-crud-table
          :items="paginatedLisensiList"
          :columns="[{ key: 'no', label: 'No' }, { key: 'namapegawai', label: 'Nama Pegawai', thClass: 'min-w-[180px]' }, { key: 'jeniskualifikasisk', label: 'Jenis Kualifikasi / SK', thClass: 'min-w-[220px]' }, { key: 'noregistrasisk', label: 'No. Registrasi / SK' }, { key: 'masaberlaku', label: 'Masa Berlaku' }, { key: 'berkas', label: 'Berkas' }, { key: 'status', label: 'Status' }, { key: 'aksi', label: 'Aksi', thClass: 'min-w-[120px]' }]"
          :page="lisensiPagination.page"
          :total-pages="lisensiTotalPages"
          :total-data="filteredLisensiList.length"
          @change-page="p => lisensiPagination.page = p"
          :empty-text="kualifikasiList.length === 0 ? 'Belum ada lisensi khusus.' : 'Tidak ada lisensi untuk filter ini.'"
          empty-icon="fa-solid fa-id-badge">
          <template #row="{ row: k, index: idx }">

              <td class="py-3 px-3 font-bold text-slate-400">{{ (lisensiPagination.page - 1) * lisensiPagination.limit + idx + 1 }}</td>
              <td class="py-3 px-4">
                <div class="font-bold text-slate-900 dark:text-white">{{ k.nama_pegawai || namaPegawai(k.pegawai_id) }}</div>
                <div class="text-[10px] text-slate-400">{{ k.nip || nipPegawai(k.pegawai_id) }}</div>
              </td>
              <td class="py-3 px-4">
                <div class="font-bold text-purple-700 dark:text-purple-300">{{ k.jenis_kualifikasi }}</div>
                <div class="text-[10px] text-slate-500">{{ k.lembaga_penerbit || 'Kemenkumham/BNSP' }}</div>
              </td>
              <td class="py-3 px-3 font-mono text-[11px] text-slate-700 dark:text-slate-300">{{ k.nomor_sk_lisensi || k.no_registrasi_nasional || '-' }}</td>
              <td class="py-3 px-3">
                <div class="font-semibold text-slate-800 dark:text-slate-200">s/d {{ formatDate(k.tgl_habis_berlaku) }}</div>
                <div class="text-[10px] text-slate-400">Terbit: {{ formatDate(k.tgl_sk_terbit) }}</div>
              </td>
              <td class="py-3 px-3 text-center">
                <a v-if="k.file_sk_url" :href="k.file_sk_url" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-red-50 hover:bg-red-100 dark:bg-red-950/40 text-red-600 dark:text-red-400 font-bold rounded-xl text-xs border border-red-200 dark:border-red-900/40 shadow-sm" title="Lihat SK">
                  <i class="fa-solid fa-file-pdf text-sm"></i>
                  <span>PDF</span>
                </a>
                <span v-else class="text-slate-400 text-xs italic">-</span>
              </td>
              <td class="py-3 px-3">
                <app-badge v-if="isLicenseExpiringSoon(k.tgl_habis_berlaku)" status="warning" label="H-90 Expired" icon="fa-solid fa-triangle-exclamation" class="animate-pulse"></app-badge>
                <app-badge v-else status="success" label="Aktif Valid"></app-badge>
              </td>
              <td class="py-3 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button v-if="isAdmin" @click="openEditKualifikasi(k)" class="btn btn-secondary text-xs px-2.5 py-1.5 rounded-lg">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button v-if="isAdmin" @click="deleteKualifikasi(k.id)" class="btn btn-danger text-xs px-2 py-1.5 rounded-lg">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
          </template>
        </app-crud-table>
      </div>

      <!-- Pagination -->
          </div>
  </div>

</section>
