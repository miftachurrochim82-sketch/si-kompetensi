<script>
  // ============================================================
  // SI-KOMPETENSI - J_Actions.html (v5.3.0)
  // Handler aksi user: modal open, save, delete, profil switcher
  // ============================================================
  // Changelog v5.3.0 (2026-09-13):
  // - 🔴 FIX: switchProfilePegawai — reset `activeProfileTab` ke
  //   'transkrip' saat ganti pegawai. Sebelumnya user stuck di
  //   sub-tab lama (mis. "Rencana") padahal lihat pegawai berbeda.
  // - 🟡 FIX: loadKompetensi(1) → loadKompetensi(). Param `1` yang
  //   dikirim tidak match signature (silent = boolean). Runtime
  //   tetap jalan (1 !== true) tapi membingungkan. Dijadikan
  //   konsisten di 3 tempat: saveKompetensi, deleteKompetensi,
  //   saveVerifikasi.
  // - 🟠 IMPROVE: deleteJadwalDiklat / deleteKualifikasi /
  //   deleteKompetensi kini tampil toast error jika backend
  //   mengembalikan success=false (sebelumnya silent fail).
  // - 📝 Header changelog ditambahkan (sebelumnya tidak ada).
  // ============================================================

  window.SIKompetensiActions = {
    methods: {
      // ================= PROFIL & PASPOR PERSONAL =================
      switchProfilePegawai(pid) {
        if (!pid) return;
        this.activeProfilePegawaiId = pid;
        // v5.3.0: reset sub-tab ke 'transkrip' agar tidak stuck di
        // tab pegawai sebelumnya (mis. user lihat "Rencana" lalu
        // ganti pegawai — harusnya balik ke "Transkrip").
        this.activeProfileTab = 'transkrip';
        const p = this.activePegawaiDetail;
        this.showToast("Beralih ke profil: " + this.formatNamaPegawai(p.nama_lengkap || p.nama), "info");
      },

      laporSertifikatPribadi() {
        this.openKompetensiForm();
        if (this.activeProfilePegawaiId) {
          this.kompetensiForm.pegawai_id = this.activeProfilePegawaiId;
        }
      },

      usulkanRencanaPribadi(stdItem) {
        this.usulanForm = {
          id: '',
          tahun_anggaran: new Date().getFullYear(),
          periode_triwulan: 'TW I (Jan - Mar)',
          unit_id: '',
          jabatan_id: '',
          pegawai_id: this.activeProfilePegawaiId || '',
          diklat_id: '',
          nama_program_diklat: '',
          nama_diklat_usulan: '',
          rumpun: 'Teknis Pemadam & Rescue',
          metode: 'Klasikal',
          penyelenggara: 'BPSDM Provinsi Jawa Timur',
          target_penyelenggara: 'BPSDM Provinsi Jawa Timur',
          target_jp: 20,
          estimasi_biaya: 0,
          sumber_dana: 'APBD Kabupaten Trenggalek',
          urgensi: 'Sangat Mendesak (Prioritas 1)',
          alasan_justifikasi: '',
          alasan_usulan: '',
          status_rencana: 'Direncanakan',
          status_usulan: 'diajukan'
        };

        if (stdItem) {
          this.usulanForm.diklat_id = stdItem.diklat_id || '';
          this.usulanForm.nama_program_diklat = stdItem.nama_diklat || '';
          this.usulanForm.nama_diklat_usulan = stdItem.nama_diklat || '';
          this.usulanForm.rumpun = stdItem.rumpun || 'Teknis Pemadam & Rescue';
          this.usulanForm.target_jp = Number(stdItem.minimal_jp) || 20;
          this.usulanForm.urgensi = stdItem.tingkat_kebutuhan === 'WAJIB'
            ? 'Sangat Mendesak (Prioritas 1)'
            : 'Mendesak (Prioritas 2)';
          this.usulanForm.alasan_justifikasi = 'Pemenuhan Standar Kompetensi Jabatan (SKJ) untuk posisi ' + (this.activePegawaiJabatan || 'terkait');
          this.usulanForm.alasan_usulan = this.usulanForm.alasan_justifikasi;
        }

        this.showUsulanForm = true;
      },

      // ================= CLIENT-SIDE PDF COMPRESSION =================
      async onPdfFileSelected(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        if (file.type !== 'application/pdf') {
          this.showToast('Harap pilih berkas berekstensi PDF.', 'error');
          return;
        }

        const initialSizeMb = (file.size / (1024 * 1024)).toFixed(2);
        this.pdfCompressInfo = `Memproses & mengompresi PDF (${initialSizeMb} MB)...`;

        try {
          const compressedBase64 = await this.compressPdfClientSide(file);
          this.kompetensiForm.file_url = compressedBase64;
          const finalSizeMb = ((compressedBase64.length * 0.75) / (1024 * 1024)).toFixed(2);
          this.pdfCompressInfo = `PDF Terkompresi: ${initialSizeMb} MB → ${finalSizeMb} MB (Siap Simpan)`;
          this.showToast('Berkas PDF berhasil dikompresi di browser!', 'success');
        } catch (err) {
          console.error('Gagal kompresi PDF:', err);
          const reader = new FileReader();
          reader.onload = (e) => {
            this.kompetensiForm.file_url = e.target.result;
            this.pdfCompressInfo = `Berkas PDF siap diunggah (${initialSizeMb} MB)`;
          };
          reader.readAsDataURL(file);
        }
      },

      async compressPdfClientSide(file) {
        if (!(await this.loadLib('pdflib', { silent: true }))) {
          return new Promise((resolve) => {
            const r = new FileReader();
            r.onload = (e) => resolve(e.target.result);
            r.readAsDataURL(file);
          });
        }

        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
        const compressedBytes = await pdfDoc.save({ useObjectStreams: true });

        let binary = '';
        const bytes = new Uint8Array(compressedBytes);
        const len = bytes.byteLength;
        for (let i = 0; i < len; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return 'data:application/pdf;base64,' + window.btoa(binary);
      },

      // ================= JADWAL PELATIHAN & KLAIM CEPAT =================
      openJadwalModal() {
        this.jadwalPenyelenggaraSelect = 'BPSDM Provinsi Jawa Timur';
        this.jadwalPenyelenggaraCustom = '';
        this.jadwalForm = {
          id: '',
          diklat_id: '',
          nama_kegiatan: '',
          rumpun: 'Teknis Pemadam & Rescue',
          penyelenggara: 'BPSDM Provinsi Jawa Timur',
          metode: 'Klasikal',
          jumlah_jp: 20,
          tgl_mulai: new Date().toISOString().slice(0, 10),
          tgl_selesai: new Date().toISOString().slice(0, 10),
          bulan_periode: 'September 2026',
          tahun_periode: new Date().getFullYear(),
          kuota_peserta: 30,
          lokasi_pelaksanaan: 'Kabupaten Trenggalek',
          link_pendaftaran: '',
          status_jadwal: 'Terjadwal',
          keterangan: ''
        };
        this.showJadwalModal = true;
      },

      openEditJadwal(j) {
        this.jadwalForm = Object.assign({}, j);
        const standardList = [
          'BPSDM Provinsi Jawa Timur',
          'BPSDM Kementerian Dalam Negeri',
          'BKPSDM Kabupaten Trenggalek',
          'Pusdiklat Penanggulangan Kebakaran & Penyelamatan Ciracas',
          'Badan Nasional Pencarian & Pertolongan (BASARNAS)',
          'Lembaga Administrasi Negara (LAN RI)',
          'Satpol PP & Damkar Kabupaten Trenggalek',
          'Kementerian Hukum dan HAM RI'
        ];
        if (standardList.includes(j.penyelenggara)) {
          this.jadwalPenyelenggaraSelect = j.penyelenggara;
          this.jadwalPenyelenggaraCustom = '';
        } else {
          this.jadwalPenyelenggaraSelect = 'Lainnya (Tulis Manual)...';
          this.jadwalPenyelenggaraCustom = j.penyelenggara || '';
        }
        this.showJadwalModal = true;
      },

      async saveJadwalDiklat() {
        this.jadwalSaving = true;
        try {
          if (this.jadwalPenyelenggaraSelect === 'Lainnya (Tulis Manual)...') {
            this.jadwalForm.penyelenggara = this.jadwalPenyelenggaraCustom || 'Lembaga Pelatihan Terakreditasi';
          } else {
            this.jadwalForm.penyelenggara = this.jadwalPenyelenggaraSelect;
          }

          const res = await this.callServer('save_jadwal', { record: this.jadwalForm });
          if (res && res.success) {
            this.showToast('Jadwal pelatihan berhasil disimpan.', 'success');
            this.showJadwalModal = false;
            await this.loadJadwal();
            await this.loadDashboard();
          } else {
            this.showToast((res && res.error) || 'Gagal menyimpan agenda', 'error');
          }
        } catch(e) {
          this.showToast('Terjadi kesalahan koneksi', 'error');
        } finally {
          this.jadwalSaving = false;
        }
      },

      async deleteJadwalDiklat(id) {
        if (!confirm('Yakin ingin menghapus agenda pelatihan ini?')) return;
        try {
          const res = await this.callServer('delete_jadwal', { id: id });
          if (res && res.success) {
            this.showToast('Agenda diklat dihapus.', 'success');
            await this.loadJadwal();
            await this.loadDashboard();
          } else {
            // v5.3.0: tampil error jika backend menolak
            this.showToast((res && res.error) || 'Gagal menghapus agenda diklat.', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menghapus: kesalahan koneksi.', 'error');
        }
      },

      // Alias untuk kompatibilitas dengan view
      async deleteJadwal(id) {
        return this.deleteJadwalDiklat(id);
      },

      openClaimJadwalForm(jadwal) {
        this.openKompetensiForm();
        this.kompetensiForm.jadwal_id = jadwal.id;
        this.kompetensiForm.diklat_id = jadwal.diklat_id || '';
        this.kompetensiForm.nama_kegiatan = jadwal.nama_kegiatan || jadwal.nama_diklat || '';
        this.kompetensiForm.rumpun = jadwal.rumpun || 'Teknis Pemadam & Rescue';
        this.kompetensiForm.penyelenggara = jadwal.penyelenggara || 'BPSDM';
        this.kompetensiForm.jumlah_jp = Number(jadwal.jumlah_jp) || 20;
        this.kompetensiForm.metode = jadwal.metode || 'Klasikal';
        this.kompetensiForm.tgl_mulai = jadwal.tgl_mulai || '';
        this.kompetensiForm.tgl_selesai = jadwal.tgl_selesai || '';
        this.showToast(`Memuat data agenda: ${this.kompetensiForm.nama_kegiatan}`, 'info');
      },

      onJadwalPelatihanChanged() {
        const selId = this.kompetensiForm.diklat_id;
        if (!selId) return;
        const j = (this.jadwalList || []).find(x => String(x.id) === String(selId));
        if (j) {
          this.kompetensiForm.jadwal_id = j.id;
          if (j.diklat_id && !this.kompetensiForm.diklat_id) {
            this.kompetensiForm.diklat_id = j.diklat_id;
          }
          this.kompetensiForm.nama_kegiatan = j.nama_kegiatan || j.nama_diklat || '';
          this.kompetensiForm.rumpun = j.rumpun || 'Teknis Pemadam & Rescue';
          this.kompetensiForm.penyelenggara = j.penyelenggara || '';
          this.kompetensiForm.jumlah_jp = Number(j.jumlah_jp) || 20;
          this.kompetensiForm.metode = j.metode || 'Klasikal';
          this.kompetensiForm.tgl_mulai = j.tgl_mulai || '';
          this.kompetensiForm.tgl_selesai = j.tgl_selesai || '';
        }
      },

      // ================= KUALIFIKASI & LISENSI KHUSUS =================
      openKualifikasiModal() {
        this.kualifikasiForm = {
          id: '',
          pegawai_id: (this.simpegLookup.pegawai && this.simpegLookup.pegawai[0] && this.simpegLookup.pegawai[0].id) || '',
          jenis_kualifikasi: 'SK_PPNS',
          nomor_sk_lisensi: '',
          no_registrasi_nasional: '',
          lembaga_penerbit: 'Kementerian Hukum & HAM RI',
          tgl_sk_terbit: new Date().toISOString().slice(0, 10),
          tgl_habis_berlaku: '',
          status_kualifikasi: 'AKTIF',
          file_sk_url: '',
          catatan_perpanjangan: ''
        };
        this.showKualifikasiModal = true;
      },

      openEditKualifikasi(k) {
        this.kualifikasiForm = Object.assign({}, k);
        this.showKualifikasiModal = true;
      },

      async saveKualifikasi() {
        // B1 lanjutan: validasi eksplisit (pengganti 'required' native select)
        if (!this.kualifikasiForm.pegawai_id) {
          this.showToast('Pilih pegawai pemilik lisensi terlebih dahulu.', 'error');
          return;
        }
        this.kualifikasiSaving = true;
        try {
          const res = await this.callServer('save_kualifikasi', { record: this.kualifikasiForm });
          if (res && res.success) {
            this.showToast('Data lisensi/kualifikasi khusus disimpan.', 'success');
            this.showKualifikasiModal = false;
            await this.loadKualifikasi();
            await this.loadDashboard();
          } else {
            this.showToast((res && res.error) || 'Gagal menyimpan lisensi', 'error');
          }
        } catch(e) {
          this.showToast('Terjadi kesalahan server', 'error');
        } finally {
          this.kualifikasiSaving = false;
        }
      },

      async deleteKualifikasi(id) {
        if (!confirm('Yakin ingin menghapus data kualifikasi ini?')) return;
        try {
          const res = await this.callServer('delete_kualifikasi', { id: id });
          if (res && res.success) {
            this.showToast('Kualifikasi dihapus.', 'success');
            await this.loadKualifikasi();
            await this.loadDashboard();
          } else {
            // v5.3.0: tampil error jika backend menolak
            this.showToast((res && res.error) || 'Gagal menghapus kualifikasi.', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menghapus: kesalahan koneksi.', 'error');
        }
      },

      // ================= PORTOFOLIO SERTIFIKAT =================
      openKompetensiForm() {
        let defaultPegawaiId = '';
        if (this.currentUser && this.currentUser.email) {
          const cur = (this.simpegLookup.pegawai || []).find(p => p.email === this.currentUser.email);
          if (cur) defaultPegawaiId = cur.id;
        }
        if (!defaultPegawaiId && this.sortedPegawaiList && this.sortedPegawaiList[0]) {
          defaultPegawaiId = this.sortedPegawaiList[0].id;
        }

        let firstJadwal = null;
        if (this.currentYearJadwalList && this.currentYearJadwalList[0]) {
          firstJadwal = this.currentYearJadwalList[0];
        }

        this.pdfCompressInfo = '';
        this.kompetensiForm = {
          id: '',
          pegawai_id: defaultPegawaiId,
          diklat_id: firstJadwal ? (firstJadwal.diklat_id || '') : '',
          jadwal_id: firstJadwal ? firstJadwal.id : '',
          nama_kegiatan: firstJadwal ? (firstJadwal.nama_kegiatan || firstJadwal.nama_diklat || '') : '',
          rumpun: firstJadwal ? (firstJadwal.rumpun || 'Teknis Pemadam & Rescue') : 'Teknis Pemadam & Rescue',
          penyelenggara: firstJadwal ? (firstJadwal.penyelenggara || 'BPSDM Provinsi Jawa Timur') : 'BPSDM Provinsi Jawa Timur',
          no_sertifikat: '',
          tgl_terbit: new Date().toISOString().slice(0, 10),
          tgl_mulai: firstJadwal ? (firstJadwal.tgl_mulai || '') : new Date().toISOString().slice(0, 10),
          tgl_selesai: firstJadwal ? (firstJadwal.tgl_selesai || '') : new Date().toISOString().slice(0, 10),
          tgl_kedaluwarsa: '',
          jumlah_jp: firstJadwal ? (Number(firstJadwal.jumlah_jp) || 20) : 20,
          metode: firstJadwal ? (firstJadwal.metode || 'Klasikal') : 'Klasikal',
          file_url: '',
          status_verifikasi: '',
          catatan_verifikator: ''
        };
        this.showKompetensiForm = true;
      },

      openEditKompetensi(k) {
        this.kompetensiForm = Object.assign({}, k);
        this.pdfCompressInfo = k.file_url ? 'Dokumen sertifikat telah terlampir' : '';
        this.showKompetensiForm = true;
      },

      async saveKompetensi() {
        // B1 (v2.7.3): validasi eksplisit — picker tidak punya 'required' native,
        // dan tombol confirm modal memang selalu melewati validasi form browser.
        if (!this.kompetensiForm.pegawai_id) {
          this.showToast('Pilih pegawai pemilik sertifikat terlebih dahulu.', 'error');
          return;
        }
        this.kompetensiSaving = true;
        try {
          if (!this.kompetensiForm.diklat_id && this.kompetensiForm.jadwal_id) {
            const j = (this.jadwalList || []).find(x => String(x.id) === String(this.kompetensiForm.jadwal_id));
            if (j && j.diklat_id) this.kompetensiForm.diklat_id = j.diklat_id;
          }
          if (this.kompetensiForm.diklat_id && !this.kompetensiForm.nama_kegiatan) {
            this.onJadwalPelatihanChanged();
          }

          const res = await this.callServer('save_riwayat', { record: this.kompetensiForm });
          if (res && res.success) {
            const isVerif = ['verifikator', 'admin', 'super'].indexOf(
              String((this.currentUser && this.currentUser.role) || '').toLowerCase()
            ) !== -1;
            this.showToast(
              isVerif
                ? 'Sertifikat berhasil disimpan & langsung dihitung.'
                : 'Sertifikat berhasil dilaporkan & menunggu verifikasi atasan.',
              'success'
            );
            this.showKompetensiForm = false;
            // v5.3.0: loadKompetensi() tanpa param `1` (signature tidak match)
            await this.loadKompetensi();
            await this.loadDashboard();
          } else {
            this.showToast((res && res.error) || 'Gagal menyimpan', 'error');
          }
        } catch(e) {
          this.showToast('Terjadi kesalahan server', 'error');
        } finally {
          this.kompetensiSaving = false;
        }
      },

      async deleteKompetensi(id) {
        if (!confirm('Yakin ingin menghapus catatan sertifikat ini?')) return;
        try {
          const res = await this.callServer('delete_riwayat', { id: id });
          if (res && res.success) {
            this.showToast('Sertifikat dihapus.', 'success');
            // v5.3.0: loadKompetensi() tanpa param `1`
            await this.loadKompetensi();
            await this.loadDashboard();
          } else {
            // v5.3.0: tampil error jika backend menolak
            this.showToast((res && res.error) || 'Gagal menghapus sertifikat.', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menghapus: kesalahan koneksi.', 'error');
        }
      },

      // ================= VERIFIKASI / REVIEW KASUBBAG =================
      openVerifModal(k) {
        this.selectedKompetensi = k;
        this.verifForm = {
          status: k.status_verifikasi || 'disetujui',
          catatan: k.catatan_verifikator || ''
        };
        this.showVerifModal = true;
      },

      async saveVerifikasi() {
        if (!this.selectedKompetensi) return;
        this.verifSaving = true;
        try {
          const res = await this.callServer('verifikasi_riwayat', {
            id: this.selectedKompetensi.id,
            status_verifikasi: this.verifForm.status,
            catatan_verifikator: this.verifForm.catatan
          });
          if (res && res.success) {
            this.showToast('Status verifikasi sertifikat berhasil diperbarui.', 'success');
            this.showVerifModal = false;
            // v5.3.0: loadKompetensi() tanpa param `1`
            await this.loadKompetensi();
            await this.loadDashboard();
          } else {
            this.showToast((res && res.error) || 'Gagal memproses verifikasi.', 'error');
          }
        } catch(e) {
          this.showToast('Gagal verifikasi: kesalahan koneksi.', 'error');
        } finally {
          this.verifSaving = false;
        }
      },

      // ================= USULAN DIKLAT =================
      openUsulanModal() {
        this.usulanForm = {
          id: '',
          tahun_anggaran: new Date().getFullYear(),
          periode_triwulan: 'TW I (Jan - Mar)',
          unit_id: '',
          jabatan_id: '',
          pegawai_id: (this.simpegLookup.pegawai && this.simpegLookup.pegawai[0] && this.simpegLookup.pegawai[0].id) || '',
          diklat_id: '',
          nama_program_diklat: '',
          nama_diklat_usulan: '',
          rumpun: 'Teknis Pemadam & Rescue',
          metode: 'Klasikal',
          penyelenggara: 'BPSDM Provinsi Jawa Timur',
          target_penyelenggara: 'BPSDM Provinsi Jawa Timur',
          target_jp: 20,
          estimasi_biaya: 0,
          sumber_dana: 'APBD Kabupaten Trenggalek',
          urgensi: 'Sangat Mendesak (Prioritas 1)',
          alasan_justifikasi: '',
          alasan_usulan: '',
          status_rencana: 'Direncanakan',
          status_usulan: 'diajukan'
        };
        this.showUsulanForm = true;
      },

      usulkanDariGap(g) {
        if (!g) return;
        this.usulanForm = {
          id: '',
          tahun_anggaran: new Date().getFullYear(),
          periode_triwulan: 'TW I (Jan - Mar)',
          unit_id: g.unit_id || '',
          jabatan_id: g.jabatan_id || '',
          pegawai_id: g.pegawai_id || '',
          diklat_id: g.diklat_id || '',
          nama_program_diklat: g.nama_diklat || '',
          nama_diklat_usulan: g.nama_diklat || '',
          rumpun: g.rumpun || 'Teknis Pemadam & Rescue',
          metode: 'Klasikal',
          penyelenggara: 'BPSDM Provinsi Jawa Timur',
          target_penyelenggara: 'BPSDM Provinsi Jawa Timur',
          target_jp: 20,
          estimasi_biaya: 0,
          sumber_dana: 'APBD Kabupaten Trenggalek',
          urgensi: g.tingkat_kebutuhan === 'WAJIB'
            ? 'Sangat Mendesak (Prioritas 1)'
            : 'Mendesak (Prioritas 2)',
          alasan_justifikasi: 'Pemenuhan Standar Kompetensi Jabatan (SKJ) untuk posisi ' + (g.nama_jabatan || 'terkait') + '.',
          alasan_usulan: 'Pemenuhan Standar Kompetensi Jabatan (SKJ) untuk posisi ' + (g.nama_jabatan || 'terkait') + '.',
          status_rencana: 'Direncanakan',
          status_usulan: 'diajukan'
        };
        this.showUsulanForm = true;
        this.showToast('Data kesenjangan otomatis diisikan ke formulir rencana diklat.', 'info');
      },

      openEditUsulan(u) {
        this.usulanForm = Object.assign({}, u);
        this.showUsulanForm = true;
      },

      async saveUsulan() {
        this.usulanSaving = true;
        try {
          const res = await this.callServer('save_usulan', { record: this.usulanForm });
          if (res && res.success) {
            this.showToast('Usulan diklat bottom-up berhasil dikirim ke pimpinan.', 'success');
            this.showUsulanForm = false;
            await this.loadUsulan();
            await this.loadDashboard();
          } else {
            this.showToast((res && res.error) || 'Gagal mengirim usulan', 'error');
          }
        } catch(e) {
          this.showToast('Gagal mengirim usulan', 'error');
        } finally {
          this.usulanSaving = false;
        }
      },

      openReviewUsulanModal(u) {
        this.selectedUsulan = u;
        this.reviewUsulanForm = {
          status: u.status_usulan || 'disetujui_kasat',
          catatan: u.catatan_pimpinan || ''
        };
        this.showReviewUsulanModal = true;
      },

      async saveReviewUsulan() {
        if (!this.selectedUsulan) return;
        this.reviewUsulanSaving = true;
        try {
          const res = await this.callServer('review_usulan', {
            id: this.selectedUsulan.id,
            status_usulan: this.reviewUsulanForm.status,
            catatan_pimpinan: this.reviewUsulanForm.catatan
          });
          if (res && res.success) {
            this.showToast('Keputusan pimpinan berhasil disimpan.', 'success');
            this.showReviewUsulanModal = false;
            await this.loadUsulan();
          } else {
            this.showToast((res && res.error) || 'Gagal memproses review', 'error');
          }
        } catch(e) {
          this.showToast('Gagal memproses review', 'error');
        } finally {
          this.reviewUsulanSaving = false;
        }
      },

      async deleteUsulan(id) {
        if (!id) return;
        if (!confirm('Yakin ingin menghapus rencana diklat ini?')) return;
        try {
          const res = await this.callServer('delete_usulan', { id: id });
          if (res && res.success) {
            this.showToast('Rencana diklat berhasil dihapus.', 'success');
            await this.loadUsulan();
            await this.loadDashboard();
          } else {
            this.showToast((res && res.error) || 'Gagal menghapus rencana', 'error');
          }
        } catch(e) {
          this.showToast('Terjadi kesalahan server', 'error');
        }
      },

      // ================= MASTER SATELIT =================
      openKatalogModal() {
        this.katalogForm = {
          id: '',
          nama_diklat: '',
          rumpun: 'Teknis Pemadam & Rescue',
          kategori_keahlian: 'Teknis Operasional',
          penyelenggara_default: 'BPSDM Jawa Timur',
          default_jp: 20,
          estimasi_biaya_default: 0
        };
        this.showKatalogModal = true;
      },

      openEditKatalog(d) {
        this.katalogForm = Object.assign({}, d);
        this.showKatalogModal = true;
      },

      async saveKatalogDiklat() {
        this.katalogSaving = true;
        try {
          const res = await this.callServer('save_katalog_diklat', { record: this.katalogForm });
          if (res && res.success) {
            this.showToast('Katalog diklat disimpan.', 'success');
            this.showKatalogModal = false;
            await this.loadMasterSatelit();
          } else {
            this.showToast((res && res.error) || 'Gagal menyimpan katalog', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menyimpan katalog', 'error');
        } finally {
          this.katalogSaving = false;
        }
      },

      async deleteKatalogDiklat(id) {
        if (!confirm('Yakin ingin menghapus master katalog diklat ini?')) return;
        try {
          const res = await this.callServer('delete_katalog_diklat', { id: id });
          if (res && res.success) {
            this.showToast('Katalog dihapus.', 'success');
            await this.loadMasterSatelit();
          } else {
            this.showToast((res && res.error) || 'Gagal menghapus katalog', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menghapus: kesalahan koneksi.', 'error');
        }
      },

      async deleteKatalog(id) {
        return this.deleteKatalogDiklat(id);
      },

      openStandarModal() {
        const firstJab = (this.optionsJabatan && this.optionsJabatan[0]) || {};
        const firstDik = (this.katalogList && this.katalogList[0]) || {};
        this.standarForm = {
          id: '',
          jabatan_id: firstJab.id || firstJab.jabatan_id || '',
          nama_jabatan: firstJab.nama_jabatan || firstJab.nama || '',
          diklat_id: firstDik.id || '',
          nama_diklat: firstDik.nama_diklat || '',
          rumpun: firstDik.rumpun || 'Manajerial & Kepemimpinan',
          level_kompetensi: 'Level 2 - Pengawas / Terampil',
          tingkat_kebutuhan: 'WAJIB',
          minimal_jp: Number(firstDik.default_jp) || 20,
          keterangan: ''
        };
        this.showStandarModal = true;
      },

      openEditStandar(s) {
        this.standarForm = Object.assign({
          id: '',
          jabatan_id: '',
          nama_jabatan: '',
          diklat_id: '',
          nama_diklat: '',
          rumpun: 'Manajerial & Kepemimpinan',
          level_kompetensi: 'Level 2 - Pengawas / Terampil',
          tingkat_kebutuhan: 'WAJIB',
          minimal_jp: 20,
          keterangan: ''
        }, s);

        if (!this.standarForm.nama_jabatan && this.standarForm.jabatan_id) {
          this.standarForm.nama_jabatan = this.namaJabatan(this.standarForm.jabatan_id);
        }
        if (!this.standarForm.nama_diklat && this.standarForm.diklat_id) {
          this.standarForm.nama_diklat = this.namaDiklat(this.standarForm.diklat_id);
        }
        if (!this.standarForm.rumpun && this.standarForm.diklat_id) {
          this.standarForm.rumpun = this.getKatalogRumpun(this.standarForm.diklat_id);
        }
        this.showStandarModal = true;
      },

      onStandarJabatanChange() {
        const j = (this.optionsJabatan || []).find(x => String(x.id || x.jabatan_id) === String(this.standarForm.jabatan_id));
        if (j) {
          this.standarForm.nama_jabatan = j.nama_jabatan || j.nama || '';
        }
      },

      onStandarDiklatChange() {
        const d = (this.katalogList || []).find(x => String(x.id) === String(this.standarForm.diklat_id));
        if (d) {
          this.standarForm.nama_diklat = d.nama_diklat || '';
          if (d.rumpun) this.standarForm.rumpun = d.rumpun;
          if (d.default_jp) this.standarForm.minimal_jp = Number(d.default_jp);
        }
      },

      async saveStandarKompetensi() {
        this.standarSaving = true;
        try {
          if (!this.standarForm.nama_jabatan && this.standarForm.jabatan_id) {
            this.standarForm.nama_jabatan = this.namaJabatan(this.standarForm.jabatan_id);
          }
          if (!this.standarForm.nama_diklat && this.standarForm.diklat_id) {
            this.standarForm.nama_diklat = this.namaDiklat(this.standarForm.diklat_id);
          }
          if (!this.standarForm.rumpun && this.standarForm.diklat_id) {
            this.standarForm.rumpun = this.getKatalogRumpun(this.standarForm.diklat_id);
          }
          const res = await this.callServer('save_standar_kompetensi', { record: this.standarForm });
          if (res && res.success) {
            this.showToast('Standar kompetensi jabatan disimpan.', 'success');
            this.showStandarModal = false;
            await this.loadMasterSatelit();
          } else {
            this.showToast((res && res.error) || 'Gagal menyimpan standar', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menyimpan standar', 'error');
        } finally {
          this.standarSaving = false;
        }
      },

      async deleteStandar(id) {
        return this.deleteStandarKompetensi(id);
      },

      async deleteStandarKompetensi(id) {
        if (!confirm('Hapus standar kompetensi jabatan ini?')) return;
        try {
          const res = await this.callServer('delete_standar_kompetensi', { id: id });
          if (res && res.success) {
            this.showToast('Standar dihapus.', 'success');
            await this.loadMasterSatelit();
          } else {
            this.showToast((res && res.error) || 'Gagal menghapus standar', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menghapus: kesalahan koneksi.', 'error');
        }
      },

      openReferensiModal() {
        this.referensiForm = {
          id: '',
          kategori: this.filterKategoriRef || 'RUMPUN_KOMPETENSI',
          kode: '',
          nama_nilai: '',
          urutan: (this.referensiList.length || 0) + 1,
          status_aktif: 'true',
          keterangan: ''
        };
        this.showReferensiModal = true;
      },

      openEditReferensi(r) {
        this.referensiForm = Object.assign({}, r);
        this.showReferensiModal = true;
      },

      async saveReferensi() {
        this.referensiSaving = true;
        try {
          const res = await this.callServer('save_referensi', { record: this.referensiForm });
          if (res && res.success) {
            this.showToast('Opsi referensi disimpan.', 'success');
            this.showReferensiModal = false;
            await this.loadMasterSatelit();
          } else {
            this.showToast((res && res.error) || 'Gagal menyimpan referensi', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menyimpan referensi', 'error');
        } finally {
          this.referensiSaving = false;
        }
      },

      async deleteReferensi(id) {
        if (!confirm('Hapus item referensi ini?')) return;
        try {
          const res = await this.callServer('delete_referensi', { id: id });
          if (res && res.success) {
            this.showToast('Referensi dihapus.', 'success');
            await this.loadMasterSatelit();
          } else {
            this.showToast((res && res.error) || 'Gagal menghapus referensi', 'error');
          }
        } catch(e) {
          this.showToast('Gagal menghapus: kesalahan koneksi.', 'error');
        }
      }
    }
  };
</script>
