<!-- ============================================================
     SI-KOMPETENSI - V_MasterSatelit.html (v5.4.0)
     Master Data Satelit: Katalog, Standar SKJ, Referensi
     ============================================================
     Changelog v5.4.0 (2026-09-13):
     - 🎨 FILTER: Refresh button dipindah dari header halaman ke
       dalam filter bar setiap tab (kiri tombol Tambah).
     - 🎨 LAYOUT: Setiap filter bar grid 4 kolom @25%, dengan
       kolom ke-4 khusus [🔄 Refresh] [＋ Tambah].
     - 🟡 REFRESH: Button kini berfungsi (bind ke loadMasterSatelit)
       + disabled state saat `masterSatelitLoading`.
     Changelog v5.3.0 (2026-09-13):
     - 📐 TABLE: min-w di ketiga tabel (900px/1200px/800px).
     Changelog v5.2.0 (2026-09-13):
     - Tab navigation full width grid 3 kolom, active solid emerald.
     - Filter + pagination di ketiga tab.
     ============================================================ -->

<section v-if="currentPage === 'master_data'" class="space-y-6">

  <!-- Header Halaman -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2">
        <i class="fa-solid fa-database text-emerald-500"></i>
        <span>Master Data Satelit SI-KOMPETENSI</span>
      </h2>
      <p class="text-xs text-slate-500 mt-1">Pengelolaan kamus katalog program diklat, standar kompetensi per jabatan, dan opsi referensi gabungan.</p>
    </div>
    <!-- v5.4.0: Refresh dipindah ke filter bar setiap tab -->
  </div>

  <!-- Tab Navigasi (Full Width, Equal Grid) -->
  <div class="grid grid-cols-3 gap-2 p-1.5 bg-slate-200/70 dark:bg-slate-800/80 rounded-2xl w-full">
    <button @click="activeMasterTab = 'katalog_diklat'"
            class="px-3 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 whitespace-nowrap"
            :class="activeMasterTab === 'katalog_diklat'
              ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30 ring-1 ring-emerald-500'
              : 'bg-emerald-600/15 dark:bg-emerald-600/20 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-600/25 dark:hover:bg-emerald-600/30'">
      <i class="fa-solid fa-book-open"></i>
      <span class="hidden sm:inline">Katalog Diklat</span>
      <span class="sm:hidden">Katalog</span>
      <span class="px-2 py-0.5 rounded-full text-[10px] font-black"
            :class="activeMasterTab === 'katalog_diklat'
              ? 'bg-white/25 text-white'
              : 'bg-emerald-700/20 dark:bg-emerald-300/20 text-emerald-800 dark:text-emerald-200'">
        {{ filteredKatalogDiklat.length }}
      </span>
    </button>

    <button @click="activeMasterTab = 'standar_jabatan'"
            class="px-3 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 whitespace-nowrap"
            :class="activeMasterTab === 'standar_jabatan'
              ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30 ring-1 ring-emerald-500'
              : 'bg-emerald-600/15 dark:bg-emerald-600/20 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-600/25 dark:hover:bg-emerald-600/30'">
      <i class="fa-solid fa-award"></i>
      <span class="hidden sm:inline">Standar Jabatan</span>
      <span class="sm:hidden">Standar</span>
      <span class="px-2 py-0.5 rounded-full text-[10px] font-black"
            :class="activeMasterTab === 'standar_jabatan'
              ? 'bg-white/25 text-white'
              : 'bg-emerald-700/20 dark:bg-emerald-300/20 text-emerald-800 dark:text-emerald-200'">
        {{ filteredStandarList.length }}
      </span>
    </button>

    <button @click="activeMasterTab = 'referensi'"
            class="px-3 sm:px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-200 flex items-center justify-center gap-2 whitespace-nowrap"
            :class="activeMasterTab === 'referensi'
              ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/30 ring-1 ring-emerald-500'
              : 'bg-emerald-600/15 dark:bg-emerald-600/20 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-600/25 dark:hover:bg-emerald-600/30'">
      <i class="fa-solid fa-sliders"></i>
      <span class="hidden sm:inline">Opsi Referensi</span>
      <span class="sm:hidden">Referensi</span>
      <span class="px-2 py-0.5 rounded-full text-[10px] font-black"
            :class="activeMasterTab === 'referensi'
              ? 'bg-white/25 text-white'
              : 'bg-emerald-700/20 dark:bg-emerald-300/20 text-emerald-800 dark:text-emerald-200'">
        {{ filteredReferensiList.length }}
      </span>
    </button>
  </div>

  <!-- ============================================================
       TAB 1: KATALOG DIKLAT
       ============================================================ -->
  <div v-if="activeMasterTab === 'katalog_diklat'" class="space-y-4">

    <!-- Filter Bar — 4 kolom @25%: Search, Rumpun, Spacer, [Refresh + Tambah] -->
    <div class="card p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" v-model="katalogSearch" @input="onFilterKatalogChange"
               placeholder="Cari nama, kode diklat..."
               class="input pl-9 text-xs w-full py-2.5 rounded-xl">
      </div>
      <select v-model="filterKatalogRumpun" @change="onFilterKatalogChange" class="input text-xs py-2.5 rounded-xl">
        <option value="">Semua Rumpun</option>
        <option v-for="r in optionsRumpun" :key="r.id || r.nama_nilai" :value="r.nama_nilai">{{ r.nama_nilai }}</option>
      </select>
      <!-- Spacer (kolom 3) -->
      <div class="hidden lg:block"></div>
      <!-- Refresh (kiri) + Tambah (kanan) — kolom 4 -->
      <div class="flex items-center gap-1.5">
        <button @click="loadMasterSatelit()" :disabled="masterSatelitLoading"
                class="btn btn-secondary text-xs px-2.5 py-2.5 rounded-xl shrink-0 border-slate-200 dark:border-slate-700"
                title="Muat ulang data">
          <i class="fa-solid fa-arrows-rotate" :class="{ 'fa-spin': masterSatelitLoading }"></i>
        </button>
        <button v-if="isAdmin" @click="openKatalogModal()"
                class="btn btn-primary text-xs px-3 py-2.5 flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-xs">
          <i class="fa-solid fa-plus"></i>
          <span>Tambah</span>
        </button>
      </div>
    </div>

    <!-- Tabel -->
    <div class="card p-5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="overflow-x-auto">
        <app-crud-table
          :items="paginatedKatalogDiklat"
          :columns="[{ key: 'no', label: 'No' }, { key: 'kode', label: 'Kode' }, { key: 'namaprogramdiklat', label: 'Nama Program Diklat', thClass: 'min-w-[220px]' }, { key: 'rumpun', label: 'Rumpun' }, { key: 'defaultjp', label: 'Default JP' }, { key: 'penyelenggara', label: 'Penyelenggara' }, { key: 'aksi', label: 'Aksi' }]"
          :page="katalogPagination.page"
          :total-pages="katalogTotalPages"
          :total-data="filteredKatalogDiklat.length"
          @change-page="p => katalogPagination.page = p"
          :empty-text="katalogList.length === 0 ? 'Belum ada katalog diklat.' : 'Tidak ada katalog untuk filter ini.'"
          empty-icon="fa-solid fa-folder-open">
          <template #row="{ row: d, index: idx }">

              <td class="py-2.5 px-3 font-bold text-slate-400">{{ (katalogPagination.page - 1) * katalogPagination.limit + idx + 1 }}</td>
              <td class="py-2.5 px-3 font-mono font-bold text-emerald-600">{{ d.kode_diklat }}</td>
              <td class="py-2.5 px-4 font-bold text-slate-900 dark:text-white">{{ d.nama_diklat }}</td>
              <td class="py-2.5 px-3 text-slate-600 dark:text-slate-300">{{ d.rumpun }}</td>
              <td class="py-2.5 px-3 font-black text-emerald-700 dark:text-emerald-400 whitespace-nowrap">{{ d.default_jp }} JP</td>
              <td class="py-2.5 px-3 text-slate-500">{{ d.penyelenggara_default || '-' }}</td>
              <td class="py-2.5 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button v-if="isAdmin" @click="openEditKatalog(d)" class="btn btn-secondary text-xs px-2 py-1 rounded-lg" title="Edit">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button v-if="isAdmin" @click="deleteKatalog(d.id)" class="btn btn-danger text-xs px-2 py-1 rounded-lg" title="Hapus">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
          </template>
        </app-crud-table>
      </div>

      <!-- Pagination -->
          </div>
  </div>

  <!-- ============================================================
       TAB 2: STANDAR JABATAN
       ============================================================ -->
  <div v-if="activeMasterTab === 'standar_jabatan'" class="space-y-4">

    <!-- Filter Bar — 4 kolom @25%: Search, Jabatan, Kebutuhan, [Refresh + Tambah] -->
    <div class="card p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" v-model="filterStandarSearch" @input="onFilterStandarChange"
               placeholder="Cari jabatan, diklat..."
               class="input pl-9 text-xs w-full py-2.5 rounded-xl">
      </div>
      <select v-model="filterStandarJabatan" @change="onFilterStandarChange" class="input text-xs py-2.5 rounded-xl">
        <option value="">Semua Jabatan</option>
        <option v-for="j in optionsJabatanFilter" :key="j.id || j.jabatan_id" :value="String(j.id || j.jabatan_id)">
          {{ j.nama_jabatan || j.nama }}
        </option>
      </select>
      <select v-model="filterStandarKebutuhan" @change="onFilterStandarChange" class="input text-xs py-2.5 rounded-xl">
        <option value="">Semua Kebutuhan</option>
        <option value="WAJIB">WAJIB</option>
        <option value="DISARANKAN">DISARANKAN</option>
      </select>
      <!-- Refresh (kiri) + Tambah (kanan) — kolom 4 -->
      <div class="flex items-center gap-1.5">
        <button @click="loadMasterSatelit()" :disabled="masterSatelitLoading"
                class="btn btn-secondary text-xs px-2.5 py-2.5 rounded-xl shrink-0 border-slate-200 dark:border-slate-700"
                title="Muat ulang data">
          <i class="fa-solid fa-arrows-rotate" :class="{ 'fa-spin': masterSatelitLoading }"></i>
        </button>
        <button v-if="isAdmin" @click="openStandarModal()"
                class="btn btn-primary text-xs px-3 py-2.5 flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-xs">
          <i class="fa-solid fa-plus"></i>
          <span>Tambah</span>
        </button>
      </div>
    </div>

    <!-- Tabel -->
    <div class="card p-5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="overflow-x-auto">
        <app-crud-table
          :items="paginatedStandarList"
          :columns="[{ key: 'no', label: 'No' }, { key: 'posisijabatan', label: 'Posisi Jabatan', thClass: 'min-w-[220px]' }, { key: 'syaratprogramdiklat', label: 'Syarat Program Diklat', thClass: 'min-w-[220px]' }, { key: 'rumpun', label: 'Rumpun', thClass: 'min-w-[150px]' }, { key: 'levelkompetensi', label: 'Level Kompetensi', thClass: 'min-w-[140px]' }, { key: 'kategori', label: 'Kategori' }, { key: 'minjp', label: 'Min. JP' }, { key: 'keterangan', label: 'Keterangan', thClass: 'min-w-[200px]' }, { key: 'aksi', label: 'Aksi' }]"
          :page="standarPagination.page"
          :total-pages="standarTotalPages"
          :total-data="filteredStandarList.length"
          @change-page="p => standarPagination.page = p"
          :empty-text="standarList.length === 0 ? 'Belum ada standar kompetensi jabatan.' : 'Tidak ada standar untuk filter ini.'"
          empty-icon="fa-solid fa-award">
          <template #row="{ row: s, index: idx }">

              <td class="py-3 px-3 font-bold text-slate-400 text-center">{{ (standarPagination.page - 1) * standarPagination.limit + idx + 1 }}</td>
              <td class="py-3 px-4">
                <div class="font-bold text-slate-900 dark:text-white leading-snug">
                  {{ s.nama_jabatan || namaJabatan(s.jabatan_id) }}
                </div>
                <div v-if="s.jabatan_id && s.jabatan_id !== (s.nama_jabatan || namaJabatan(s.jabatan_id))"
                     class="text-[10px] text-slate-400 font-mono mt-0.5">
                  ID: {{ s.jabatan_id }}
                </div>
              </td>
              <td class="py-3 px-4">
                <div class="font-bold text-emerald-700 dark:text-emerald-300">
                  {{ s.nama_diklat || namaDiklat(s.diklat_id) }}
                </div>
              </td>
              <td class="py-3 px-3 text-slate-600 dark:text-slate-300">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">
                  {{ s.rumpun || getKatalogRumpun(s.diklat_id) || '-' }}
                </span>
              </td>
              <td class="py-3 px-3 font-medium text-slate-600 dark:text-slate-300 text-[11px]">
                {{ s.level_kompetensi || '-' }}
              </td>
              <td class="py-3 px-3 text-center">
                <app-badge :status="s.tingkat_kebutuhan === 'WAJIB' ? 'danger' : 'warning'" :label="s.tingkat_kebutuhan"></app-badge>
              </td>
              <td class="py-3 px-3 font-black text-emerald-600 dark:text-emerald-400 text-center whitespace-nowrap">
                {{ s.minimal_jp }} JP
              </td>
              <td class="py-3 px-4 text-slate-500 dark:text-slate-400 text-[11px] leading-relaxed">
                {{ s.keterangan || '-' }}
              </td>
              <td class="py-3 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button v-if="isAdmin" @click="openEditStandar(s)" class="btn btn-secondary text-xs px-2.5 py-1.5 rounded-lg" title="Edit">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button v-if="isAdmin" @click="deleteStandar(s.id)" class="btn btn-danger text-xs px-2.5 py-1.5 rounded-lg" title="Hapus">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
          </template>
        </app-crud-table>
      </div>

      <!-- Pagination -->
          </div>
  </div>

  <!-- ============================================================
       TAB 3: REFERENSI
       ============================================================ -->
  <div v-if="activeMasterTab === 'referensi'" class="space-y-4">

    <!-- Filter Bar — 4 kolom @25%: Search, Kategori, Spacer, [Refresh + Tambah] -->
    <div class="card p-4 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" v-model="referensiSearch" @input="onFilterReferensiChange"
               placeholder="Cari kategori, kode, nilai..."
               class="input pl-9 text-xs w-full py-2.5 rounded-xl">
      </div>
      <select v-model="filterKategoriRef" @change="onFilterReferensiChange" class="input text-xs py-2.5 rounded-xl">
        <option value="">Semua Kategori</option>
        <option value="RUMPUN_KOMPETENSI">RUMPUN_KOMPETENSI</option>
        <option value="METODE_PELATIHAN">METODE_PELATIHAN</option>
        <option value="PENYELENGGARA">PENYELENGGARA</option>
        <option value="URGENSI_USULAN">URGENSI_USULAN</option>
        <option value="JENIS_KUALIFIKASI_KHUSUS">JENIS_KUALIFIKASI_KHUSUS</option>
        <option value="STATUS_PEGAWAI">STATUS_PEGAWAI</option>
        <option value="PANGKAT_GOLONGAN">PANGKAT_GOLONGAN</option>
        <option value="TINGKAT_KEBUTUHAN">TINGKAT_KEBUTUHAN</option>
        <option value="JENIS_JABATAN">JENIS_JABATAN</option>
      </select>
      <!-- Spacer (kolom 3) -->
      <div class="hidden lg:block"></div>
      <!-- Refresh (kiri) + Tambah (kanan) — kolom 4 -->
      <div class="flex items-center gap-1.5">
        <button @click="loadMasterSatelit()" :disabled="masterSatelitLoading"
                class="btn btn-secondary text-xs px-2.5 py-2.5 rounded-xl shrink-0 border-slate-200 dark:border-slate-700"
                title="Muat ulang data">
          <i class="fa-solid fa-arrows-rotate" :class="{ 'fa-spin': masterSatelitLoading }"></i>
        </button>
        <button v-if="isAdmin" @click="openReferensiModal()"
                class="btn btn-primary text-xs px-3 py-2.5 flex-1 flex items-center justify-center gap-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-xs">
          <i class="fa-solid fa-plus"></i>
          <span>Tambah</span>
        </button>
      </div>
    </div>

    <!-- Tabel -->
    <div class="card p-5 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="overflow-x-auto">
        <app-crud-table
          :items="paginatedReferensiList"
          :columns="[{ key: 'no', label: 'No' }, { key: 'kategori', label: 'Kategori' }, { key: 'kode', label: 'Kode' }, { key: 'namanilaiopsi', label: 'Nama Nilai Opsi', thClass: 'min-w-[200px]' }, { key: 'keterangan', label: 'Keterangan' }, { key: 'aksi', label: 'Aksi' }]"
          :page="referensiPagination.page"
          :total-pages="referensiTotalPages"
          :total-data="filteredReferensiList.length"
          @change-page="p => referensiPagination.page = p"
          :empty-text="referensiList.length === 0 ? 'Belum ada referensi.' : 'Tidak ada referensi untuk filter ini.'"
          empty-icon="fa-solid fa-sliders">
          <template #row="{ row: r, index: idx }">

              <td class="py-2.5 px-3 font-bold text-slate-400">{{ (referensiPagination.page - 1) * referensiPagination.limit + idx + 1 }}</td>
              <td class="py-2.5 px-4 font-mono text-[11px] font-bold text-slate-600 dark:text-slate-300">{{ r.kategori }}</td>
              <td class="py-2.5 px-3 font-mono font-bold text-emerald-600">{{ r.kode }}</td>
              <td class="py-2.5 px-4 font-bold text-slate-900 dark:text-white">{{ r.nama_nilai }}</td>
              <td class="py-2.5 px-4 text-slate-500 text-[11px]">{{ r.keterangan || '-' }}</td>
              <td class="py-2.5 px-4 text-center">
                <div class="flex items-center justify-center gap-1.5">
                  <button v-if="isAdmin" @click="openEditReferensi(r)" class="btn btn-secondary text-xs px-2 py-1 rounded-lg" title="Edit">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button v-if="isAdmin" @click="deleteReferensi(r.id)" class="btn btn-danger text-xs px-2 py-1 rounded-lg" title="Hapus">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </td>
          </template>
        </app-crud-table>
      </div>

      <!-- Pagination -->
          </div>
  </div>

</section>
