name: Deploy to Google Apps Script (SI-KOMPETENSI)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install @google/clasp
        run: sudo npm install -g @google/clasp

      - name: Authenticate with Google Apps Script
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Configure Target Script ID
        run: |
          node scripts/set-script-id.js "${{ secrets.GAS_SCRIPT_ID }}"

      - name: Push Code to Google Apps Script
        run: |
          clasp push --force
